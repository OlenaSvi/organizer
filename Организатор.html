/* ── МАТРИЦА ─────────────────────────────────────────────────────────
   Порядок и формулировки — как просила Елена: строки это срочность,
   столбцы это важность.                                             */
function renderMatrix() {
  /* Рутины и идеи в матрицу не попадают: одна не про конкретный день,
     другая ещё не обязательство. Остальное — всё, включая неразобранное:
     у него тоже есть дедлайн, и его тоже надо разложить.             */
  const pool = here().filter(i => !isRoutine(i) && !isIdea(i));
  const q = { iu: [], in: [], nu: [], nn: [] };
  pool.forEach(i => q[quadrant(i)].push(i));
  /* Внутри клетки — по дедлайну: ближайшее сверху, бессрочное внизу. */
  Object.keys(q).forEach(k => q[k].sort((a, b) => sortKey(a).localeCompare(sortKey(b))));

  const box = (k, title, sub, hero) => `
    <div class="quad ${hero ? "hero" : ""}" data-drop-quad="${k}">
      <h3>${title}<span
        class="qcount">${q[k].length}</span><button class="addhere"
        data-act="newhere" data-quad="${k}" title="Создать дело сразу в этой клетке">＋</button></h3>
      <p class="qs">${hero ? `<b class="heromark">Главная клетка:</b> ` : ""}${sub}</p>
      <ul>${q[k].length
        ? q[k].map(i => `<li draggable="true" data-drag="${i.id}">
            <button class="qtick" data-act="toggle" data-id="${i.id}" title="Отметить сделанным"></button>
            <span class="qname" data-act="open" data-id="${i.id}">${kindIcon(i)}${esc(i.title)}
              <span style="color:var(--dim)">· ${esc((i.spheres || []).join(" · "))}</span>${
              ""}</span>
            ${stepBadge(i)}
            ${i.due ? `<span class="qdue">${sandFor(i)}${dateLabel(i)}</span>` : ""}</li>`).join("")
        : `<li class="quadempty">Пока ничего нет</li>`}</ul>
    </div>`;

  view.innerHTML = `<h2>Важное и срочное</h2>
    <p class="sub">Строки — срочность: считается из дедлайна и меняется только вместе с ним.
      Столбцы — важность: это всегда ваше решение. По умолчанию дело важное —
      вы его записали, значит оно зачем-то нужно.</p>
    ${awayNote(awayAll())}
    <p class="draghint">Перетащите дело в соседний столбец, чтобы сменить важность.
      Строку перетаскиванием не изменить — для этого нужен другой дедлайн.</p>
    <div class="matrix">
      <div></div>
      <div class="mhead">важное</div>
      <div class="mhead">неважное</div>

      <div class="mside">срочное</div>
      ${box("iu", "Срочное важное", "Делать сейчас. Больше ничего в этой клетке решать не надо")}
      ${box("nu", "Срочное неважное", "Дата подошла у того, что вы сами назвали неважным. Кандидаты отдать или отпустить")}

      <div class="mside">несрочное</div>
      ${box("in", "Несрочное важное", "Здесь лежит вся ваша жизнь — и именно это вечно проигрывает срочной ерунде. Поэтому одно дело отсюда каждый день стоит в «Предлагаю»", true)}
      ${box("nn", "Несрочное неважное", "Пусть лежит. Ничего страшного не происходит")}
    </div>`;
}


/* ── КАРТА ───────────────────────────────────────────────────────────
   Одни и те же задачи, три разных центра. Ничего не копируется —
   карта просто перерисовывается. Поэтому «правильные категории»
   больше не нужно угадать с первого раза.                           */
const AXES = { sphere: "по сферам", place: "по местам", person: "по людям",
               type: "по «что это»" };
const NOPLACE = "без места";

const axisValues = a => a === "place" ? S.places.concat([NOPLACE])
  : a === "person" ? S.people
  : a === "type" ? S.types.map(t => t.key) : S.spheres;
/* Ветка вида хранится ключом, а показывается именем — имена в «Что это»
   переименовываются, и подписи на карте следуют за ними сами.        */
const axisLabel = v => AXIS === "type"
  ? (S.types.find(t => t.key === v) || { name: v }).name : v;
const inAxis = (it, v) => AXIS === "place" ? (it.place || NOPLACE) === v
  : AXIS === "person" ? (it.person || "Я") === v   // без пометки — значит моё
  : AXIS === "type" ? typeDef(it.type).key === v   // с запасом: битый вид падает на первый
  : (it.spheres || []).indexOf(v) >= 0;      // на оси сфер дело бывает в нескольких
/* Дело без сферы на осях мест и людей видно как любое другое: место и
   человек у него есть. Прячет его только ось сфер — прятать больше нечего. */
const itemsIn = v => here().filter(i => inAxis(i, v));

function wrapLabel(t, max) {
  const w = String(t).split(" "), out = []; let cur = "";
  w.forEach(x => {
    if ((cur + " " + x).trim().length > max && cur) { out.push(cur); cur = x; }
    else cur = (cur + " " + x).trim();
  });
  if (cur) out.push(cur);
  return out.slice(0, 3);
}

/* Раскладка столбца листьев. Считается в ОДНОМ месте: и когда меряем,
   сколько ветке нужно места по кругу, и когда рисуем. Разъедься эти два
   счёта — ветки начнут налезать друг на друга.
   Длинное название переносится на две-три строки, а не обрезается
   многоточием: по обрубку «Собрать документы для п…» не понять, что за
   дело, а ради этого карта и нужна.                                 */
const LEAF_LINE = 22;      // знаков в строке подписи
const LEAF_LH = 14;        // высота строки
const LEAF_GAP = 9;        // просвет между листьями
function leafLayout(items) {
  const rows = items.map(it => {
    const lines = wrapLabel(it.title, LEAF_LINE);
    return { it, lines, h: Math.max(22, lines.length * LEAF_LH + 8) };
  });
  const chars = rows.reduce((m, r) =>
    Math.max(m, r.lines.reduce((n, l) => Math.max(n, l.length), 0)), 9);
  return { rows, w: chars * 7 + 22,
           h: rows.reduce((a, r) => a + r.h, 0) + LEAF_GAP * Math.max(0, rows.length - 1) };
}

/* Масштаб и сдвиг. Карта рисуется вокруг точки (0,0), поэтому
   scale() увеличивает ровно от центра — как и ожидаешь.            */
let ZOOM = 1, PAN = { x: 0, y: 0 };
/* Где сейчас нарисованы ветки — нужно, чтобы понять, куда бросили. */
let MAPNODES = [];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function renderMap() {
  /* Пустые ветки тоже видны — чтобы было куда положить первое дело.
     Прячется только пустое «без места»: это не ветка, а остаток.    */
  const vals = axisValues(AXIS).filter(v => v !== NOPLACE || itemsIn(v).length);
  const n = Math.max(vals.length, 1);
  MAPNODES = [];

  /* Ветки стоят по кругу не поровну, а по месту, которое им нужно:
     раскрытая ветка с десятью делами занимает столбец в 300px, и
     соседей приходится раздвигать — иначе столбцы налезают друг на
     друга. Считаем «вес» каждой ветки, распределяем 360° по весам и
     подбираем радиус так, чтобы всё поместилось.                   */
  /* Ширина пилюли ветки — та же формула, что при отрисовке ниже. */
  const pillW = v => Math.max((axisLabel(v) + " · " + itemsIn(v).length).length * 7.6 + 28, 58);
  const need = vals.map(v => {
    /* Даже закрытой ветке нужно место по своей ширине: у видов дел
       названия длинные («сходить / съездить · 1» — под 190px), и с
       постоянным весом соседи снизу круга слипались.               */
    const base = pillW(v) + 48;
    if (!isOpen(v)) return base;
    const lay = leafLayout(itemsIn(v));
    /* Блок раскрытой ветки занимает место и в высоту (столбец), и вбок
       (ширина подписей): вбок он задевает соседей, стоящих рядом по
       кругу, поэтому ширина входит в вес с долей, а не игнорируется. */
    return Math.max(base, lay.h + 60 + Math.min(lay.w, 260) * 0.45);
  });
  const total = need.reduce((a, b) => a + b, 0);
  const R = Math.max(155 + Math.min(n, 12) * 9, total / (2 * Math.PI) + 30);
  const angles = [];
  let acc = 0;
  need.forEach(w => { angles.push((acc + w / 2) / total * Math.PI * 2 - Math.PI / 2); acc += w; });

  /* Считаем реальные границы всего нарисованного, включая подписи.
     Раньше поле было фиксированным, и длинные названия уезжали за край. */
  const bb = { x0: -70, y0: -70, x1: 70, y1: 70 };
  const grow = (x0, y0, x1, y1) => {
    bb.x0 = Math.min(bb.x0, x0); bb.y0 = Math.min(bb.y0, y0);
    bb.x1 = Math.max(bb.x1, x1); bb.y1 = Math.max(bb.y1, y1);
  };
  const growText = (x, y, txt, fs, anchor) => {
    const w = String(txt).length * fs * 0.58;
    const x0 = anchor === "end" ? x - w : anchor === "middle" ? x - w / 2 : x;
    grow(x0, y - fs, x0 + w, y + fs * 0.45);
  };

  /* Связи собираем отдельно и выводим ПЕРВЫМИ: узлы полупрозрачные,
     и линия, дорисованная поверх, просвечивала бы сквозь пилюлю.   */
  let links = "", svg = "";
  /* Где луч под углом `a` покидает прямоугольник (полуразмеры hw, hh) —
     чтобы линия упиралась в край пилюли, а не шла в её центр.       */
  /* Где луч под углом `a` покидает прямоугольник (полуразмеры hw, hh) —
     чтобы линия упиралась в край пилюли, а не шла в её центр.       */
  const edge = (cx, cy, a, hw, hh) => {
    const ca = Math.abs(Math.cos(a)), sa = Math.abs(Math.sin(a));
    const t = Math.min(ca > 1e-6 ? hw / ca : 1e9, sa > 1e-6 ? hh / sa : 1e9);
    return { x: cx - Math.cos(a) * t, y: cy - Math.sin(a) * t };
  };
  vals.forEach((v, k) => {
    const ang = angles[k];
    const x = Math.cos(ang) * R, y = Math.sin(ang) * R;
    const items = itemsIn(v);
    /* Все оси цветные: ветка залита своим цветом целиком, её дела —
       тем же цветом, но бледным. Цвета кладём в style: var() в
       SVG-атрибутах не работает.                                    */
    const col = colorOf(AXIS, v);
    const sel = isOpen(v);
    const bLabel = axisLabel(v) + " · " + items.length;
    const pw = Math.max(bLabel.length * 7.6 + 28, 58), ph = 34;

    /* От края центрального «Я» до края пилюли ветки. */
    const cOut = edge(0, 0, ang + Math.PI, 26, 22);
    const bIn = edge(x, y, ang, pw / 2, ph / 2);
    links += `<path d="M${cOut.x} ${cOut.y} Q${Math.cos(ang) * R * .55} ${
      Math.sin(ang) * R * .55} ${bIn.x} ${bIn.y}"
      style="fill:none;stroke:var(--dash);stroke-width:1.5" opacity=".9"/>`;

    if (sel) {
      /* Листья стоят ровным столбцом сбоку от ветки, а не веером: при
         девяти делах веер превращался в кашу из пересекающихся нитей.
         От ветки идёт одна «шина» — горизонталь до колонки и вертикаль
         вдоль неё, — а от шины к каждому листу короткий отвод.       */
      const side = x >= 0 ? 1 : -1;                 // столбец наружу от центра
      const busX = x + side * (pw / 2 + 44);        // где стоит вертикаль
      /* Высота строк разная — подпись переносится, — поэтому идём
         сверху вниз с накоплением, а не шагом одной величины.      */
      const lay = leafLayout(items);
      const colW = Math.max(lay.w, 90);
      let cy = y - lay.h / 2;
      const centers = lay.rows.map(r => { const c = cy + r.h / 2;
        cy += r.h + LEAF_GAP; return c; });

      links += `<path d="M${x + side * pw / 2} ${y} H${busX}"
        style="fill:none;stroke:var(--dash);stroke-width:1.2"/>`;
      if (items.length > 1)
        links += `<path d="M${busX} ${centers[0]} V${centers[centers.length - 1]}"
          style="fill:none;stroke:var(--dash);stroke-width:1.2"/>`;

      /* Все пилюли столбца одной ширины — по самой длинной подписи:
         иначе у левого столбца рваным выглядит внешний край.        */
      lay.rows.forEach((r, j) => {
        const ly = centers[j], lw = colW, gap = 12, h = r.h;
        const px0 = side > 0 ? busX + gap : busX - gap - lw;
        links += `<path d="M${busX} ${ly} H${side > 0 ? px0 : px0 + lw}"
          style="fill:none;stroke:var(--dash);stroke-width:1.2;stroke-dasharray:3 4"/>`;
        const y0 = ly - (r.lines.length - 1) * LEAF_LH / 2 + 4;
        svg += `<g class="leaf" data-drag-map="${r.it.id}" data-from="${esc(v)}">
            <rect x="${px0}" y="${ly - h / 2}" width="${lw}" height="${h}" rx="11"
              style="fill:color-mix(in srgb, ${col} 22%, transparent)"
              data-act="open" data-id="${r.it.id}"></rect>
            <text x="${px0 + lw / 2}" y="${y0}" font-size="12"
              text-anchor="middle" style="fill:${col}" font-weight="600"
              data-act="open" data-id="${r.it.id}">${r.lines.map((l, k) =>
                `<tspan x="${px0 + lw / 2}" dy="${k ? LEAF_LH : 0}">${esc(l)}</tspan>`).join("")}</text>
          </g>`;
        grow(px0 - 4, ly - h / 2 - 4, px0 + lw + 4, ly + h / 2 + 4);
      });
    }

    /* Ветка всегда залита своим цветом целиком — она главная. Раскрытая
       чуть плотнее по тени, закрытая просто спокойнее.              */
    const bFill = `fill:${col}`;
    const bText = "fill:#fff";
    svg += `<g class="branch" data-act="branch" data-val="${esc(v)}">
      <rect x="${x - pw / 2}" y="${y - ph / 2}" width="${pw}" height="${ph}" rx="${ph / 2}"
        style="${bFill};opacity:${sel ? 1 : .82}"></rect>
      <text x="${x}" y="${y + 4.5}" font-size="13.5" font-weight="600" text-anchor="middle"
        style="${bText}" pointer-events="none">${esc(bLabel)}</text>
    </g>`;
    MAPNODES.push({ val: v, x: x, y: y, r: Math.max(pw / 2, 22) });
    grow(x - pw / 2 - 4, y - ph / 2 - 4, x + pw / 2 + 4, y + ph / 2 + 4);
  });

  svg = links + svg;
  svg += `<rect x="-26" y="-22" width="52" height="44" rx="14" style="fill:var(--accent)"></rect>
    <text x="0" y="6" font-size="17" font-weight="700" text-anchor="middle"
      style="fill:#fff">Я</text>`;

  /* Симметричное поле вокруг центра — чтобы увеличение шло от середины */
  const halfW = Math.max(Math.abs(bb.x0), Math.abs(bb.x1)) + 26;
  const halfH = Math.max(Math.abs(bb.y0), Math.abs(bb.y1)) + 26;

  const openVals = vals.filter(isOpen);
  view.innerHTML = `<h2>Карта</h2>
    <p class="sub">Здесь ничего не теряется. Раскрытые ветки такими и остаются —
      можно раскрыть все сразу и увидеть картину целиком.</p>
    ${awayNote(awayAll())}
    <p class="draghint">Дело можно перетащить с ветки на ветку — метка переедет вместе с ним.</p>
    <div class="maprow">
      <div class="axis">${Object.keys(AXES).map(a =>
        `<button data-act="axis" data-a="${a}" class="${AXIS === a ? "on" : ""}">${AXES[a]}</button>`).join("")}</div>
      <div class="maptools">
        <button data-act="openall" data-v="all" class="wide">раскрыть все</button>
        <button data-act="openall" data-v="none" class="wide">свернуть все</button>
        <button data-act="zoom" data-d="out" title="Отдалить">−</button>
        <button data-act="zoom" data-d="in" title="Приблизить">+</button>
        <button data-act="zoom" data-d="fit" class="wide" title="Показать всё">уместить</button>
      </div>
    </div>
    <svg id="map" viewBox="${-halfW} ${-halfH} ${halfW * 2} ${halfH * 2}"
         preserveAspectRatio="xMidYMid meet"><g id="mapG">${svg}</g></svg>
    ${openVals.map(v => {
      const list = itemsIn(v);
      const attr = AXIS === "place" ? `data-place="${esc(v)}"`
                 : AXIS === "person" ? `data-person="${esc(v)}"`
                 : AXIS === "type" ? `data-type="${esc(v)}"` : `data-sphere="${esc(v)}"`;
      return `<div class="branchhead">
          <h2><span style="display:inline-block;width:11px;height:11px;border-radius:50%;
            background:${colorOf(AXIS, v)};margin-right:9px"></span>Ветка «${esc(axisLabel(v))}»</h2>
          <button class="addhere" data-act="newhere" ${v === NOPLACE ? "" : attr}
            title="Создать дело в этой ветке">＋</button>
        </div>
        <p class="sub">${list.length} ${list.length === 1 ? "дело" : "дел"}</p>
        ${list.map(mapRowHTML).join("") || `<div class="empty">Пока ничего нет</div>`}`;
    }).join("")}`;

  wireMap(halfW * 2, halfH * 2);
}

const applyMapTransform = () => {
  const g = document.getElementById("mapG");
  if (g) g.setAttribute("transform", `translate(${PAN.x} ${PAN.y}) scale(${ZOOM})`);
};

let mapUnwire = null;

/* Перенос дела на другую ветку. Карта правит принадлежность так же,
   как календарь правит время, а матрица — приоритет.                */
/* Под картой — по строке на дело, как в «Списке»: карта про структуру,
   подробности — по нажатию, в окне просмотра.                       */
function mapRowHTML(i) {
  const takeable = !isRoutine(i) && !isAppt(i) && !isIdea(i);
  return `<div class="allrow">
    ${isRoutine(i) ? `<span class="tick" style="opacity:.35"></span>`
      : `<button class="tick" data-act="toggle" data-id="${i.id}" title="Отметить сделанным"></button>`}
    ${kindIcon(i)}
    <button class="suggname" data-act="open" data-id="${i.id}">${esc(i.title)}</button>
    ${stepBadge(i)}
    ${(i.spheres || []).length > 1 ? `<span class="tag place"
        title="Одна запись, видна в каждой своей ветке">в ${i.spheres.length} ветках</span>` : ""}
    ${dateLabel(i) ? `<span class="suggdate">${sandFor(i)}${dateLabel(i)}</span>` : ""}
    ${takeable ? (pickedToday(i) ? `<span class="tag">в дне</span>`
      : `<button class="linkbtn" data-act="pin" data-id="${i.id}">＋ в сегодня</button>`) : ""}
  </div>`;
}

function moveToBranch(id, target, from) {
  const it = S.items.find(x => x.id === id);
  if (!it || target === from) return false;
  if (AXIS === "place")       it.place = (target === NOPLACE ? null : target);
  else if (AXIS === "person") it.person = target;
  else if (AXIS === "type") {
    /* Перенос между видами — та же смена «что это», что и в редакторе,
       с теми же последствиями: рутине — расписание, у идеи и рутины
       срок стирается, чтобы не висеть в календаре.                  */
    it.type = target;
    if (isRoutine(it) && !it.routine) it.routine = { days: [0,1,2,3,4,5,6], history: [] };
    if (isIdea(it) || isRoutine(it)) { it.due = null; it.time = null; }
  }
  else {
    it.spheres = (it.spheres || []).filter(s => s !== from);
    if (it.spheres.indexOf(target) < 0) it.spheres.push(target);
  }
  save();
  return true;
}

function wireMap(vbWidth, vbHeight) {
  const el = document.getElementById("map");
  if (!el || !el.addEventListener) return;
  applyMapTransform();
  if (mapUnwire) mapUnwire();          // карта перерисовывается — старые слушатели убираем

  el.addEventListener("wheel", e => {
    e.preventDefault();
    ZOOM = clamp(ZOOM * (e.deltaY < 0 ? 1.12 : 1 / 1.12), 0.35, 4);
    applyMapTransform();
  }, { passive: false });

  /* Тащим карту слушателями на окне.
     НЕ через setPointerCapture: захват указателя переносит цель
     последующего клика на саму карту, и нажатия по веткам перестают
     доходить до обработчика.                                        */
  /* Экранная точка -> координаты карты. Поле симметрично относительно
     нуля, поэтому центр элемента и есть начало координат.            */
  const toLocal = (cx, cy) => {
    const r = el.getBoundingClientRect ? el.getBoundingClientRect() : null;
    if (!r || !r.width) return null;
    const k = Math.min(r.width / vbWidth, r.height / vbHeight);
    const lx = (cx - (r.left + r.width / 2)) / k;
    const ly = (cy - (r.top + r.height / 2)) / k;
    return { x: (lx - PAN.x) / ZOOM, y: (ly - PAN.y) / ZOOM };
  };
  const branchAt = p => p && MAPNODES.find(nd =>
    Math.hypot(nd.x - p.x, nd.y - p.y) <= nd.r + 14);
  const paintTarget = val => {
    if (!el.querySelectorAll) return;
    el.querySelectorAll(".branch circle").forEach(c => {
      c.setAttribute("stroke", "none"); c.setAttribute("stroke-width", "0");
    });
    if (!val) return;
    const g = el.querySelector('.branch[data-val="' + String(val).replace(/"/g, '\\"') + '"] circle');
    if (g) { g.setAttribute("stroke", "var(--ink)"); g.setAttribute("stroke-width", "3"); }
  };

  let drag = null, moved = 0, item = null;
  const onDown = e => {
    const leaf = e.target && e.target.closest ? e.target.closest("[data-drag-map]") : null;
    if (leaf) {                       // тащим дело, а не карту
      item = { id: leaf.dataset.dragMap, from: leaf.dataset.from, node: leaf,
               x: e.clientX, y: e.clientY };
      moved = 0;
      if (leaf.classList) leaf.classList.add("dragging");
      return;
    }
    drag = { x: e.clientX, y: e.clientY, px: PAN.x, py: PAN.y };
    moved = 0; el.classList.add("grabbing");
  };
  const onMove = e => {
    if (item) {
      const dx = e.clientX - item.x, dy = e.clientY - item.y;
      moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
      const r = el.getBoundingClientRect ? el.getBoundingClientRect() : null;
      if (r && r.width) {
        const k = Math.min(r.width / vbWidth, r.height / vbHeight) * ZOOM;
        if (item.node.setAttribute)
          item.node.setAttribute("transform", `translate(${dx / k} ${dy / k})`);
      }
      const hit = branchAt(toLocal(e.clientX, e.clientY));
      paintTarget(hit && hit.val !== item.from ? hit.val : null);
      return;
    }
    if (!drag) return;
    const ratio = vbWidth / (el.clientWidth || vbWidth);   // пиксели → единицы карты
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    PAN.x = drag.px + dx * ratio; PAN.y = drag.py + dy * ratio;
    applyMapTransform();
  };
  const onUp = e => {
    if (item) {
      const node = item.node;
      if (node.classList) node.classList.remove("dragging");
      paintTarget(null);
      /* Нажали и отпустили, не двигая, — это клик по делу, а не перенос.
         Карту НЕ перерисовываем: click прилетает после pointerup, и
         после render() он попал бы в выброшенный элемент — просмотр
         не открывался бы никогда.                                   */
      if (moved <= 5) {
        /* Нажали и отпустили, не двигая, — открываем дело САМИ, не
           надеясь на всплытие click: на некоторых осях оно до делегата
           не доходило, и карта выглядела «только для перетаскивания». */
        if (node.removeAttribute) node.removeAttribute("transform");
        const openId = item.id;
        item = null;
        if (openId) openItem(openId);
        return;
      }
      const hit = e ? branchAt(toLocal(e.clientX, e.clientY)) : null;
      if (hit) moveToBranch(item.id, hit.val, item.from);
      item = null;
      render();          // и при переносе, и при броске мимо — лист встаёт на место
      return;
    }
    if (drag) { drag = null; el.classList.remove("grabbing"); }
  };
  /* если карту тащили — отпускание не считается нажатием на ветку */
  const onClick = e => { if (moved > 5) { e.stopPropagation(); e.preventDefault(); moved = 0; } };

  el.addEventListener("pointerdown", onDown);
  el.addEventListener("click", onClick, true);
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
  mapUnwire = () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
  };
}

/* ── СПРАВОЧНИКИ: сферы, места, люди, виды дел ───────────────────────
   Всё, что раньше было зашито в код, теперь правится руками.
   Общее правило: удаление метки НЕ удаляет дела — они только теряют
   эту метку. Переименование переносит её на все дела разом.         */
/* Поле ищем внутри той же строки, где нажали кнопку, и только потом
   по id — так добавление не зависит от того, что ещё есть на странице. */
function fieldOf(el, id) {
  let inp = null;
  if (el && el.closest) { const box = el.closest(".addrow"); if (box && box.querySelector) inp = box.querySelector("input"); }
  if (!inp && el && el.tagName === "INPUT") inp = el;
  if (!inp) inp = document.getElementById(id);
  return inp;
}
/* Пустое поле больше не молчит: подсвечиваем и ставим курсор. */
function nudge(inp) {
  if (!inp) return;
  if (inp.classList) inp.classList.add("needfill");
  inp.placeholder = "Сначала впишите название";
  if (inp.focus) inp.focus();
}
const dup = (list, t, self) => list.some(x => x !== self && String(x).toLowerCase() === t.toLowerCase());

function listSectionHTML(c) {
  return `<h2 style="margin-top:36px">${c.title}</h2>
    <p class="sub">${c.hint}</p>
    <div class="branchlist">
      ${c.rows.map(r => `<div class="brow ${r.dim ? "paused" : ""}">
        ${r.color ? `<div class="dot" style="background:${r.color}"></div>` : ""}
        <div class="nm">${esc(r.label)}<span style="color:var(--dim);font-weight:400"> · ${r.count}</span></div>
        ${r.note || ""}
        ${r.extra || ""}
        <button class="linkbtn" data-act="${c.act}ren" data-v="${esc(r.id)}">переименовать</button>
        <button class="linkbtn danger" data-act="${c.act}del" data-v="${esc(r.id)}">убрать</button>
      </div>`).join("")}
      <div class="brow addrow">
        <input type="text" id="${c.input}" placeholder="${c.ph}">
        <button class="btn primary" data-act="${c.act}add">Добавить</button>
      </div>
    </div>`;
}

/* ── сферы ─────────────────────────────────────────────────────── */
function addSphere(el) {
  const inp = fieldOf(el, "dirNew");
  const t = (inp && inp.value ? inp.value : "").trim();
  if (!t) return nudge(inp);
  if (dup(S.spheres, t)) return alert("Такая сфера уже есть.");
  S.spheres.push(t); inp.value = ""; save(); render(); if (host.innerHTML) openSettings();
}
function renameSphere(old) {
  const inp = document.getElementById("dirName");
  const t = (inp && inp.value ? inp.value : "").trim();
  if (!t || t === old) return;
  if (dup(S.spheres, t, old)) return alert("Такая сфера уже есть.");
  S.items.forEach(i => { i.spheres = (i.spheres || []).map(x => x === old ? t : x); });
  S.spheres = S.spheres.map(x => x === old ? t : x);
  S.open = S.open.map(x => x === old ? t : x);
  save(); render(); if (host.innerHTML) openSettings();
}
function removeSphere(name) {
  const used = S.items.filter(i => (i.spheres || []).indexOf(name) >= 0).length;
  const alone = S.items.filter(i => !i.done && (i.spheres || []).length === 1
    && i.spheres[0] === name).length;
  if (!confirm("Убрать сферу «" + name + "»?" + (used
    ? "\n\n" + used + " дел останутся на месте, но потеряют эту метку."
      + (alone ? "\nИз них " + alone + " попадут в «Разобрать» — других сфер у них нет." : "")
    : ""))) return;
  S.items.forEach(i => { i.spheres = (i.spheres || []).filter(x => x !== name); });
  S.spheres = S.spheres.filter(x => x !== name);
  S.open = S.open.filter(x => x !== name);
  save(); render(); if (host.innerHTML) openSettings();
}

/* ── места ─────────────────────────────────────────────────────── */
function addPlace(el) {
  const inp = fieldOf(el, "dirNew");
  const t = (inp && inp.value ? inp.value : "").trim();
  if (!t) return nudge(inp);
  if (t.toLowerCase() === NOPLACE) return alert("Так называется пустая ветка на карте. Выберите другое название.");
  if (dup(S.places, t)) return alert("Такое место уже есть.");
  S.places.push(t); inp.value = ""; save(); render(); if (host.innerHTML) openSettings();
}
function renamePlace(p) {
  const inp = document.getElementById("dirName");
  const t = (inp && inp.value ? inp.value : "").trim();
  if (!t || t === p) return;
  if (t.toLowerCase() === NOPLACE) return alert("Так называется пустая ветка на карте. Выберите другое название.");
  if (dup(S.places, t, p)) return alert("Такое место уже есть.");
  S.items.forEach(i => { if (i.place === p) i.place = t; });
  S.places = S.places.map(x => x === p ? t : x);
  if (S.hereNow === p) S.hereNow = t;
  S.open = S.open.map(x => x === p ? t : x);
  save(); render(); if (host.innerHTML) openSettings();
}
function removePlace(p) {
  const used = S.items.filter(i => i.place === p).length;
  if (!confirm("Убрать место «" + p + "»?" + (used
    ? "\n\n" + used + " дел останутся на месте, но потеряют привязку и снова будут видны отовсюду." : ""))) return;
  S.items.forEach(i => { if (i.place === p) i.place = null; });
  S.places = S.places.filter(x => x !== p);
  if (S.hereNow === p) S.hereNow = null;
  S.open = S.open.filter(x => x !== p);
  save(); render(); if (host.innerHTML) openSettings();
}

/* ── люди ──────────────────────────────────────────────────────── */
function addPerson(el) {
  const inp = fieldOf(el, "dirNew");
  const t = (inp && inp.value ? inp.value : "").trim();
  if (!t) return nudge(inp);
  if (dup(S.people, t)) return alert("Такой человек уже есть.");
  S.people.push(t); inp.value = ""; save(); render(); if (host.innerHTML) openSettings();
}
function renamePerson(p) {
  const inp = document.getElementById("dirName");
  const t = (inp && inp.value ? inp.value : "").trim();
  if (!t || t === p) return;
  if (dup(S.people, t, p)) return alert("Такой человек уже есть.");
  S.items.forEach(i => { if (i.person === p) i.person = t; });
  S.people = S.people.map(x => x === p ? t : x);
  S.open = S.open.map(x => x === p ? t : x);
  save(); render(); if (host.innerHTML) openSettings();
}
function removePerson(p) {
  const used = S.items.filter(i => i.person === p).length;
  if (!confirm("Убрать «" + p + "» из списка людей?" + (used
    ? "\n\n" + used + " дел останутся, но перестанут быть привязаны к человеку." : ""))) return;
  S.items.forEach(i => { if (i.person === p) i.person = null; });
  S.people = S.people.filter(x => x !== p);
  S.open = S.open.filter(x => x !== p);
  save(); render(); if (host.innerHTML) openSettings();
}

/* ── виды дел ──────────────────────────────────────────────────── */
const KINDNOTE = { choice: "со списком вариантов", routine: "по дням недели",
                   appt: "с датой и временем", idea: "без срока, не просится в «Сегодня»" };

/* ── СПРАВОЧНИКИ ─────────────────────────────────────────────────────
   Живут в настройках: это то, что настраивают один раз и забывают.  */
/* ── Справочники: второй уровень настроек ────────────────────────────
   Один список за раз, строкой на запись; переименование раскрывается
   прямо в строке. Раньше всё лежало вповалку одной страницей, строки
   не помещались по ширине и окно ездило вбок.                       */
const DIRS = {
  sphere: { title: "Сферы", act: "sph", one: "сферу", colored: true,
    note: "«Убрать сферу» не удаляет дела — они попадают в «Разобрать».",
    list: () => S.spheres,
    count: sp => live().filter(i => (i.spheres || []).indexOf(sp) >= 0).length },
  place: { title: "Места", act: "place", one: "место",
    note: "Дела не пропадут — просто останутся без привязки к месту.",
    list: () => S.places,
    count: p => live().filter(i => i.place === p).length },
  person: { title: "Люди", act: "per", one: "человека",
    note: "Кого касается дело. Дела при убирании остаются на месте.",
    list: () => S.people,
    count: p => live().filter(i => i.person === p).length },
};
let DIRPAGE = null, DIREDIT = null;
/* Справочник правится как форма: снимок при входе, «Сохранить изменения»
   закрепляет, крестик возвращает к снимку. Правки видны сразу — но не
   считаются принятыми, пока не нажата кнопка.                       */
let dirBackup = null, dirSaved = false;
/* Виды дел в снимок не входят: их больше нельзя править. */
const DIRFIELDS = ["spheres", "places", "people", "items", "open", "hereNow"];
function dirSnapshot() {
  const snap = {};
  DIRFIELDS.forEach(k => { snap[k] = JSON.parse(JSON.stringify(S[k])); });
  return snap;
}
/* Есть ли несохранённые правки: сравниваем текущее состояние со
   снимком, сделанным при входе. Кнопка сохранения живёт по этому. */
function dirDirty() {
  if (!dirBackup) return false;
  return DIRFIELDS.some(k => JSON.stringify(S[k]) !== JSON.stringify(dirBackup[k]));
}
function dirRestore() {
  if (!dirBackup) return;
  DIRFIELDS.forEach(k => { S[k] = JSON.parse(JSON.stringify(dirBackup[k])); });
  save();
}

const CHEV = `<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor"
  stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg>`;

function dirRowsHTML() {
  return Object.keys(DIRS).map(k => {
    const d = DIRS[k];
    return `<button class="dirrow" data-act="diropen" data-p="${k}">
      <span class="nm">${d.title}</span>
      <span class="qs">${d.list().length}</span>${CHEV}</button>`;
  }).join("");
}

function dirPageHTML() {
  const d = DIRS[DIRPAGE];
  const label = v => d.label ? d.label(v) : v;
  return `<div class="dirlist">${d.list().map(v => DIREDIT === v
    ? `<div class="direditbox">
         <div class="direditrow">
           ${d.colored ? `<span class="dot" style="background:${colorOf(DIRPAGE, v)}"></span>` : ""}
           <input type="text" id="dirName" value="${esc(label(v))}" autocomplete="off">
         </div>
         <div class="direditbtns">
           <button class="btn primary" data-act="${d.act}ren" data-v="${esc(v)}">Готово</button>
           <button class="btn link" data-act="dircancel">Отмена</button>
           <div class="spacer"></div>
           <button class="btn link danger" data-act="${d.act}del" data-v="${esc(v)}">убрать ${d.one}</button>
         </div>
       </div>`
    : `<div class="dirrow">
         ${d.colored ? `<span class="dot" style="background:${colorOf(DIRPAGE, v)}"></span>` : ""}
         <span class="nm">${esc(label(v))}</span>
         <span class="qs cnt">${d.count(v)} ${plural(d.count(v), "дело", "дела", "дел")}</span>
         <span class="acts">
           <button class="linkbtn" data-act="diredit" data-v="${esc(v)}">переименовать</button>
           <button class="linkbtn danger" data-act="${d.act}del" data-v="${esc(v)}">убрать</button>
         </span>
       </div>`).join("")}
    <div class="diraddrow">
      <input type="text" id="dirNew" autocomplete="off"
        placeholder="Добавить ${d.one} и нажать Enter">
    </div>
  </div>
  <p class="qs" style="margin:14px 4px 0">${d.note}</p>
  <div class="row modalfoot">
    <span class="qs" style="margin:0">${dirSaved && !dirDirty() ? "Изменения сохранены" : ""}</span>
    <div class="spacer"></div>
    <button class="btn ${dirDirty() ? "primary" : "ghost"}" data-act="dirsave"
      ${dirDirty() ? "" : "disabled"}>Сохранить изменения</button>
  </div>`;
}
function wireDirectories() {
  const nm = document.getElementById("dirName");
  if (nm && nm.addEventListener) {
    nm.addEventListener("keydown", e => { if (e.key === "Enter") {
      const d = DIRS[DIRPAGE];
      /* Виды дел сюда не попадают: строку вида не открыть на правку. */
      ({ sph: renameSphere, place: renamePlace, per: renamePerson })[d.act](DIREDIT);
    } });
    if (nm.focus) nm.focus();
  }
  const nw = document.getElementById("dirNew");
  if (nw && nw.addEventListener) nw.addEventListener("keydown", e => { if (e.key === "Enter") {
    const d = DIRS[DIRPAGE];
    /* Виды дел сюда не попадают: у них поля ввода нет вовсе. */
    ({ sph: addSphere, place: addPlace, per: addPerson })[d.act](nw);
  } });
}

/* ══════════════════════════════════════════════════════════════════
   МОДАЛКИ
   ══════════════════════════════════════════════════════════════════ */
const host = document.getElementById("modalHost");
/* Снимок дела на момент открытия — чтобы «Отмена» вернула всё как было.
   Правки применяются сразу (иначе список сфер не перерисовать), поэтому
   откат возможен только через сохранённую копию.                     */
/* ── Выпадающие списки (дизайн-пакет, эталон 09) ─────────────────────
   Открыт максимум один; DD хранит ключ вида "поле:идДела" или "here"/
   "allfilter". DDM — месяц мини-календаря, DDADD — раскрыт ли ввод
   нового места/человека. Клик мимо закрывает (см. обработчик клика). */
let DD = null, DDM = null, DDADD = false;
const ddId = () => DD && DD.indexOf(":") > 0 ? DD.slice(DD.indexOf(":") + 1) : null;
function ddClose(rerender) {
  const id = ddId(); DD = null; DDM = null; DDADD = false;
  if (!rerender) return;
  if (id) refreshEdit(id); else render();
}
function ddToggle(key) {
  const oldId = ddId();
  DD = DD === key ? null : key; DDM = null; DDADD = false;
  const id = ddId() || oldId;
  if (id) refreshEdit(id); else render();
}
const ddCheck = `<svg class="ic ck" viewBox="0 0 16 16" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 5"/></svg>`;

function ddTypeHTML(it) {
  const open = DD === "type:" + it.id;
  const def = typeDef(it.type);
  return `<div class="ddwrap" data-ddwrap>
    <button class="ddbtn" data-act="dd" data-k="type:${it.id}">${iconSVG(kindToken(def),
      kindColor(it))}<span>${esc(def.name)}</span><i class="caret">▾</i></button>
    ${open ? `<div class="dd inline">${S.types.map(t => `
      <button class="ddrow ${t.key === it.type ? "on" : ""}" data-act="ddset" data-f="type"
        data-id="${it.id}" data-v="${esc(t.key)}">${iconSVG(kindToken(t),
        "var(--kind-" + kindToken(t) + ")")}<span>${esc(t.name)}${
        t.kind === "appt" ? " — со временем" : ""}</span>${t.key === it.type ? ddCheck : ""}</button>`).join("")}
    </div>` : ""}</div>`;
}

/* Длительность списком, а не полем ввода: одно нажатие вместо набора,
   и «не важно» — полноправный ответ, а не пустое поле.              */
/* Время — двумя списками, часы и минуты, а не родным полем браузера.
   Родное открывало свой список, который листается по минуте и выглядит
   чужим в этом окне. Один список на все 288 четвертей суток был бы не
   лучше: 24 строки и 12 — короткие, и высота кнопок совпадает с
   соседней датой сама, потому что кнопка ровно та же.               */
const HOURS = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, "0"));
const MINS5 = Array.from({ length: 12 }, (_, i) => String(i * 5).padStart(2, "0"));
/* Плитки дней недели — одна разметка на все четыре места, где они
   встречаются: форма рутины, форма встречи по расписанию и оба окна
   просмотра. Раньше это были четыре копии, и одна успела разойтись —
   показывала неделю с воскресенья вопреки настройке.               */
function daysRowHTML(days, editId) {
  return `<div class="rt">${wdOrder().map(d =>
    `<div class="${(days || []).indexOf(d) >= 0 ? "hit" : ""}"${editId
      ? ` data-act="rday" data-id="${editId}" data-i="${d}" style="cursor:pointer"` : ""
      }>${WD_BY_DAY[d]}</div>`).join("")}</div>`;
}

function ddTimeHTML(it) {
  const cur = it.time || "";
  const part = (key, list, val, ph, f) => `<span class="ddwrap" data-ddwrap
      style="display:inline-block;width:auto;position:relative">
    <button class="ddbtn ${val ? "" : "dim"}" data-act="dd" data-k="${key}"
      style="width:auto;min-width:62px"><span>${val || ph}</span><i class="caret">▾</i></button>
    ${DD === key ? `<div class="dd inline" style="min-width:96px;max-height:232px;overflow-y:auto">
      ${list.map(v => `<button class="ddrow ${v === val ? "on" : ""}" data-act="ttime"
          data-f="${f}" data-id="${it.id}" data-v="${v}"><span>${v}</span>${
          v === val ? ddCheck : ""}</button>`).join("")}
      <div class="dddiv"></div>
      <button class="ddrow dim ${cur ? "" : "on"}" data-act="ttime" data-f="clear"
        data-id="${it.id}" data-v=""><span>без времени</span>${cur ? "" : ddCheck}</button>
    </div>` : ""}</span>`;
  return `<div style="display:flex;gap:7px;align-items:center">
    ${part("th:" + it.id, HOURS, cur.slice(0, 2), "час", "h")}
    <span class="qs" style="margin:0">:</span>
    ${part("tm:" + it.id, MINS5, cur.slice(3, 5), "мин", "m")}</div>`;
}

function ddMinsHTML(it) {
  const key = "mins:" + it.id, open = DD === key;
  return `<div class="ddwrap" data-ddwrap>
    <button class="ddbtn ${it.mins ? "" : "dim"}" data-act="dd" data-k="${key}"><span>${
      it.mins ? minsLabel(it.mins) : "не важно"}</span><i class="caret">▾</i></button>
    ${open ? `<div class="dd inline">
      ${MINCHOICES.map(n => `<button class="ddrow ${it.mins === n ? "on" : ""}" data-act="ddset"
          data-f="mins" data-id="${it.id}" data-v="${n}"><span>${minsLabel(n)}</span>${
          it.mins === n ? ddCheck : ""}</button>`).join("")}
      <button class="ddrow dim ${it.mins ? "" : "on"}" data-act="ddset" data-f="mins"
        data-id="${it.id}" data-v=""><span>не важно</span>${it.mins ? "" : ddCheck}</button>
    </div>` : ""}</div>`;
}

function ddPickHTML(it, field) {
  const isPlace = field === "place";
  const list = isPlace ? S.places : S.people;
  const cur = it[field] || null;
  const key = field + ":" + it.id, open = DD === key;
  const icon = v => isPlace ? iconSVG("pin", "var(--pin)") : iconSVG("person", "currentColor");
  return `<div class="ddwrap" data-ddwrap>
    <button class="ddbtn ${cur ? "" : "dim"}" data-act="dd" data-k="${key}">${icon()}<span>${
      cur ? esc(cur) : (isPlace ? "без места" : "без человека")}</span><i class="caret">▾</i></button>
    ${open ? `<div class="dd inline">
      ${list.map(v => `<button class="ddrow ${v === cur ? "on" : ""}" data-act="ddset"
          data-f="${field}" data-id="${it.id}" data-v="${esc(v)}">${icon(v)}<span>${esc(v)}</span>${
          v === cur ? ddCheck : ""}</button>`).join("")}
      <button class="ddrow dim ${cur ? "" : "on"}" data-act="ddset" data-f="${field}"
        data-id="${it.id}" data-v=""><span>${isPlace ? "без места" : "без человека"}</span>${cur ? "" : ddCheck}</button>
      <div class="dddiv"></div>
      ${DDADD ? `<div class="ddaddrow"><input type="text" id="ddAddInp" autocomplete="off"
          data-f="${field}" data-id="${it.id}" placeholder="${isPlace ? "Новое место" : "Имя"}">
          <button class="btn primary" data-act="ddaddgo" data-f="${field}" data-id="${it.id}">Добавить</button></div>`
        : `<button class="ddrow ddadd" data-act="ddaddshow">＋ добавить ${isPlace ? "место" : "человека"}</button>`}
    </div>` : ""}</div>`;
}

/* Новое место/человек прямо из формы: то же правило, что в справочниках —
   без дублей, и сразу назначается делу.                             */
function ddAddCommit(field, id) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  const inp = document.getElementById("ddAddInp");
  const t = inp && inp.value ? String(inp.value).trim() : "";
  if (!t) return;
  const list = field === "place" ? S.places : S.people;
  if (!list.some(x => String(x).toLowerCase() === t.toLowerCase())) list.push(t);
  it[field] = list.find(x => String(x).toLowerCase() === t.toLowerCase());
  DD = null; DDM = null; DDADD = false;
  save(); refreshEdit(id);
}

function ddCalHTML(it) {
  const anchor = DDM || it.due || today();
  const d = new Date(anchor + "T12:00:00");
  const y = d.getFullYear(), m = d.getMonth();
  const first = y + "-" + pad2(m + 1) + "-01";
  const start = startOfWeek(first);
  const inMonth = new Date(y, m + 1, 0).getDate();
  const lead = Math.round((new Date(first + "T12:00:00") - new Date(start + "T12:00:00")) / 864e5);
  const cells = Math.ceil((lead + inMonth) / 7) * 7;
  return `<div class="ddcal">
    <div class="ddnavrow"><button data-act="ddnav" data-d="prev" data-id="${it.id}">‹</button>
      <b>${MONTHS_NOM[m].toLowerCase()} ${y}</b>
      <button data-act="ddnav" data-d="next" data-id="${it.id}">›</button></div>
    <div class="ddwdrow">${wdOrder().map(w => `<i>${WD_BY_DAY[w]}</i>`).join("")}</div>
    <div class="ddgrid">${Array.from({ length: cells }, (_, i) => {
      const iso = addDays(start, i), dd2 = new Date(iso + "T12:00:00");
      const cls = (iso === today() ? " today" : "") + (iso === it.due ? " sel" : "")
        + (dd2.getMonth() !== m ? " out" : "");
      return iso < today()
        ? `<span class="ddday off${cls}">${dd2.getDate()}</span>`
        : `<button class="ddday${cls}" data-act="duepick" data-id="${it.id}"
             data-d="${iso}">${dd2.getDate()}</button>`;
    }).join("")}</div></div>`;
}

function ddDueHTML(it) {
  const key = "due:" + it.id, open = DD === key;
  return `<div class="ddwrap" data-ddwrap>
    <button class="ddbtn ${it.due ? "" : "dim"}" data-act="dd" data-k="${key}">${SAND}<span>${
      it.due ? dateLabel(it) : "без срока"}</span><i class="caret">▾</i></button>
    ${open ? `<div class="dd inline duedd">
      <div class="ddquick">
        <button class="chip" data-act="duequick" data-id="${it.id}" data-v="today">сегодня</button>
        <button class="chip" data-act="duequick" data-id="${it.id}" data-v="tomorrow">завтра</button>
        <button class="chip" data-act="duequick" data-id="${it.id}" data-v="week">через неделю</button>
        <button class="chip" data-act="duequick" data-id="${it.id}" data-v="none">без срока</button>
      </div>
      ${ddCalHTML(it)}
      <p class="qs" style="margin:6px 10px 6px">сегодня — в кольце · выбранное — залито</p>
    </div>` : ""}</div>`;
}

let editBackup = null;
let lastModalKey = null;
/* Какой шаг сейчас правится: "идДела:номер". Хранится снаружи, потому что
   окно перерисовывается на каждое действие.                          */
let EDITSTEP = null;
const closeModal = () => {
  host.innerHTML = ""; editBackup = null; lastModalKey = null; EDITSTEP = null;
};
function openModal(html, key, close) {
  /* Окно перерисовывается после каждого выбора — прокрутку сохраняем,
     иначе после нажатия на кнопку внизу оно прыгает в начало.
     Но только для ТОГО ЖЕ окна: новое всегда открывается сверху.     */
  const prev = host.querySelector ? host.querySelector(".modal") : null;
  const keep = (prev && key && key === lastModalKey) ? prev.scrollTop : 0;
  host.innerHTML = `<div class="veil"><div class="modal">${close
    ? `<div class="modalbar"><button class="modalx" data-act="${close.act}"${
        close.id ? ` data-id="${close.id}"` : ""} title="${close.title || "Закрыть"}">×</button></div>`
    : ""}${html}</div></div>`;
  const now = host.querySelector ? host.querySelector(".modal") : null;
  if (now) now.scrollTop = keep;
  lastModalKey = key || null;
}

/* ── Просмотр сделанного ─────────────────────────────────────────────
   В архиве править нечего: дело закрыто. Показываем, что в нём было —
   шаги, заметку и когда именно оно сделано.                         */
function openDone(id, when) {
  const it = S.items.find(x => x.id === id);
  if (!it) return;
  const rout = isRoutine(it);
  const hasSteps = it.multi && it.steps.length;
  openModal(`<h3>${kindIcon(it)}${esc(it.title)}</h3>
    <p class="qs" style="margin:-10px 0 16px">${rout ? "Отмечено"
      : isAppt(it) ? "Состоялась" : "Сделано"}:
      <b style="color:var(--good)">${formatDay(when)}</b>${when ? " · " + esc(when) : ""}</p>

    <div class="readmeta">
      ${sphereTags(it)}
      ${it.place ? placeTag(it.place) : ""}
      ${it.person && it.person !== "Я" ? `<span class="tag place">${iconSVG("person", "currentColor")}${esc(it.person)}</span>` : ""}
      ${it.due && !rout ? `<span class="tag when">дедлайн был ${esc(it.due)}${
        it.time ? " " + esc(it.time) : ""}</span>` : ""}
    </div>

    ${(schedDays(it) || []).length ? `<p class="lbl">В какие дни</p>
      ${daysRowHTML(schedDays(it))}
      <p class="qs" style="margin:-4px 0 16px">Сделано ${routineScore(it).hit}
        из ${routineScore(it).of} за последнюю неделю.</p>` : ""}

    ${hasSteps ? `<p class="lbl">Шаги</p>
      <div style="margin-bottom:16px">${it.steps.map(s =>
        `<div class="readstep ${s.done ? "done" : ""}">
           <span class="m" style="color:${s.done ? "var(--good)" : "var(--dim)"}">${s.done ? "✓" : "○"}</span>
           <span class="tx">${esc(s.text)}</span></div>`).join("")}</div>` : ""}

    ${it.options && it.options.length ? `<p class="lbl">Варианты</p>
      <div style="margin-bottom:16px">${it.options.map(o =>
        `<div class="readstep"><span class="m">·</span><span class="tx">${linkify(o.text)}</span></div>`).join("")}</div>` : ""}

    ${hasNotes(it) ? `<p class="lbl">${isAppt(it) ? "Адрес, телефон, заметки" : "Заметка"}</p>
      <div class="readnote">${linkify(it.notes)}</div>` : ""}

    ${!it.notes && !hasSteps && !rout && !(it.options || []).length
      ? `<p class="qs" style="margin-bottom:16px">Ни шагов, ни заметок — просто сделано.</p>` : ""}

    <p class="qs" style="margin:0 0 14px">Здесь только просмотр. Чтобы снова править — верните дело.</p>
    <div class="row">
      <button class="btn ghost" data-act="undo" data-id="${it.id}">Вернуть в дела</button>
    </div>`, "done:" + id, { act: "close" });
}

/* ── Что уберём ──────────────────────────────────────────────────────
   Когда день уже полон, приложение не запрещает — оно показывает
   цену и предлагает обменять.                                        */
function askSwap(newId) {
  const it = S.items.find(x => x.id === newId);
  const mine = todayItems().mine;
  if (!it) return;
  /* Встречу убрать нельзя — она назначена, а не выбрана. */
  const free = mine.filter(m => !isTodayAppt(m));
  const appts = mine.length - free.length;
  openModal(`<h3>На сегодня уже ${mine.length}</h3>
    <p class="qs" style="margin:-10px 0 16px">Добавляем «<b>${esc(it.title)}</b>».
      ${free.length ? "Что уберём, чтобы день остался реальным?"
        : "Но день занят встречами — их не отложишь."}</p>
    ${appts ? `<p class="qs" style="margin:-8px 0 12px">Встреч сегодня: ${appts}.
      Они назначены, поэтому в обмен не идут.</p>` : ""}
    ${free.map(m => `<button class="swaprow" data-act="swap" data-id="${newId}" data-out="${m.id}">
      <span class="pickmark" style="color:var(--warm)">−</span>
      <span class="picktitle">${esc(m.title)}</span>
      ${sphereTags(m)}</button>`).join("")}
    <p class="qs" style="margin:12px 0 0">Убранное не пропадёт — вернётся в «Предлагаю».</p>
    <div class="row">
      <button class="btn ghost" data-act="swapskip" data-id="${newId}">Всё равно добавить</button>
    </div>`, "swap", { act: "close" });
}

/* ── Настройки ───────────────────────────────────────────────────────
   Здесь только то, что настраивают один раз. Всё, к чему возвращаешься
   каждую неделю, осталось в потоке.                                  */
/* Настройки копятся в черновике и вступают в силу по кнопке «Применить».
   Иначе каждое нажатие мгновенно перестраивало бы всё приложение
   за спиной у окна.                                                 */
let cfgDraft = null;
const cfgDirty = () => cfgDraft && JSON.stringify(cfgDraft) !== JSON.stringify(S.cfg);

/* Каждая настройка — самостоятельный блок: пары раскладываются рядом
   сеткой, а на узком окне сами встают друг под друга.               */
function cfgSeg(key, opts, label, hint) {
  return `<div class="cfgitem"><p class="lbl">${label}</p>
    <div class="seg" style="margin-bottom:4px">${opts.map(([v, L]) =>
      `<button data-act="cfg" data-k="${key}" data-v="${v}"
        class="${String(cfgDraft[key]) === String(v) ? "on" : ""}">${L}</button>`).join("")}</div>
    ${hint ? `<p class="qs" style="margin:0">${hint}</p>` : ""}</div>`;
}

function applyCfg() {
  if (cfgDraft) S.cfg = JSON.parse(JSON.stringify(cfgDraft));
  cfgDraft = null; save(); applyTheme(); closeModal(); render();
}
function cancelCfg() { cfgDraft = null; closeModal(); render(); }

/* ── Копия данных ────────────────────────────────────────────────────
   Выгрузка отдаёт всё состояние одним файлом; загрузка кладёт файл в
   хранилище и перезапускает страницу, чтобы миграции и самопочинка
   прошли по загруженным данным как по своим.                        */
const exportPayload = () => JSON.stringify(S, null, 2);

function exportData() {
  if (typeof Blob === "undefined" || typeof URL === "undefined") return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([exportPayload()], { type: "application/json" }));
  a.download = "организатор-данные-" + today() + ".json";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function applyImport(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { data = null; }
  if (!data || !Array.isArray(data.items))
    return { error: "Это не файл с данными организатора." };
  return { data, count: data.items.filter(i => i && !i.draft).length };
}

function importData(text) {
  const r = applyImport(text);
  if (r.error) return alert(r.error);
  const here = S.items.filter(i => !i.draft).length;
  if (!confirm("Заменить данные в приложении теми, что в файле?\n\nСейчас в приложении "
      + here + " " + plural(here, "запись", "записи", "записей") + ", в файле "
      + r.count + " " + plural(r.count, "запись", "записи", "записей") + ".")) return;
  try { localStorage.setItem(KEY, JSON.stringify(r.data)); }
  catch (e) { return alert("Не получилось сохранить — данные не тронуты."); }
  if (typeof location !== "undefined" && location.reload) location.reload();
}

function openSettings() {
  if (!cfgDraft) cfgDraft = JSON.parse(JSON.stringify(S.cfg));
  /* Второй уровень — тот же попап: заголовок меняется на «‹ Настройки |
     Сферы», содержимое — на список. Одно окно, две глубины.        */
  /* Имя справочника могло остаться от прежней версии — тогда просто
     показываем список, а не падаем на пустом описании. */
  if (DIRPAGE && !DIRS[DIRPAGE]) DIRPAGE = null;
  if (DIRPAGE) {
    const d = DIRS[DIRPAGE];
    if (!dirBackup) dirBackup = dirSnapshot();
    openModal(`<h3 class="dirhead"><button class="btn link" data-act="dirback">‹ Настройки</button>
        <b>${d.title}</b></h3>
      ${dirPageHTML()}`, "settings:" + DIRPAGE,
      { act: "dirclose", title: "Закрыть без сохранения" });
    wireDirectories();
    return;
  }
  openModal(`<h3>Настройки</h3>

    <div class="cfggrid">
      ${cfgSeg("todayCap", [[3,"3"],[5,"5"],[7,"7"]], "Дел в день",
        "Больше семи в день не помещается ни у кого — экран короткий намеренно.")}
      ${cfgSeg("urgentDays", [[1,"1 день"],[3,"3 дня"],[7,"неделя"]],
        "Горит за",
        "Сколько дней до дедлайна дело считается срочным. Пересчитывается каждый день.")}
    </div>

    <div class="cfggrid">
      ${cfgSeg("theme", [["light","светлая"],["dark","тёмная"]], "Тема")}
      ${cfgSeg("weekStart", [[1,"пн"],[0,"вс"]], "Начало недели")}
    </div>

    <div class="setdiv"></div>
    ${dirRowsHTML()}

    <div class="setdiv"></div>
    <p class="lbl">Данные</p>
    <div class="row" style="margin:0;justify-content:flex-start">
      <button class="btn ghost outline" data-act="exportdata">Сохранить в файл</button>
      <button class="btn ghost outline" data-act="importdata">Загрузить из файла</button>
    </div>
    <p class="qs" style="margin-top:10px">Всё хранится в этом браузере. Файл-копия —
      способ перенести данные или подстраховаться.</p>
    <input type="file" id="importFile" accept=".json,application/json" hidden>

    <div class="row modalfoot">
      <span class="qs" style="margin:0">${cfgDirty()
        ? `<b style="color:var(--warm)">Есть неприменённые изменения</b>`
        : "Всё применено"}</span>
      <div class="spacer"></div>
      <button class="btn ${cfgDirty() ? "primary" : "ghost"}" data-act="cfgapply"
        ${cfgDirty() ? "" : "disabled"}>Применить изменения</button>
    </div>`, "settings",
    { act: "cfgcancel", title: "Закрыть, не применяя изменения" });
  wireDirectories();
  const fi = document.getElementById("importFile");
  if (fi && fi.addEventListener) fi.addEventListener("change", () => {
    const f = fi.files && fi.files[0];
    if (!f || typeof FileReader === "undefined") return;
    const rd = new FileReader();
    rd.onload = () => importData(String(rd.result));
    rd.readAsText(f);
  });
}

/* ── Добавить дело ───────────────────────────────────────────────────
   Быстро: написал название, Enter — готово. Но здесь же доступны все
   те же параметры, что и при редактировании: вид, шаги, дедлайн, клетка
   матрицы, сферы, место, человек. Заполнять — по желанию.           */
let draftId = null, capFocus = false, stepFocus = false;
/* Какие необязательные блоки формы раскрыты в этот раз — общее для
   создания и правки. */
let formOpen = { notes: false, options: false };

/* Перерисовка открытой формы после каждой правки: черновик — своей
   отрисовкой, существующее дело — редактором. Функция была потеряна
   при удалении панели поиска: без неё падал любой клик в формах.   */
const refreshEdit = id => {
  if (draftId && id === draftId) return drawCapture();
  if (host.innerHTML) openEdit(id); else render();
};

/* ── Общая форма дела ────────────────────────────────────────────────
   Одна разметка на создание и на правку: секции и их порядок совпадают,
   различаются только заполненность и кнопки внизу. Раньше формы жили
   отдельно и успели разъехаться.                                     */
function itemFormHTML(it, ids) {
  /* Шаги видны сразу: разбить дело на шаги — обычное решение, ради него
     не нужно лишнее нажатие. Заметка и варианты нужны реже, поэтому
     свёрнуты и раскрываются кнопкой (или сами, если уже заполнены).  */
  const canOpts = isChoice(it) || isIdea(it);
  const canSteps = !isRoutine(it);
  const openNotes = formOpen.notes || hasNotes(it);
  const openOpts = canOpts && (formOpen.options || (it.options || []).length);
  const openSteps = canSteps && it.multi;
  /* data-id обязателен: без него перерисовка не знает, какое дело
     открыто, и блок молча не раскрывался.                          */
  const bNotes = `<button class="addtoday" data-act="formopen" data-k="notes"
    data-id="${it.id}">＋ заметка</button>`;
  const bOpts = `<button class="addtoday" data-act="formopen" data-k="options"
    data-id="${it.id}">＋ варианты</button>`;
  const bSteps = `<button class="addtoday" data-act="emulti" data-id="${it.id}">＋ шаги</button>`;
  /* Когда пусто, отдельная плашка «Пока ничего нет» не нужна: поле
     ввода само говорит, что здесь делать.                          */
  const optsHTML = `<p class="lbl">Варианты</p>
      ${(it.options || []).length
        ? `<div>${it.options.map(o => `<div class="opt">· ${esc(o.text)}</div>`).join("")}</div>` : ""}
      <input type="text" id="newOpt" placeholder="Добавить вариант и нажать Enter"${
        (it.options || []).length ? ` style="margin-top:10px"` : ""}>`;
  /* Раскрытые блоки идут сверху во всю ширину, свёрнутые — рядом
     пунктирными кнопками.                                          */
  const opened = (openSteps ? stepsBlockHTML(it) : "")
    + (openNotes ? notesBlockHTML(it, ids.notes) : "")
    + (openOpts ? optsHTML : "");
  const folded = (canSteps && !openSteps ? bSteps : "")
    + (!openNotes ? bNotes : "")
    + (canOpts && !openOpts ? bOpts : "");
  const extra = opened + (folded ? `<div class="caprow">${folded}</div>` : "");

  /* Ячейки первой сетки. Порядок один на все виды: сначала «что это»,
     потом «когда», потом всё остальное. Раньше «Вид дела» оказывался
     то вторым, то четвёртым — в зависимости от вида дела, и форма
     каждый раз выглядела по-новому.
     Широкое (`wide`) занимает строку целиком: и потому что иначе не
     помещается, и потому что при нечётном числе полей рядом с
     последним зияла бы пустая клетка.                               */
  const cell = (label, body, wide) => `<div class="cfgitem${wide ? " wide" : ""}">
      <p class="lbl">${label}</p>${body}</div>`;
  const kindItem = cell("Вид", ddTypeHTML(it));
  /* Семь плиток — самый широкий элемент формы. В половине строки они
     сжимались вдвое против того, как выглядят в просмотре.          */
  const daysItem = days => cell("В какие дни", daysRowHTML(days, it.id), true);
  const partItem = cell("Часть дня",
    `<div class="seg">${PARTS.concat([["", "—"]]).map(([k, L]) =>
      `<button data-act="rpart" data-id="${it.id}" data-v="${k}"${
        k ? "" : ` title="Часть дня не важна"`}
        class="${(it.partOfDay || "") === k ? "on" : ""}">${L}</button>`).join("")}</div>`, true);
  /* Одна дата или расписание — два ответа на «когда», а не два поля.
     У сессии по вторникам и четвергам одной даты не существует.      */
  const whenSwitch = cell("Когда",
    `<div class="seg">${[["once", "Одна дата"], ["days", "По расписанию"]].map(([k, L]) =>
      `<button data-act="arepeat" data-id="${it.id}" data-v="${k}"
        class="${(it.repeat ? "days" : "once") === k ? "on" : ""}">${L}</button>`).join("")}</div>`);

  const cells = kindItem + (
    isRoutine(it)
      ? cell("Сколько занимает", ddMinsHTML(it))
        + daysItem(it.routine && it.routine.days) + partItem
    : isAppt(it)
      ? whenSwitch + (it.repeat
          ? daysItem(it.repeat.days) + cell("Время", ddTimeHTML(it), true)
          /* Дата, часы и минуты стоят в одну линию — втроём в половину
             строки они не помещаются: кнопка даты сжималась до одной
             буквы, а мини-календарь вылезал за край окна.          */
          : `<div class="cfgitem wide">${
              whenFieldsHTML(it, ids.date, ids.time)}</div>`)
      : `<div class="cfgitem">${whenFieldsHTML(it, ids.date, ids.time)}</div>`);

  return `<div class="cfggrid">
      ${cells}
    </div>
    ${isAppt(it) && it.repeat ? `<p class="qs" style="margin:-8px 0 16px">Повторяется
      бессрочно, пока не удалите. Каждый раз отмечается отдельно — запись не закрывается.</p>` : ""}

    <p class="lbl">Сфера
      <span class="qs" style="text-transform:none;letter-spacing:0;margin-left:8px">можно несколько</span></p>
    <div class="chips">${S.spheres.map(v =>
      `<button class="chip ${it.spheres.indexOf(v) >= 0 ? "on" : ""}" data-act="esphere"
        data-id="${it.id}" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>
    ${(it.spheres || []).length > 1 ? `<div class="dupe">Это по-прежнему <b>одна запись</b>.
      Она видна во всех выбранных ветках, а отметите сделанной — исчезнет сразу отовсюду.</div>` : ""}

    <div class="cfggrid">
      <div class="cfgitem"><p class="lbl">Место</p>${ddPickHTML(it, "place")}</div>
      <div class="cfgitem"><p class="lbl">Человек</p>${ddPickHTML(it, "person")}</div>
    </div>

    ${isRoutine(it) || isIdea(it) ? "" : `<p class="lbl">Важность</p>
      <div class="chips">${[["imp", "важное"], ["not", "неважное"]].map(([k, L]) =>
        `<button class="chip ${(isImportant(it) ? "imp" : "not") === k ? "on" : ""}"
          data-act="equad" data-id="${it.id}" data-q="${k}">${L}</button>`).join("")}</div>
      <p class="qs" style="margin:-6px 0 4px">Срочность сюда не входит —
        она считается из дедлайна.</p>`}

    ${extra}`;
}

function openCapture(preset) {
  capFocus = true;
  formOpen = { notes: false, options: false };
  const it = {
    id: uid(), title: "", type: defaultType(), multi: false, spheres: [], place: null,
    person: null, due: null, time: null, steps: [], options: [], routine: null,
    done: false, created: today(), createdAt: stamp(), notes: "", forceImp: null,
    today: null, notToday: null, draft: true,
  };
  /* Создание наследует ракурс: день в календаре даёт дедлайн, ветка на
     карте — сферу, клетка матрицы — важность и срочность. Половину вы
     уже сказали тем, откуда нажали.                                  */
  Object.assign(it, preset || {});
  S.items.push(it);
  draftId = it.id;
  drawCapture();
}

function drawCapture() {
  const it = S.items.find(x => x.id === draftId);
  if (!it) return closeModal();
  const chips = (list, act, cur, lbl) => `<p class="lbl">${lbl}</p><div class="chips">${
    list.map(v => `<button class="chip ${cur(v) ? "on" : ""}" data-act="${act}"
      data-id="${it.id}" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>`;

  openModal(`<h3>Новое дело</h3>
    <input type="text" id="capText" placeholder="Что нужно сделать?"
      autocomplete="off" value="${esc(it.title)}">
    <div id="capDupe"></div>

    ${itemFormHTML(it, { date: "capDate", time: "capTime", notes: "capNotes" })}

    <div class="row modalfoot">
      <button class="btn primary" data-act="capsave">Добавить</button>
      ${isRoutine(it) || isAppt(it) || isIdea(it) ? ""
        : `<button class="btn soft" data-act="capsavetake">добавить и взять</button>`}
      <div class="spacer"></div>
      <button class="btn link" data-act="capcancel">Отмена</button>
    </div>`, "capture", { act: "capcancel", title: "Отменить и закрыть" });

  const inp = document.getElementById("capText");
  if (inp && inp.addEventListener) {
    inp.addEventListener("input", () => {
      it.title = inp.value;
      const d = findDupes(inp.value, it.id);
      const box = document.getElementById("capDupe");
      if (box) box.innerHTML = d.length
        ? `<div class="dupe"><b>Похоже, это уже есть:</b><br>${d.map(x =>
            `«${esc(x.title)}»${(x.spheres || []).length ? " — " + esc(x.spheres.join(", ")) : ""}, записано ${esc(x.created)}`).join("<br>")}
           <br><span style="opacity:.75">Если это другое дело — просто добавляйте.</span></div>`
        : "";
    });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") saveCapture(); });
    /* Фокус ставим только когда окно открылось. Иначе после каждого выбора
       браузер прокручивал бы окно обратно к полю названия.            */
    if (capFocus) { inp.focus(); capFocus = false; }
  }
  wireStepsInput(it.id);
  wireNotes(it.id, "capNotes");
  wireWhen(it.id, "capDate", "capTime", drawCapture);
}

/* «добавить и взять» — то же сохранение, только дело сразу уходит
   в сегодняшний список (с проверкой лимита).                        */
function saveCaptureTake() {
  const id = draftId;
  saveCapture();
  const it = S.items.find(x => x.id === id);
  if (it && !it.draft) tryAddToToday(id);
}

function saveCapture() {
  const it = S.items.find(x => x.id === draftId);
  if (!it) return closeModal();
  /* Название берём из самого дела: поле ввода пишет туда на каждой
     клавише, а окно между делом перерисовывается — читать из DOM хрупко. */
  if (!String(it.title).trim()) return cancelCapture();   // без названия дела нет
  it.title = it.title.trim();
  delete it.draft;
  draftId = null;
  save(); closeModal(); render();
}

function cancelCapture() {
  S.items = S.items.filter(x => x.id !== draftId);
  draftId = null;
  save(); closeModal(); render();
}

/* ── Разобрать: всё, что записано без ветки ──────────────────────── */
function openInbox() {
  const inb = here().filter(inInbox);
  openModal(`<h3>Разобрать · ${inb.length}</h3>
    <p class="sub">Записать сразу, разложить потом — так мысли не теряются.</p>
    ${inb.map(i => `<div class="card" style="box-shadow:none">
      <div class="title">${esc(i.title)}</div>
      <div class="chips" style="margin-top:10px">${S.spheres.map(sp =>
        `<button class="chip" data-act="assign" data-id="${i.id}" data-v="${esc(sp)}">${esc(sp)}</button>`).join("")}</div>
    </div>`).join("") || `<div class="empty">Пусто — всё разобрано.</div>`}
    `, "inbox", { act: "close" });
}

/* ── Добавить дело в сегодня ─────────────────────────────────────────
   Одно поле на оба случая: найти уже записанное или записать новое.
   Список совпадений заодно работает защитой от дубликатов.          */


/* ── Куда в матрице ──────────────────────────────────────────────────
   По умолчанию клетка считается сама. Но дело бывает важным независимо
   от ветки и срочным независимо от даты — тогда ставим руками.      */
function quadPickHTML(it) {
  const cur = isImportant(it) ? "imp" : "not";
  const opt = (k, label) => `<button class="chip ${cur === k ? "on" : ""}" data-act="equad"
    data-id="${it.id}" data-q="${k}">${label}</button>`;
  return `<p class="lbl">Важность</p>
    <div class="chips">${opt("imp", "важное")}${opt("not", "неважное")}</div>
    <p class="qs" style="margin:-8px 0 12px">Это ваше решение и ничьё больше.
      Срочность сюда не входит — она считается из дедлайна.</p>`;
}

/* ── Когда: дедлайн, дата выбора или точные дата и время ────────────
   У встреч и приёмов есть час, а не только день — поэтому рядом с датой
   появляется поле времени.                                          */
const DATEBOX = `padding:12px 14px;border:1px solid var(--line);
  border-radius:11px;background:var(--bg);margin-bottom:12px`;

/* Назначать дело в прошлое нельзя. Но если у дела уже стоит прошедшая
   дата, её оставляем допустимой — иначе такое дело нельзя было бы
   открыть и поправить.                                              */
const minDate = it => (it.due && it.due < today()) ? it.due : today();

function whenFieldsHTML(it, dateId, timeId) {
  if (isRoutine(it)) return "";
  if (isIdea(it)) return `<p class="qs" style="margin:24px 0 0">Идея ничего не требует
    и сама в «Сегодня» не просится. Захотите взяться — смените вид.</p>`;
  if (isAppt(it)) return `<p class="lbl">Дата и время</p>
    <div style="display:flex;gap:8px;align-items:center">
      <div style="flex:1;min-width:0">${ddDueHTML(it)}</div>
      ${ddTimeHTML(it)}
    </div>
    <p class="qs" style="margin:8px 0 0">${it.due === today()
      ? "Встреча сегодня — поэтому она стоит в дне и убрать её оттуда нельзя. Смените дату, и она уйдёт сама."
      : "Время видно в списках: «завтра в 14:30»."}</p>`;
  return `<p class="lbl">Дедлайн</p>${ddDueHTML(it)}`;
}

function wireWhen(id, dateId, timeId, after) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  /* Дата теперь выбирается выпадашкой (мини-календарь) — слушаем
     только время.                                                   */
  const t = document.getElementById(timeId);
  if (t && t.addEventListener) t.addEventListener("change", () => {
    it.time = t.value || null; save(); after();
  });
}

/* ── Заметки ─────────────────────────────────────────────────────────
   Поле одно на все виды: иначе, сменив вид, дело унесло бы заметку
   в невидимое. У аппоинтмента подпись другая — там это адрес и телефон.
   Пишется сразу, без перерисовки, чтобы не терялся курсор.          */
function notesBlockHTML(it, id) {
  return `<p class="lbl">${isAppt(it)
    ? "Адрес, телефон, что взять с собой"
    : "Заметки"}</p>
    <textarea class="notebox" id="${id}" placeholder="${isAppt(it)
      ? "Кайзерсграхт 12, 2 этаж · +31 20 123 45 67 · взять страховку"
      : "Что угодно, что пригодится"}">${esc(it.notes || "")}</textarea>`;
}

function wireNotes(itemId, fieldId) {
  const el = document.getElementById(fieldId);
  if (!el || !el.addEventListener) return;
  el.addEventListener("input", () => {
    const it = S.items.find(x => x.id === itemId);
    if (it) { it.notes = el.value; save(); }     // без перерисовки: курсор на месте
  });
}

/* ── Шаги: свойство любого дела, а не отдельный вид ──────────────────
   Один и тот же блок используется и в карточке дела, и в панели
   «Сегодня» при записи нового.                                       */
/* Шаги устроены как заметка и варианты: пока их нет — пунктирная кнопка
   «＋ шаги», одно нажатие раскрывает блок с полем ввода. Прежний чип
   «разбить на шаги» требовал второго клика внутри уже открытого блока. */
function stepsBlockHTML(it) {
  if (isRoutine(it) || !it.multi) return "";
  const doneN = it.steps.filter(s => s.done).length;
  return `<p class="lbl">Шаги${it.steps.length
    ? ` · закрыто ${doneN} из ${it.steps.length}` : ""}
      <button class="linkbtn" data-act="emulti" data-id="${it.id}"
        title="Вернуть дело к одному действию">убрать шаги</button></p>
    ${true ? `<div class="steps">${it.steps.map((s, i) => {
      const editing = EDITSTEP === it.id + ":" + i;
      return `<div class="step ${s.done ? "done" : ""} ${editing ? "editing" : ""}"${
        !editing && it.steps.length > 1 ? ` draggable="true" data-stepdrag="${it.id}:${i}"
          data-stepdrop="${it.id}:${i}"` : ""}>
        <button class="tick" data-act="step" data-id="${it.id}" data-i="${i}"></button>
        <span class="stepnum">${i + 1}</span>
        ${editing
          ? `<input type="text" class="stepedit" id="stepEdit" value="${esc(s.text)}"
               autocomplete="off">`
          : `<span class="steptext" data-act="editstep" data-id="${it.id}" data-i="${i}"
               title="Нажмите, чтобы поправить">${esc(s.text)}</span>`}
        ${editing ? "" : `<button class="linkbtn danger" data-act="delstep"
          data-id="${it.id}" data-i="${i}">убрать</button>`}
      </div>`; }).join("")}</div>
      <input type="text" id="newStep" placeholder="Добавить шаг и нажать Enter"
        title="В списках виден только следующий незакрытый шаг${it.steps.length > 1
          ? ". Порядок меняется перетаскиванием" : ""}">` : ""}`;
}

/* Записать поправленный шаг. Пустой текст не принимаем — для удаления
   у строки есть отдельная кнопка «убрать».                          */
function commitStepEdit(value) {
  if (!EDITSTEP) return;
  const parts = EDITSTEP.split(":");
  const it = S.items.find(x => x.id === parts[0]);
  const t = String(value == null ? "" : value).trim();
  if (it && it.steps[+parts[1]] && t) it.steps[+parts[1]].text = t;
  EDITSTEP = null;
  save();
  refreshEdit(parts[0]);
}

function wireStepsInput(id) {
  const se = document.getElementById("stepEdit");
  if (se && se.addEventListener) {
    se.addEventListener("keydown", e => {
      if (e.key === "Enter") commitStepEdit(se.value);
      else if (e.key === "Escape") { EDITSTEP = null; refreshEdit(id); }
    });
    se.addEventListener("blur", () => { if (EDITSTEP) commitStepEdit(se.value); });
    if (se.focus) se.focus();
  }
  const ns = document.getElementById("newStep");
  if (!ns || !ns.addEventListener) return;
  ns.addEventListener("keydown", e => {
    if (e.key !== "Enter" || !ns.value.trim()) return;
    const it = S.items.find(x => x.id === id); if (!it) return;
    it.steps.push({ text: ns.value.trim(), done: false });
    it.multi = true; stepFocus = true;      // чтобы сразу писать следующий шаг
    save(); refreshEdit(id);
  });
  if (stepFocus) { ns.focus(); stepFocus = false; }
}

/* ── Карточка дела ───────────────────────────────────────────────── */
/* ── Просмотр дела ────────────────────────────────────────────────────
   Нажатие на дело где угодно открывает сначала ТИХОЕ окно: всё видно,
   ничего нельзя случайно изменить. Правка — отдельным решением.     */
function openItem(id) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  if (it.draft) return drawCapture();
  if (it.done) return openDone(id, it.doneAt);
  const doneSteps = (it.steps || []).filter(s => s.done).length;
  /* Детали дела: шаги, варианты, расписание рутины, заметка. Собираем
     заранее — если их нет, разделитель не рисуем вовсе, иначе окно
     показывало две линии подряд с пустотой между ними.              */
  const details =
    (it.multi && (it.steps || []).length ? `<p class="lbl">Шаги · сделано ${doneSteps} из ${it.steps.length}</p>
      <div class="readsteps">${it.steps.map((st, k) => `<div class="readstep ${
        st.done ? "done" : ""}"><span class="stepnum">${k + 1}</span><span class="tx">${
        esc(st.text)}</span></div>`).join("")}</div>` : "")
    + ((isChoice(it) || isIdea(it)) && (it.options || []).length ? `<p class="lbl">Варианты</p>
      <div>${it.options.map(o => `<div class="opt">· ${linkify(o.text)}</div>`).join("")}</div>` : "")
    /* У встречи по расписанию нет ни доли, ни тепловой карты: пропуск
       встречи — не статистика, а отдельное событие. Достаточно дней,
       времени и того, сколько раз она уже состоялась.               */
    + (isAppt(it) && repeats(it) ? (() => {
      const hist = (it.repeat.history || []).slice().sort();
      const last = hist[hist.length - 1];
      const n = hist.length;
      return `<p class="lbl">В какие дни</p>
      ${daysRowHTML(it.repeat.days)}
      <p class="qs" style="margin:11px 0 0">${n
        ? `Состоялась ${n} ${plural(n, "раз", "раза", "раз")}, последний раз — ${formatDay(last)}`
        : "Пока не состоялась ни разу"}. Повторяется бессрочно, пока не удалите.</p>`; })() : "")
    + (isRoutine(it) && it.routine ? (() => { const wi = weekInfo(it), mo = monthInfo(it);
      const over = n => n ? ` · +${n} сверх расписания` : "";
      return `<p class="lbl">В какие дни</p>
      ${daysRowHTML(it.routine.days)}
      ${it.partOfDay || it.mins ? `<p class="qs" style="margin:11px 0 0">${
        [partName(it.partOfDay), minsLabel(it.mins)].filter(Boolean).join(" · ")}</p>` : ""}
      <p class="qs" style="margin:12px 0 4px">На этой неделе: <b style="color:var(--good)">${
        wi.hit} из ${wi.of}</b> уже сделано${over(wi.extra)}</p>
      ${weekDotsHTML(it)}
      <p class="qs" style="margin:15px 0 6px">За 4 недели: <b style="color:var(--good)">${
        mo.hit} из ${mo.of}</b>${over(mo.extra)}</p>
      ${heatHTML(mo)}`; })() : "")
    /* Класс .readnote, а не .opt: у вариантов есть верхняя граница,
       и она рисовала лишнюю линию под заголовком «Заметка».        */
    + (hasNotes(it) ? `<p class="lbl">${isAppt(it) ? "Адрес, телефон, заметки" : "Заметка"}</p>
      <div class="readnote">${linkify(it.notes)}</div>` : "");

  openModal(`<h3>${kindIcon(it)}${esc(it.title)}</h3>
    <div class="readmeta" style="margin-top:-4px">
      ${sphereTags(it)}
      ${inInbox(it) && !isIdea(it) ? `<span class="tag place">без категории</span>` : ""}
      ${it.place ? placeTag(it.place) : ""}
      ${it.person && it.person !== "Я" ? `<span class="tag place">${iconSVG("person", "currentColor")}${esc(it.person)}</span>` : ""}
      ${dateLabel(it) && !isRoutine(it) ? `<span class="tag when">${sandFor(it)}${dateLabel(it)}</span>` : ""}
      ${!isRoutine(it) && !isIdea(it)
        ? `<span class="tag quadtag" title="Клетка матрицы: срочность из дедлайна, важность — ваша">${
          esc(QUADS[quadrant(it)])}</span>` : ""}
    </div>
    ${details ? `<div class="sep"></div>${details}` : ""}

    <div class="row modalfoot">
      <button class="btn link" data-act="edit" data-id="${it.id}">Редактировать</button>
      <div class="spacer"></div>
      ${isRoutine(it) || isAppt(it) || isIdea(it) ? "" : `<button class="btn ${
        pickedToday(it) ? "link" : "primary"}" data-act="pin" data-id="${it.id}">${
        pickedToday(it) ? "Убрать из сегодня" : "Сделать сегодня"}</button>`}
    </div>`, "view:" + it.id, { act: "close", title: "Закрыть" });
}

function openEdit(id) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  /* openEdit вызывается заново после каждой правки, чтобы перерисовать
     окно, — снимок делаем только при первом открытии этого дела.     */
  if (!editBackup || editBackup.id !== id) {
    editBackup = JSON.parse(JSON.stringify(it));
    formOpen = { notes: false, options: false };
  }
  openModal(`<h3>${esc(it.title)}</h3>
    <input type="text" id="edTitle" value="${esc(it.title)}">

    ${itemFormHTML(it, { date: "edDate", time: "edTime", notes: "edNotes" })}

    <div class="row modalfoot">
      <button class="btn primary" data-act="esave" data-id="${it.id}">Готово</button>
      <div class="spacer"></div>
      <button class="btn outline danger" data-act="del" data-id="${it.id}">Удалить</button>
    </div>`, "item:" + it.id, { act: "ecancel", id: it.id, title: "Отменить правки и закрыть" });

  wireStepsInput(id);
  wireNotes(id, "edNotes");
  wireWhen(id, "edDate", "edTime", () => openItem(id));
  const no = document.getElementById("newOpt");
  if (no) no.addEventListener("keydown", e => {
    if (e.key === "Enter" && no.value.trim()) {
      it.options.push({ text: no.value.trim() }); save(); openItem(id);
    }
  });
}
/* Возвращает дело к снимку. Само дело остаётся — откатываются только правки. */
function cancelItem(id) {
  const cur = S.items.find(x => x.id === id);
  if (editBackup && editBackup.id === id && cur) {
    /* Возвращаем содержимое В ТОТ ЖЕ объект, а не подменяем его в списке:
       иначе ссылки на дело, взятые где-то ещё, остались бы на старой копии. */
    Object.keys(cur).forEach(k => { delete cur[k]; });
    Object.assign(cur, JSON.parse(JSON.stringify(editBackup)));
    save();
  }
  /* Правку отменили — возвращаемся в просмотр, а не захлопываем всё:
     дело открывали, чтобы посмотреть, и оно всё ещё интересно.      */
  editBackup = null;
  openItem(id); render();
}

function saveItem(id) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  const t = document.getElementById("edTitle");
  if (t && t.value.trim()) it.title = t.value.trim();
  save(); closeModal(); render();   // дата и время пишутся сразу при выборе
}

   СОБЫТИЯ
