}
function wireDirectories() {
  const nm = document.getElementById("dirName");
  if (nm && nm.addEventListener) {
    nm.addEventListener("keydown", e => { if (e.key === "Enter") {
      const d = DIRS[DIRPAGE];
      /* Виды дел сюда не попадают: строку вида не открыть на правку. */
      ({ sph: renameSphere, place: renamePlace, per: renamePerson })[d.act](DIREDIT);
    } });
    if (nm.focus) nm.focus();
  }
  const nw = document.getElementById("dirNew");
  if (nw && nw.addEventListener) nw.addEventListener("keydown", e => { if (e.key === "Enter") {
    const d = DIRS[DIRPAGE];
    /* Виды дел сюда не попадают: у них поля ввода нет вовсе. */
    ({ sph: addSphere, place: addPlace, per: addPerson })[d.act](nw);
  } });
}

const host = document.getElementById("modalHost");
/* Снимок дела на момент открытия — чтобы «Отмена» вернула всё как было.

/* ── Выпадающие списки (дизайн-пакет, эталон 09) ─────────────────────
   Открыт максимум один; DD хранит ключ вида "поле:идДела" или "here"/
   "allfilter". DDM — месяц мини-календаря, DDADD — раскрыт ли ввод
   нового места/человека. Клик мимо закрывает (см. обработчик клика). */
let DD = null, DDM = null, DDADD = false;
const ddId = () => DD && DD.indexOf(":") > 0 ? DD.slice(DD.indexOf(":") + 1) : null;
function ddClose(rerender) {
  const id = ddId(); DD = null; DDM = null; DDADD = false;

}
function ddToggle(key) {
  const oldId = ddId();
  DD = DD === key ? null : key; DDM = null; DDADD = false;
  const id = ddId() || oldId;
  if (id) refreshEdit(id); else render();
}
const ddCheck = `<svg class="ic ck" viewBox="0 0 16 16" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 5"/></svg>`;

/* Длительность списком, а не полем ввода: одно нажатие вместо набора,

/* Время — двумя списками, часы и минуты, а не родным полем браузера.
   Родное открывало свой список, который листается по минуте и выглядит
   чужим в этом окне. Один список на все 288 четвертей суток был бы не

const HOURS = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, "0"));
const MINS5 = Array.from({ length: 12 }, (_, i) => String(i * 5).padStart(2, "0"));

   встречаются: форма рутины, форма встречи по расписанию и оба окна

   показывала неделю с воскресенья вопреки настройке.               */

  return `<div class="ddwrap" data-ddwrap>
    <button class="ddbtn ${it.mins ? "" : "dim"}" data-act="dd" data-k="${key}"><span>${
      it.mins ? minsLabel(it.mins) : tr("не важно")}</span><i class="caret">▾</i></button>
    ${open ? `<div class="dd inline">
      ${MINCHOICES.map(n => `<button class="ddrow ${it.mins === n ? "on" : ""}" data-act="ddset"
          data-f="mins" data-id="${it.id}" data-v="${n}"><span>${minsLabel(n)}</span>${
          it.mins === n ? ddCheck : ""}</button>`).join("")}
      <button class="ddrow dim ${it.mins ? "" : "on"}" data-act="ddset" data-f="mins"
        data-id="${it.id}" data-v=""><span>${tr("не важно")}</span>${it.mins ? "" : ddCheck}</button>
    </div>` : ""}</div>`;
}

function ddPickHTML(it, field) {
  const isPlace = field === "place";
  const list = isPlace ? S.places : S.people;
  const cur = it[field] || null;
  const key = field + ":" + it.id, open = DD === key;
  const icon = v => isPlace ? iconSVG("pin", "var(--pin)") : iconSVG("person", "currentColor");
  return `<div class="ddwrap" data-ddwrap>
    <button class="ddbtn ${cur ? "" : "dim"}" data-act="dd" data-k="${key}">${icon()}<span>${
      cur ? esc(cur) : (isPlace ? tr("без места") : tr("без человека"))}</span><i class="caret">▾</i></button>
    ${open ? `<div class="dd inline">
      ${list.map(v => `<button class="ddrow ${v === cur ? "on" : ""}" data-act="ddset"
          data-f="${field}" data-id="${it.id}" data-v="${esc(v)}">${icon(v)}<span>${esc(v)}</span>${
          v === cur ? ddCheck : ""}</button>`).join("")}
      <button class="ddrow dim ${cur ? "" : "on"}" data-act="ddset" data-f="${field}"
        data-id="${it.id}" data-v=""><span>${isPlace ? tr("без места") : tr("без человека")}</span>${cur ? "" : ddCheck}</button>
      <div class="dddiv"></div>
      ${DDADD ? `<div class="ddaddrow"><input type="text" id="ddAddInp" autocomplete="off"
          data-f="${field}" data-id="${it.id}" placeholder="${isPlace ? tr("Новое место") : tr("Имя")}">
          <button class="btn primary" data-act="ddaddgo" data-f="${field}" data-id="${it.id}">${tr("Добавить")}</button></div>`
        : `<button class="ddrow ddadd" data-act="ddaddshow">＋ ${tr("добавить")} ${isPlace ? tr("место") : tr("человека")}</button>`}
    </div>` : ""}</div>`;
}

/* Новое место/человек прямо из формы: то же правило, что в справочниках —
   без дублей, и сразу назначается делу.                             */
function ddAddCommit(field, id) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  const inp = document.getElementById("ddAddInp");
  const t = inp && inp.value ? String(inp.value).trim() : "";
  if (!t) return;
  const list = field === "place" ? S.places : S.people;
  if (!list.some(x => String(x).toLowerCase() === t.toLowerCase())) list.push(t);
  it[field] = list.find(x => String(x).toLowerCase() === t.toLowerCase());
  DD = null; DDM = null; DDADD = false;
  save(); refreshEdit(id);
}

function ddCalHTML(it) {
  const anchor = DDM || it.due || today();
  const d = new Date(anchor + "T12:00:00");
  const y = d.getFullYear(), m = d.getMonth();
  const first = y + "-" + pad2(m + 1) + "-01";
  const start = startOfWeek(first);
  const inMonth = new Date(y, m + 1, 0).getDate();
  const lead = Math.round((new Date(first + "T12:00:00") - new Date(start + "T12:00:00")) / 864e5);
  const cells = Math.ceil((lead + inMonth) / 7) * 7;
  return `<div class="ddcal">
    <div class="ddnavrow"><button data-act="ddnav" data-d="prev" data-id="${it.id}">‹</button>
      <b>${MONTHS_NOM[m].toLowerCase()} ${y}</b>
      <button data-act="ddnav" data-d="next" data-id="${it.id}">›</button></div>
    <div class="ddwdrow">${wdOrder().map(w => `<i>${WD_BY_DAY[w]}</i>`).join("")}</div>
    <div class="ddgrid">${Array.from({ length: cells }, (_, i) => {
      const iso = addDays(start, i), dd2 = new Date(iso + "T12:00:00");
      const cls = (iso === today() ? " today" : "") + (iso === it.due ? " sel" : "")
        + (dd2.getMonth() !== m ? " out" : "");
      return iso < today()
        ? `<span class="ddday off${cls}">${dd2.getDate()}</span>`
        : `<button class="ddday${cls}" data-act="duepick" data-id="${it.id}"
             data-d="${iso}">${dd2.getDate()}</button>`;
    }).join("")}</div></div>`;
}

function ddDueHTML(it) {
  const key = "due:" + it.id, open = DD === key;
  return `<div class="ddwrap" data-ddwrap>
    <button class="ddbtn ${it.due ? "" : "dim"}" data-act="dd" data-k="${key}">${SAND}<span>${
      it.due ? dateLabel(it) : tr("без срока")}</span><i class="caret">▾</i></button>
    ${open ? `<div class="dd inline duedd">
      <div class="ddquick">
        <button class="chip" data-act="duequick" data-id="${it.id}" data-v="today">${tr("сегодня")}</button>
        <button class="chip" data-act="duequick" data-id="${it.id}" data-v="tomorrow">${tr("завтра")}</button>
        <button class="chip" data-act="duequick" data-id="${it.id}" data-v="week">${tr("через неделю")}</button>
        <button class="chip" data-act="duequick" data-id="${it.id}" data-v="none">${tr("без срока")}</button>
      </div>
      ${ddCalHTML(it)}
      <p class="qs" style="margin:6px 10px 6px">${tr("сегодня — в кольце · выбранное — залито")}</p>
    </div>` : ""}</div>`;
}

let editBackup = null;
let lastModalKey = null;
/* Какой шаг сейчас правится: "идДела:номер". Хранится снаружи, потому что
   окно перерисовывается на каждое действие.                          */
let EDITSTEP = null;
const closeModal = () => {
  host.innerHTML = ""; editBackup = null; lastModalKey = null; EDITSTEP = null;
};
function openModal(html, key, close) {
  /* Окно перерисовывается после каждого выбора — прокрутку сохраняем,
     иначе после нажатия на кнопку внизу оно прыгает в начало.
     Но только для ТОГО ЖЕ окна: новое всегда открывается сверху.     */
  const prev = host.querySelector ? host.querySelector(".modal") : null;
  const keep = (prev && key && key === lastModalKey) ? prev.scrollTop : 0;
  host.innerHTML = `<div class="veil"><div class="modal">${close
    ? `<div class="modalbar"><button class="modalx" data-act="${close.act}"${
        close.id ? ` data-id="${close.id}"` : ""} title="${close.title || tr("Закрыть")}">×</button></div>`
    : ""}${html}</div></div>`;
  const now = host.querySelector ? host.querySelector(".modal") : null;
  if (now) now.scrollTop = keep;
  lastModalKey = key || null;
}

/* ── Просмотр сделанного ─────────────────────────────────────────────
   В архиве править нечего: дело закрыто. Показываем, что в нём было —
   шаги, заметку и когда именно оно сделано.                         */
function openDone(id, when) {
  const it = S.items.find(x => x.id === id);
  if (!it) return;
  const rout = isRoutine(it);
  const hasSteps = it.multi && it.steps.length;
  openModal(`<h3>${kindIcon(it)}${esc(it.title)}</h3>
    <p class="qs" style="margin:-10px 0 16px">${rout ? tr("Отмечено")
      : isAppt(it) ? tr("Состоялась") : tr("Сделано")}:
      <b style="color:var(--good)">${formatDay(when)}</b>${when ? " · " + esc(when) : ""}</p>

    <div class="readmeta">
      ${sphereTags(it)}
      ${it.place ? placeTag(it.place) : ""}
      ${it.person && !isSelf(it.person) ? `<span class="tag place">${iconSVG("person", "currentColor")}${esc(it.person)}</span>` : ""}
      ${it.due && !rout ? `<span class="tag when">${tr("дедлайн был")} ${esc(it.due)}${
        it.time ? " " + esc(it.time) : ""}</span>` : ""}
    </div>

    ${(schedDays(it) || []).length ? `<p class="lbl">${tr("В какие дни")}</p>
      ${daysRowHTML(schedDays(it))}
      <p class="qs" style="margin:-4px 0 16px">${tr("Сделано")} ${routineScore(it).hit}
        ${tr("из")} ${routineScore(it).of} ${tr("за последнюю неделю.")}</p>` : ""}

    ${hasSteps ? `<p class="lbl">${tr("Шаги")}</p>
      <div style="margin-bottom:16px">${it.steps.map(s =>
        `<div class="readstep ${s.done ? "done" : ""}">
           <span class="m" style="color:${s.done ? "var(--good)" : "var(--dim)"}">${s.done ? "✓" : "○"}</span>
           <span class="tx">${esc(s.text)}</span></div>`).join("")}</div>` : ""}

    ${it.options && it.options.length ? `<p class="lbl">${tr("Варианты")}</p>
      <div style="margin-bottom:16px">${it.options.map(o =>
        `<div class="readstep"><span class="m">·</span><span class="tx">${linkify(o.text)}</span></div>`).join("")}</div>` : ""}

    ${hasNotes(it) ? `<p class="lbl">${isAppt(it) ? tr("Адрес, телефон, заметки") : tr("Заметка")}</p>
      <div class="readnote">${linkify(it.notes)}</div>` : ""}

    ${!it.notes && !hasSteps && !rout && !(it.options || []).length
      ? `<p class="qs" style="margin-bottom:16px">${tr("Ни шагов, ни заметок — просто сделано.")}</p>` : ""}

    <p class="qs" style="margin:0 0 14px">${tr("Здесь только просмотр. Чтобы снова править — верните дело.")}</p>
    <div class="row">
      <button class="btn ghost" data-act="undo" data-id="${it.id}">${tr("Вернуть в дела")}</button>
    </div>`, "done:" + id, { act: "close" });
}

/* ── Что уберём ──────────────────────────────────────────────────────
   Когда день уже полон, приложение не запрещает — оно показывает
   цену и предлагает обменять.                                        */
function askSwap(newId) {
  const it = S.items.find(x => x.id === newId);
  const mine = todayItems().mine;
  if (!it) return;
  /* Встречу убрать нельзя — она назначена, а не выбрана. */
  const free = mine.filter(m => !isTodayAppt(m));
  const appts = mine.length - free.length;
  openModal(`<h3>${tr("На сегодня уже")} ${mine.length}</h3>
    <p class="qs" style="margin:-10px 0 16px">${tr("Добавляем")} «<b>${esc(it.title)}</b>».
      ${free.length ? tr("Что уберём, чтобы день остался реальным?")
        : tr("Но день занят встречами — их не отложишь.")}</p>
    ${appts ? `<p class="qs" style="margin:-8px 0 12px">${tr("Встреч сегодня:")} ${appts}.
      ${tr("Они назначены, поэтому в обмен не идут.")}</p>` : ""}
    ${free.map(m => `<button class="swaprow" data-act="swap" data-id="${newId}" data-out="${m.id}">
      <span class="pickmark" style="color:var(--warm)">−</span>
      <span class="picktitle">${esc(m.title)}</span>
      ${sphereTags(m)}</button>`).join("")}
    <p class="qs" style="margin:12px 0 0">${tr("Убранное не пропадёт — вернётся в «Предлагаю».")}</p>
    <div class="row">
      <button class="btn ghost" data-act="swapskip" data-id="${newId}">${tr("Всё равно добавить")}</button>
    </div>`, "swap", { act: "close" });
}

/* ── Настройки ───────────────────────────────────────────────────────
   Здесь только то, что настраивают один раз. Всё, к чему возвращаешься
   каждую неделю, осталось в потоке.                                  */
/* Настройки копятся в черновике и вступают в силу по кнопке «Применить».
   Иначе каждое нажатие мгновенно перестраивало бы всё приложение
   за спиной у окна.                                                 */
let cfgDraft = null;
const cfgDirty = () => cfgDraft && JSON.stringify(cfgDraft) !== JSON.stringify(S.cfg);

/* Каждая настройка — самостоятельный блок: пары раскладываются рядом
   сеткой, а на узком окне сами встают друг под друга.               */
function cfgSeg(key, opts, label, hint) {
  return `<div class="cfgitem"><p class="lbl">${label}</p>
    <div class="seg" style="margin-bottom:4px">${opts.map(([v, L]) =>
      `<button data-act="cfg" data-k="${key}" data-v="${v}"
        class="${String(cfgDraft[key]) === String(v) ? "on" : ""}">${L}</button>`).join("")}</div>
    ${hint ? `<p class="qs" style="margin:0">${hint}</p>` : ""}</div>`;
}

function applyCfg() {
  if (cfgDraft) S.cfg = JSON.parse(JSON.stringify(cfgDraft));
  cfgDraft = null; save(); applyTheme(); setLang(); closeModal(); render();
}
function cancelCfg() { cfgDraft = null; closeModal(); render(); }

/* ── Копия данных ────────────────────────────────────────────────────
   Выгрузка отдаёт всё состояние одним файлом; загрузка кладёт файл в
   хранилище и перезапускает страницу, чтобы миграции и самопочинка
   прошли по загруженным данным как по своим.                        */
const exportPayload = () => JSON.stringify(S, null, 2);

function exportData() {
  if (typeof Blob === "undefined" || typeof URL === "undefined") return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([exportPayload()], { type: "application/json" }));
  a.download = tr("организатор-данные-") + today() + ".json";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function applyImport(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { data = null; }
  if (!data || !Array.isArray(data.items))
    return { error: tr("Это не файл с данными организатора.") };
  return { data, count: data.items.filter(i => i && !i.draft).length };
}

function importData(text) {
  const r = applyImport(text);
  if (r.error) return alert(r.error);
  const here = S.items.filter(i => !i.draft).length;
  if (!confirm(tr("Заменить данные в приложении теми, что в файле?") + "\n\n" + tr("Сейчас в приложении") + " "
      + here + " " + plural(here, "запись", "записи", "записей") + ", " + tr("в файле") + " "
      + r.count + " " + plural(r.count, "запись", "записи", "записей") + ".")) return;
  try { localStorage.setItem(KEY, JSON.stringify(r.data)); }
  catch (e) { return alert(tr("Не получилось сохранить — данные не тронуты.")); }
  if (typeof location !== "undefined" && location.reload) location.reload();
}

function openSettings() {
  if (!cfgDraft) cfgDraft = JSON.parse(JSON.stringify(S.cfg));
  /* Второй уровень — тот же попап: заголовок меняется на «‹ Настройки |
     Сферы», содержимое — на список. Одно окно, две глубины.        */
  /* Имя справочника могло остаться от прежней версии — тогда просто
     показываем список, а не падаем на пустом описании. */
  if (DIRPAGE && !DIRS[DIRPAGE]) DIRPAGE = null;
  if (DIRPAGE) {
    const d = DIRS[DIRPAGE];
    if (!dirBackup) dirBackup = dirSnapshot();
    openModal(`<h3 class="dirhead"><button class="btn link" data-act="dirback">${tr("‹ Настройки")}</button>
        <b>${tr(d.title)}</b></h3>
      ${dirPageHTML()}`, "settings:" + DIRPAGE,
      { act: "dirclose", title: tr("Закрыть без сохранения") });
    wireDirectories();
    return;
  }
  openModal(`<h3>${tr("Настройки")}</h3>

    <div class="cfggrid">
      ${cfgSeg("todayCap", [[3,"3"],[5,"5"],[7,"7"]], tr("Дел в день"),
        tr("Больше семи в день не помещается ни у кого — экран короткий намеренно."))}
      ${cfgSeg("urgentDays", [[1,tr("1 день")],[3,tr("3 дня")],[7,tr("неделя")]],
        tr("Горит за"),
        tr("Сколько дней до дедлайна дело считается срочным. Пересчитывается каждый день."))}
    </div>

    <div class="cfggrid">
      ${cfgSeg("theme", [["light",tr("светлая")],["dark",tr("тёмная")]], tr("Тема"))}
      ${cfgSeg("weekStart", [[1,tr("пн")],[0,tr("вс")]], tr("Начало недели"))}
    </div>

    <div class="cfggrid">
      ${cfgSeg("lang", [["ru","Русский"],["en","English"]], tr("Язык"))}
    </div>

    <div class="setdiv"></div>
    ${dirRowsHTML()}

    <div class="setdiv"></div>
    <p class="lbl">${tr("Данные")}</p>
    <div class="row" style="margin:0;justify-content:flex-start">
      <button class="btn ghost outline" data-act="exportdata">${tr("Сохранить в файл")}</button>
      <button class="btn ghost outline" data-act="importdata">${tr("Загрузить из файла")}</button>
    </div>
    <p class="qs" style="margin-top:10px">${tr("Всё хранится в этом браузере. Файл-копия — способ перенести данные или подстраховаться.")}</p>
    <input type="file" id="importFile" accept=".json,application/json" hidden>

    <div class="row modalfoot">
      <span class="qs" style="margin:0">${cfgDirty()
        ? `<b style="color:var(--warm)">${tr("Есть неприменённые изменения")}</b>`
        : tr("Всё применено")}</span>
      <div class="spacer"></div>
      <button class="btn ${cfgDirty() ? "primary" : "ghost"}" data-act="cfgapply"
        ${cfgDirty() ? "" : "disabled"}>${tr("Применить изменения")}</button>
    </div>`, "settings",
    { act: "cfgcancel", title: tr("Закрыть, не применяя изменения") });
  wireDirectories();
  const fi = document.getElementById("importFile");
  if (fi && fi.addEventListener) fi.addEventListener("change", () => {
    const f = fi.files && fi.files[0];
    if (!f || typeof FileReader === "undefined") return;
    const rd = new FileReader();
    rd.onload = () => importData(String(rd.result));
    rd.readAsText(f);
  });
}

/* ── Добавить дело ───────────────────────────────────────────────────
   Быстро: написал название, Enter — готово. Но здесь же доступны все
   те же параметры, что и при редактировании: вид, шаги, дедлайн, клетка
   матрицы, сферы, место, человек. Заполнять — по желанию.           */
let draftId = null, capFocus = false, stepFocus = false;
/* Какие необязательные блоки формы раскрыты в этот раз — общее для
   создания и правки. */
let formOpen = { notes: false, options: false };

/* Перерисовка открытой формы после каждой правки: черновик — своей
   отрисовкой, существующее дело — редактором. Функция была потеряна
   при удалении панели поиска: без неё падал любой клик в формах.   */
const refreshEdit = id => {
  if (draftId && id === draftId) return drawCapture();
  if (host.innerHTML) openEdit(id); else render();
};

/* ── Общая форма дела ────────────────────────────────────────────────
   Одна разметка на создание и на правку: секции и их порядок совпадают,
   различаются только заполненность и кнопки внизу. Раньше формы жили
   отдельно и успели разъехаться.                                     */
function itemFormHTML(it, ids) {
  /* Шаги видны сразу: разбить дело на шаги — обычное решение, ради него
     не нужно лишнее нажатие. Заметка и варианты нужны реже, поэтому
     свёрнуты и раскрываются кнопкой (или сами, если уже заполнены).  */
  const canOpts = isChoice(it) || isIdea(it);
  const canSteps = !isRoutine(it);
  const openNotes = formOpen.notes || hasNotes(it);
  const openOpts = canOpts && (formOpen.options || (it.options || []).length);
  const openSteps = canSteps && it.multi;
  /* data-id обязателен: без него перерисовка не знает, какое дело
     открыто, и блок молча не раскрывался.                          */
  const bNotes = `<button class="addtoday" data-act="formopen" data-k="notes"
    data-id="${it.id}">＋ ${tr("заметка")}</button>`;
  const bOpts = `<button class="addtoday" data-act="formopen" data-k="options"
    data-id="${it.id}">＋ ${tr("варианты")}</button>`;
  const bSteps = `<button class="addtoday" data-act="emulti" data-id="${it.id}">＋ ${tr("шаги")}</button>`;
  /* Когда пусто, отдельная плашка «Пока ничего нет» не нужна: поле
     ввода само говорит, что здесь делать.                          */
  const optsHTML = `<p class="lbl">${tr("Варианты")}</p>
      ${(it.options || []).length
        ? `<div>${it.options.map(o => `<div class="opt">· ${esc(o.text)}</div>`).join("")}</div>` : ""}
      <input type="text" id="newOpt" placeholder="${tr("Добавить вариант и нажать Enter")}"${
        (it.options || []).length ? ` style="margin-top:10px"` : ""}>`;
  /* Раскрытые блоки идут сверху во всю ширину, свёрнутые — рядом
     пунктирными кнопками.                                          */
  const opened = (openSteps ? stepsBlockHTML(it) : "")
    + (openNotes ? notesBlockHTML(it, ids.notes) : "")
    + (openOpts ? optsHTML : "");
  const folded = (canSteps && !openSteps ? bSteps : "")
    + (!openNotes ? bNotes : "")
    + (canOpts && !openOpts ? bOpts : "");
  const extra = opened + (folded ? `<div class="caprow">${folded}</div>` : "");

  /* Ячейки первой сетки. Порядок один на все виды: сначала «что это»,
     потом «когда», потом всё остальное. Раньше «Вид дела» оказывался
     то вторым, то четвёртым — в зависимости от вида дела, и форма
     каждый раз выглядела по-новому.
     Широкое (`wide`) занимает строку целиком: и потому что иначе не
     помещается, и потому что при нечётном числе полей рядом с
     последним зияла бы пустая клетка.                               */
  const cell = (label, body, wide) => `<div class="cfgitem${wide ? " wide" : ""}">
      <p class="lbl">${label}</p>${body}</div>`;
  const kindItem = cell(tr("Вид"), ddTypeHTML(it));
  /* Семь плиток — самый широкий элемент формы. В половине строки они
     сжимались вдвое против того, как выглядят в просмотре.          */
  const daysItem = days => cell(tr("В какие дни"), daysRowHTML(days, it.id), true);
  const partItem = cell(tr("Часть дня"),
    `<div class="seg">${PARTS.concat([["", "—"]]).map(([k, L]) =>
      `<button data-act="rpart" data-id="${it.id}" data-v="${k}"${
        k ? "" : ` title="${tr("Часть дня не важна")}"`}
        class="${(it.partOfDay || "") === k ? "on" : ""}">${k ? tr(L) : L}</button>`).join("")}</div>`, true);
  /* Одна дата или расписание — два ответа на «когда», а не два поля.
     У сессии по вторникам и четвергам одной даты не существует.      */
  const whenSwitch = cell(tr("Когда"),
    `<div class="seg">${[["once", tr("Одна дата")], ["days", tr("По расписанию")]].map(([k, L]) =>
      `<button data-act="arepeat" data-id="${it.id}" data-v="${k}"
        class="${(it.repeat ? "days" : "once") === k ? "on" : ""}">${L}</button>`).join("")}</div>`);

  const cells = kindItem + (
    isRoutine(it)
      ? cell(tr("Сколько занимает"), ddMinsHTML(it))
        + daysItem(it.routine && it.routine.days) + partItem
    : isAppt(it) || isRemind(it)
      ? whenSwitch + (it.repeat
          ? cell(tr("Как часто"), `<div class="seg">${REPEATS.map(([k, L]) =>
              `<button data-act="rmode" data-id="${it.id}" data-v="${k}"
                class="${everyOf(it) === k ? "on" : ""}">${tr(L)}</button>`).join("")}</div>`, true)
            + (everyOf(it) === "week" ? daysItem(it.repeat.days)
               : everyOf(it) === "year"
                 ? cell(tr("День"), ddNumHTML(it, "rnum", NUMS31, it.repeat.day, v => v, "day"))
                   + cell(tr("Месяц"), ddNumHTML(it, "rmon", MONTHNUMS, it.repeat.month,
                       v => MONTHS_NOM[v], "month"))
                 : cell(tr("Число месяца"),
                     ddNumHTML(it, "rnum", NUMS31, it.repeat.day, dayNum, "day")))
            /* Время занимает строку целиком только там, где иначе рядом
               осталась бы пустая клетка: при выборе числа месяца оно
               встаёт с ним в пару.                                    */
            /* У напоминания времени нет: оно про день, а не про час. */
            + (isRemind(it) ? "" : cell(tr("Время"), ddTimeHTML(it),
                everyOf(it) !== "month" && everyOf(it) !== "quarter"))
          /* Дата, часы и минуты стоят в одну линию — втроём в половину
             строки они не помещаются: кнопка даты сжималась до одной
             буквы, а мини-календарь вылезал за край окна.          */
          : `<div class="cfgitem wide">${
              whenFieldsHTML(it, ids.date, ids.time)}</div>`)
      : `<div class="cfgitem">${whenFieldsHTML(it, ids.date, ids.time)}</div>`);

  return `<div class="cfggrid">
      ${cells}
    </div>
    ${isAppt(it) && it.repeat ? `<p class="qs" style="margin:-8px 0 16px">${tr("Повторяется бессрочно, пока не удалите. Каждый раз отмечается отдельно — запись не закрывается.")}</p>` : ""}

    <p class="lbl">${tr("Сфера")}
      <span class="qs" style="text-transform:none;letter-spacing:0;margin-left:8px">${tr("можно несколько")}</span></p>
    <div class="chips">${S.spheres.map(v =>
      `<button class="chip ${it.spheres.indexOf(v) >= 0 ? "on" : ""}" data-act="esphere"
        data-id="${it.id}" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>
    ${(it.spheres || []).length > 1 ? `<div class="dupe">${tr("Это по-прежнему")} <b>${tr("одна запись")}</b>.
      ${tr("Она видна во всех выбранных ветках, а отметите сделанной — исчезнет сразу отовсюду.")}</div>` : ""}

    <div class="cfggrid">
      <div class="cfgitem"><p class="lbl">${tr("Место")}</p>${ddPickHTML(it, "place")}</div>
      <div class="cfgitem"><p class="lbl">${tr("Человек")}</p>${ddPickHTML(it, "person")}</div>
    </div>

    ${isRoutine(it) || isIdea(it) || isRemind(it) ? "" : `<p class="lbl">${tr("Важность")}</p>
      <div class="chips">${[["imp", tr("важное")], ["not", tr("неважное")]].map(([k, L]) =>
        `<button class="chip ${(isImportant(it) ? "imp" : "not") === k ? "on" : ""}"
          data-act="equad" data-id="${it.id}" data-q="${k}">${L}</button>`).join("")}</div>
      <p class="qs" style="margin:-6px 0 4px">${tr("Срочность сюда не входит — она считается из дедлайна.")}</p>`}

    ${extra}`;
}

function openCapture(preset) {
  capFocus = true;
  formOpen = { notes: false, options: false };
  const it = {
    id: uid(), title: "", type: defaultType(), multi: false, spheres: [], place: null,
    person: null, due: null, time: null, steps: [], options: [], routine: null,
    done: false, created: today(), createdAt: stamp(), notes: "", forceImp: null,
    today: null, notToday: null, draft: true,
  };
  /* Создание наследует ракурс: день в календаре даёт дедлайн, ветка на
     карте — сферу, клетка матрицы — важность и срочность. Половину вы
     уже сказали тем, откуда нажали.                                  */
  Object.assign(it, preset || {});
  S.items.push(it);
  draftId = it.id;
  drawCapture();
}

function drawCapture() {
  const it = S.items.find(x => x.id === draftId);
  if (!it) return closeModal();
  const chips = (list, act, cur, lbl) => `<p class="lbl">${lbl}</p><div class="chips">${
    list.map(v => `<button class="chip ${cur(v) ? "on" : ""}" data-act="${act}"
      data-id="${it.id}" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>`;

  openModal(`<h3>${tr("Новое дело")}</h3>
    <input type="text" id="capText" placeholder="${tr("Что нужно сделать?")}"
      autocomplete="off" value="${esc(it.title)}">
    <div id="capDupe"></div>

    ${itemFormHTML(it, { date: "capDate", time: "capTime", notes: "capNotes" })}

    <div class="row modalfoot">
      <button class="btn primary" data-act="capsave">${tr("Добавить")}</button>
      ${isRoutine(it) || isAppt(it) || isIdea(it) ? ""
        : `<button class="btn soft" data-act="capsavetake">${tr("добавить и взять")}</button>`}
      <div class="spacer"></div>
      <button class="btn link" data-act="capcancel">${tr("Отмена")}</button>
    </div>`, "capture", { act: "capcancel", title: tr("Отменить и закрыть") });

  const inp = document.getElementById("capText");
  if (inp && inp.addEventListener) {
    inp.addEventListener("input", () => {
      it.title = inp.value;
      const d = findDupes(inp.value, it.id);
      const box = document.getElementById("capDupe");
      if (box) box.innerHTML = d.length
        ? `<div class="dupe"><b>${tr("Похоже, это уже есть:")}</b><br>${d.map(x =>
            `«${esc(x.title)}»${(x.spheres || []).length ? " — " + esc(x.spheres.join(", ")) : ""}, ${tr("записано")} ${esc(x.created)}`).join("<br>")}
           <br><span style="opacity:.75">${tr("Если это другое дело — просто добавляйте.")}</span></div>`
        : "";
    });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") saveCapture(); });
    /* Фокус ставим только когда окно открылось. Иначе после каждого выбора
       браузер прокручивал бы окно обратно к полю названия.            */
    if (capFocus) { inp.focus(); capFocus = false; }
  }
  wireStepsInput(it.id);
  wireNotes(it.id, "capNotes");
  wireWhen(it.id, "capDate", "capTime", drawCapture);
}

/* «добавить и взять» — то же сохранение, только дело сразу уходит
   в сегодняшний список (с проверкой лимита).                        */
function saveCaptureTake() {
  const id = draftId;
  saveCapture();
  const it = S.items.find(x => x.id === id);
  if (it && !it.draft) tryAddToToday(id);
}

function saveCapture() {
  const it = S.items.find(x => x.id === draftId);
  if (!it) return closeModal();
  /* Название берём из самого дела: поле ввода пишет туда на каждой
     клавише, а окно между делом перерисовывается — читать из DOM хрупко. */
  if (!String(it.title).trim()) return cancelCapture();   // без названия дела нет
  it.title = it.title.trim();
  delete it.draft;
  draftId = null;
  save(); closeModal(); render();
}

function cancelCapture() {
  S.items = S.items.filter(x => x.id !== draftId);
  draftId = null;
  save(); closeModal(); render();
}

/* ── Разобрать: всё, что записано без ветки ──────────────────────── */
function openInbox() {
  const inb = here().filter(inInbox);
  openModal(`<h3>${tr("Разобрать")} · ${inb.length}</h3>
    <p class="sub">${tr("Записать сразу, разложить потом — так мысли не теряются.")}</p>
    ${inb.map(i => `<div class="card" style="box-shadow:none">
      <div class="title">${esc(i.title)}</div>
      <div class="chips" style="margin-top:10px">${S.spheres.map(sp =>
        `<button class="chip" data-act="assign" data-id="${i.id}" data-v="${esc(sp)}">${esc(sp)}</button>`).join("")}</div>
    </div>`).join("") || `<div class="empty">${tr("Пусто — всё разобрано.")}</div>`}
    `, "inbox", { act: "close" });
}

/* ── Добавить дело в сегодня ─────────────────────────────────────────
   Одно поле на оба случая: найти уже записанное или записать новое.
   Список совпадений заодно работает защитой от дубликатов.          */


/* ── Куда в матрице ──────────────────────────────────────────────────
   По умолчанию клетка считается сама. Но дело бывает важным независимо
   от ветки и срочным независимо от даты — тогда ставим руками.      */
function quadPickHTML(it) {
  const cur = isImportant(it) ? "imp" : "not";
  const opt = (k, label) => `<button class="chip ${cur === k ? "on" : ""}" data-act="equad"
    data-id="${it.id}" data-q="${k}">${label}</button>`;
  return `<p class="lbl">${tr("Важность")}</p>
    <div class="chips">${opt("imp", tr("важное"))}${opt("not", tr("неважное"))}</div>
    <p class="qs" style="margin:-8px 0 12px">${tr("Это ваше решение и ничьё больше.")}
      ${tr("Срочность сюда не входит — она считается из дедлайна.")}</p>`;
}

/* ── Когда: дедлайн, дата выбора или точные дата и время ────────────
   У встреч и приёмов есть час, а не только день — поэтому рядом с датой
   появляется поле времени.                                          */
const DATEBOX = `padding:12px 14px;border:1px solid var(--line);
  border-radius:11px;background:var(--bg);margin-bottom:12px`;

/* Назначать дело в прошлое нельзя. Но если у дела уже стоит прошедшая
   дата, её оставляем допустимой — иначе такое дело нельзя было бы
   открыть и поправить.                                              */
const minDate = it => (it.due && it.due < today()) ? it.due : today();

function whenFieldsHTML(it, dateId, timeId) {
  if (isRoutine(it)) return "";
  if (isIdea(it)) return `<p class="qs" style="margin:24px 0 0">${tr("Идея ничего не требует и сама в «Сегодня» не просится. Захотите взяться — смените вид.")}</p>`;
  if (isRemind(it)) return `<p class="lbl">${tr("Когда")}</p>${ddDueHTML(it)}
    <p class="qs" style="margin:8px 0 0">${tr("Напоминание ничего не требует: придёт в свой день и просто скажет.")}</p>`;
  if (isAppt(it)) return `<p class="lbl">${tr("Дата и время")}</p>
    <div style="display:flex;gap:8px;align-items:center">
      <div style="flex:1;min-width:0">${ddDueHTML(it)}</div>
      ${ddTimeHTML(it)}
    </div>
    <p class="qs" style="margin:8px 0 0">${it.due === today()
      ? tr("Встреча сегодня — поэтому она стоит в дне и убрать её оттуда нельзя. Смените дату, и она уйдёт сама.")
      : tr("Время видно в списках: «завтра в 14:30».")}</p>`;
  return `<p class="lbl">${tr("Дедлайн")}</p>${ddDueHTML(it)}`;
}

function wireWhen(id, dateId, timeId, after) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  /* Дата теперь выбирается выпадашкой (мини-календарь) — слушаем
     только время.                                                   */
  const t = document.getElementById(timeId);
  if (t && t.addEventListener) t.addEventListener("change", () => {
    it.time = t.value || null; save(); after();
  });
}

/* ── Заметки ─────────────────────────────────────────────────────────
   Поле одно на все виды: иначе, сменив вид, дело унесло бы заметку
   в невидимое. У аппоинтмента подпись другая — там это адрес и телефон.
   Пишется сразу, без перерисовки, чтобы не терялся курсор.          */
function notesBlockHTML(it, id) {
  return `<p class="lbl">${isAppt(it)
    ? tr("Адрес, телефон, что взять с собой")
    : tr("Заметки")}</p>
    <textarea class="notebox" id="${id}" placeholder="${isAppt(it)
      ? tr("улица Садовая 12, 2 этаж · +7 900 123 45 67 · взять страховку")
      : tr("Что угодно, что пригодится")}">${esc(it.notes || "")}</textarea>`;
}

function wireNotes(itemId, fieldId) {
  const el = document.getElementById(fieldId);
  if (!el || !el.addEventListener) return;
  el.addEventListener("input", () => {
    const it = S.items.find(x => x.id === itemId);
    if (it) { it.notes = el.value; save(); }     // без перерисовки: курсор на месте
  });
}

/* ── Шаги: свойство любого дела, а не отдельный вид ──────────────────
   Один и тот же блок используется и в карточке дела, и в панели
   «Сегодня» при записи нового.                                       */
/* Шаги устроены как заметка и варианты: пока их нет — пунктирная кнопка
   «＋ шаги», одно нажатие раскрывает блок с полем ввода. Прежний чип
   «разбить на шаги» требовал второго клика внутри уже открытого блока. */
function stepsBlockHTML(it) {
  if (isRoutine(it) || !it.multi) return "";
  const doneN = it.steps.filter(s => s.done).length;
  return `<p class="lbl">${tr("Шаги")}${it.steps.length
    ? ` · ${tr("закрыто")} ${doneN} ${tr("из")} ${it.steps.length}` : ""}
      <button class="linkbtn" data-act="emulti" data-id="${it.id}"
        title="${tr("Вернуть дело к одному действию")}">${tr("убрать шаги")}</button></p>
    ${true ? `<div class="steps">${it.steps.map((s, i) => {
      const editing = EDITSTEP === it.id + ":" + i;
      return `<div class="step ${s.done ? "done" : ""} ${editing ? "editing" : ""}"${
        !editing && it.steps.length > 1 ? ` draggable="true" data-stepdrag="${it.id}:${i}"
          data-stepdrop="${it.id}:${i}"` : ""}>
        <button class="tick" data-act="step" data-id="${it.id}" data-i="${i}"></button>
        <span class="stepnum">${i + 1}</span>
        ${editing
          ? `<input type="text" class="stepedit" id="stepEdit" value="${esc(s.text)}"
               autocomplete="off">`
          : `<span class="steptext" data-act="editstep" data-id="${it.id}" data-i="${i}"
               title="${tr("Нажмите, чтобы поправить")}">${esc(s.text)}</span>`}
        ${editing ? "" : `<button class="linkbtn danger" data-act="delstep"
          data-id="${it.id}" data-i="${i}">${tr("убрать")}</button>`}
      </div>`; }).join("")}</div>
      <input type="text" id="newStep" placeholder="${tr("Добавить шаг и нажать Enter")}"
        title="${tr("В списках виден только следующий незакрытый шаг")}${it.steps.length > 1
          ? ". " + tr("Порядок меняется перетаскиванием") : ""}">` : ""}`;
}

/* Записать поправленный шаг. Пустой текст не принимаем — для удаления
   у строки есть отдельная кнопка «убрать».                          */
function commitStepEdit(value) {
  if (!EDITSTEP) return;
  const parts = EDITSTEP.split(":");
  const it = S.items.find(x => x.id === parts[0]);
  const t = String(value == null ? "" : value).trim();
  if (it && it.steps[+parts[1]] && t) it.steps[+parts[1]].text = t;
  EDITSTEP = null;
  save();
  refreshEdit(parts[0]);
}

function wireStepsInput(id) {
  const se = document.getElementById("stepEdit");
  if (se && se.addEventListener) {
    se.addEventListener("keydown", e => {
      if (e.key === "Enter") commitStepEdit(se.value);
      else if (e.key === "Escape") { EDITSTEP = null; refreshEdit(id); }
    });
    se.addEventListener("blur", () => { if (EDITSTEP) commitStepEdit(se.value); });
    if (se.focus) se.focus();
  }
  const ns = document.getElementById("newStep");
  if (!ns || !ns.addEventListener) return;
  ns.addEventListener("keydown", e => {
    if (e.key !== "Enter" || !ns.value.trim()) return;
    const it = S.items.find(x => x.id === id); if (!it) return;
    it.steps.push({ text: ns.value.trim(), done: false });
    it.multi = true; stepFocus = true;      // чтобы сразу писать следующий шаг
    save(); refreshEdit(id);
  });
  if (stepFocus) { ns.focus(); stepFocus = false; }
}

/* ── Карточка дела ───────────────────────────────────────────────── */
/* ── Просмотр дела ────────────────────────────────────────────────────
   Нажатие на дело где угодно открывает сначала ТИХОЕ окно: всё видно,
   ничего нельзя случайно изменить. Правка — отдельным решением.     */
function openItem(id) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  if (it.draft) return drawCapture();
  if (it.done) return openDone(id, it.doneAt);
  const doneSteps = (it.steps || []).filter(s => s.done).length;
  /* Детали дела: шаги, варианты, расписание рутины, заметка. Собираем
     заранее — если их нет, разделитель не рисуем вовсе, иначе окно
     показывало две линии подряд с пустотой между ними.              */
  const details =
    (it.multi && (it.steps || []).length ? `<p class="lbl">${tr("Шаги")} · ${tr("сделано")} ${doneSteps} ${tr("из")} ${it.steps.length}</p>
      <div class="readsteps">${it.steps.map((st, k) => `<div class="readstep ${
        st.done ? "done" : ""}"><span class="stepnum">${k + 1}</span><span class="tx">${
        esc(st.text)}</span></div>`).join("")}</div>` : "")
    + ((isChoice(it) || isIdea(it)) && (it.options || []).length ? `<p class="lbl">${tr("Варианты")}</p>
      <div>${it.options.map(o => `<div class="opt">· ${linkify(o.text)}</div>`).join("")}</div>` : "")
    /* У встречи по расписанию нет ни доли, ни тепловой карты: пропуск
       встречи — не статистика, а отдельное событие. Достаточно дней,
       времени и того, сколько раз она уже состоялась.               */
    + (isAppt(it) && repeats(it) ? (() => {
      const hist = (it.repeat.history || []).slice().sort();
      const last = hist[hist.length - 1];
      const n = hist.length;
      return `${everyOf(it) === "week" ? `<p class="lbl">${tr("В какие дни")}</p>
      ${daysRowHTML(it.repeat.days)}` : ""}
      <p class="qs" style="margin:11px 0 0">${n
        ? `${tr("Состоялась")} ${n} ${plural(n, "раз", "раза", "раз")}, ${tr("последний раз —")} ${formatDay(last)}`
        : tr("Пока не состоялась ни разу")}. ${tr("Повторяется бессрочно, пока не удалите.")}</p>`; })() : "")
    + (isRoutine(it) && it.routine ? (() => { const wi = weekInfo(it), mo = monthInfo(it);
      const over = n => n ? ` · +${n} ${tr("сверх расписания")}` : "";
      return `<p class="lbl">${tr("В какие дни")}</p>
      ${daysRowHTML(it.routine.days)}
      ${it.partOfDay || it.mins ? `<p class="qs" style="margin:11px 0 0">${
        [partName(it.partOfDay), minsLabel(it.mins)].filter(Boolean).join(" · ")}</p>` : ""}

        it.working ? "" : `<button class="btn ${

    </div>`, "view:" + it.id, { act: "close", title: tr("Закрыть") });
}

function openEdit(id) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  /* openEdit вызывается заново после каждой правки, чтобы перерисовать
     окно, — снимок делаем только при первом открытии этого дела.     */
  if (!editBackup || editBackup.id !== id) {
    editBackup = JSON.parse(JSON.stringify(it));
    formOpen = { notes: false, options: false };
  }
  openModal(`<h3>${esc(it.title)}</h3>
    <input type="text" id="edTitle" value="${esc(it.title)}">

    ${itemFormHTML(it, { date: "edDate", time: "edTime", notes: "edNotes" })}

    <div class="row modalfoot">
      <button class="btn primary" data-act="esave" data-id="${it.id}">${tr("Готово")}</button>
      <div class="spacer"></div>
      <button class="btn outline danger" data-act="del" data-id="${it.id}">${tr("Удалить")}</button>
    </div>`, "item:" + it.id, { act: "ecancel", id: it.id, title: tr("Отменить правки и закрыть") });

  wireStepsInput(id);
  wireNotes(id, "edNotes");
  wireWhen(id, "edDate", "edTime", () => openItem(id));
  const no = document.getElementById("newOpt");
  if (no) no.addEventListener("keydown", e => {
    if (e.key === "Enter" && no.value.trim()) {
      it.options.push({ text: no.value.trim() }); save(); openItem(id);
    }
  });
}
/* Возвращает дело к снимку. Само дело остаётся — откатываются только правки. */
function cancelItem(id) {
  const cur = S.items.find(x => x.id === id);
  if (editBackup && editBackup.id === id && cur) {
    /* Возвращаем содержимое В ТОТ ЖЕ объект, а не подменяем его в списке:
       иначе ссылки на дело, взятые где-то ещё, остались бы на старой копии. */
    Object.keys(cur).forEach(k => { delete cur[k]; });
    Object.assign(cur, JSON.parse(JSON.stringify(editBackup)));
    save();
  }
  /* Правку отменили — возвращаемся в просмотр, а не захлопываем всё:
     дело открывали, чтобы посмотреть, и оно всё ещё интересно.      */
  editBackup = null;
  openItem(id); render();
}

function saveItem(id) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  const t = document.getElementById("edTitle");
  if (t && t.value.trim()) it.title = t.value.trim();
  save(); closeModal(); render();   // дата и время пишутся сразу при выборе
}

/* ── Празднование ─────────────────────────────────────────────────────
   Отметили дело — короткая радость. Не окно: не требует закрытия и не
   прерывает, если закрываете несколько дел подряд. Появляется, живёт
   пару секунд и уходит; клик убирает сразу.                         */
const CHEERS = [
  { ic: 'M8 1.6l1.7 3.9 4.3.4-3.2 2.8.9 4.2L8 10.7 4.3 12.9l.9-4.2L2 5.9l4.3-.4z', t: "Сделано!" },
  { ic: 'M2.6 13.4l3.2-8 5 5-8 3.2z M9.8 5.2l1-2.6 M12.2 7.6l2.6-1 M11.4 3.4l1.6 1.6', t: "Одним меньше" },
  { ic: 'M8 14.5s-5.5-3.4-5.5-7A2.9 2.9 0 018 5.4a2.9 2.9 0 015.5 2.1c0 3.6-5.5 7-5.5 7z', t: "Хорошо пошло" },
  { ic: 'M3 8.5l3.2 3.2L13 5 M1.8 12.6l1.2-1.2 M13.6 12.4l-1.2-1.2', t: "Это было в списке — и вот его нет" },
  { ic: 'M8 2.2c2.4 1.6 3.6 3.7 3.6 6.2 0 1-.3 1.9-.8 2.7H5.2a5 5 0 01-.8-2.7c0-2.5 1.2-4.6 3.6-6.2z M6.4 13.6h3.2 M8 6.4v1.4', t: "Полетело" },
];
let cheerTimer = null;
function celebrate(it) {
  const host = document.getElementById("cheerHost");
  if (!host) return;
  const c = CHEERS[Math.floor(Math.random() * CHEERS.length)];
  const n = S.items.filter(i => !i.draft && !isRoutine(i) && i.done && i.doneAt === today()).length
    + S.items.filter(i => !i.draft && isRoutine(i) && i.routine
        && i.routine.history.indexOf(today()) >= 0).length;
  host.innerHTML = `<div class="cheer" data-act="cheerhide">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round"><path d="${c.ic}"/></svg>
    <b>${tr(c.t)}</b>
    <span>${n === 1 ? tr("первое за сегодня") : n + " " + plural(n, "дело", "дела", "дел") + " " + tr("за сегодня")}</span>
  </div>`;
  if (cheerTimer) clearTimeout(cheerTimer);
  cheerTimer = setTimeout(() => { const h = document.getElementById("cheerHost");
    if (h) h.innerHTML = ""; }, 4500);
}

function toggleDone(id) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  const was = isRoutine(it)
    ? it.routine.history.indexOf(today()) >= 0
    : repeats(it) ? repeatDone(it, today()) : !!it.done;
  if (isRoutine(it)) {
    const h = it.routine.history, i = h.indexOf(today());
    if (i >= 0) h.splice(i, 1); else h.push(today());
  } else if (repeats(it)) {
    /* Встреча по расписанию не закрывается навсегда: отмечается день,
       а сама запись живёт дальше — до следующего раза.              */
    const h = it.repeat.history, i = h.indexOf(today());
    if (i >= 0) h.splice(i, 1); else h.push(today());
  } else if (nextStep(it)) {
    /* Закрытый шаг помнит свой день — он попадает в «сделанное» за
       сегодня, а дело остаётся в списке со следующим шагом.        */
    const st = nextStep(it);
    st.done = true; st.doneAt = today();
    if (!nextStep(it)) { it.done = true; it.doneAt = today(); }
  } else {
    it.done = !it.done;
    it.doneAt = it.done ? today() : null;
    /* Вернули встречу с прошедшей датой — значит, она не состоялась.
       Помечаем дату разобранной, иначе самопочинка утащит встречу
       обратно в архив раньше, чем вы смените дату.                  */
    if (!it.done && isAppt(it) && it.due && it.due < today()) it.autoDone = it.due;
    if (!it.done && it.multi) it.steps.forEach(s => s.done = false);
  }
  /* Радуемся только переходу «не сделано → сделано». Отмена и закрытие
     промежуточного шага проходят тихо.                              */
  const now = isRoutine(it)
    ? it.routine.history.indexOf(today()) >= 0 : !!it.done;
  save(); render();
  if (!was && now) celebrate(it);
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target && e.target.id === "ddAddInp")
    ddAddCommit(e.target.dataset.f, e.target.dataset.id);
});

document.addEventListener("click", e => {
  /* Открытая выпадашка закрывается кликом мимо неё. Если клик попал в
     другое действие — состояние просто сбрасываем, перерисует само.  */
  if (DD && !(e.target && e.target.closest && e.target.closest("[data-ddwrap]"))) {
    const hitAct = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
    ddClose(!hitAct);
  }
  /* Клик по фону намеренно ничего не делает: окно закрывается только
     явными кнопками, чтобы случайный промах не терял правки.        */
  const el = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  const it = id ? S.items.find(x => x.id === id) : null;

  switch (a) {
    case "tab":     TAB = el.dataset.t;
                    render(); break;
    case "cap":     openCapture(); break;
    case "settings": openSettings(); break;
    case "cfg":     { const k = el.dataset.k, raw = el.dataset.v;
                      cfgDraft[k] = raw === "true" ? true : raw === "false" ? false
                        : (isNaN(+raw) ? raw : +raw);
                      openSettings(); } break;   // в силу вступит по кнопке
    case "cfgapply":   applyCfg(); break;
    case "diropen":   DIRPAGE = el.dataset.p; DIREDIT = null;
                      dirBackup = null; dirSaved = false; openSettings(); break;
    /* «‹ Настройки» — обычная навигация: сделанное остаётся.
       Крестик — выход без сохранения: возвращаем снимок.          */
    case "dirback":   DIRPAGE = null; DIREDIT = null;
                      dirBackup = null; dirSaved = false; openSettings(); break;
    case "dirsave":   if (!dirDirty()) break;
                      save(); dirBackup = dirSnapshot(); dirSaved = true;
                      openSettings(); break;
    case "dirclose":  dirRestore(); dirBackup = null; dirSaved = false;
                      DIRPAGE = null; DIREDIT = null;
                      closeModal(); render(); break;
    case "diredit":   DIREDIT = v; openSettings(); break;
    case "dircancel": DIREDIT = null; openSettings(); break;
    case "exportdata": exportData(); break;
    case "importdata": { const fi = document.getElementById("importFile");
                         if (fi && fi.click) fi.click(); } break;
    case "cfgcancel":  DIRPAGE = null; DIREDIT = null; cancelCfg(); break;
    case "newhere": { const p = {}, d = el.dataset;
                      if (d.due) p.due = d.due;
                      if (d.sphere) p.spheres = [d.sphere];
                      if (d.place) p.place = d.place;
                      if (d.person) p.person = d.person;
                      if (d.type) { p.type = d.type;
                        if ((S.types.find(t => t.key === d.type) || {}).kind === "routine")
                          p.routine = { days: [0,1,2,3,4,5,6], history: [] }; }
                      if (d.quad) p.forceImp = d.quad[0] === "i";   // ракурс даёт только важность
                      openCapture(p); } break;
    case "inbox":   openInbox(); break;
    case "close":   closeModal(); break;
    case "cheerhide": { const h = document.getElementById("cheerHost");
                        if (h) h.innerHTML = ""; } break;
    case "toggle":  toggleDone(id); break;
    /* Отметка за конкретный день: у повторяющейся записи одной даты
       нет, и «сделано» без дня отмечало бы сегодняшний.            */
    case "toggleon": if (it && it.repeat) {
                      const d2 = el.dataset.d, h2 = it.repeat.history, k2 = h2.indexOf(d2);
                      if (k2 >= 0) h2.splice(k2, 1); else h2.push(d2);
                      save(); render(); } break;
    case "open":    openItem(id); break;
    case "edit":    if (it) openEdit(id); break;
    case "axis":    AXIS = el.dataset.a; render(); break;
    case "branch":  { const w = el.dataset.val, i = S.open.indexOf(w);
                      if (i >= 0) S.open.splice(i, 1); else S.open.push(w);
                      save(); render(); } break;
    case "openall": S.open = el.dataset.v === "all"
                      ? axisValues(AXIS).filter(v => itemsIn(v).length) : [];
                    save(); PAN = { x: 0, y: 0 }; ZOOM = 1; render(); break;
    case "zoom":    if (el.dataset.d === "fit") { ZOOM = 1; PAN = { x: 0, y: 0 }; }
                    else ZOOM = clamp(ZOOM * (el.dataset.d === "in" ? 1.25 : .8), 0.35, 4);
                    applyMapTransform(); break;
    /* Разворот не трогает саму карту — только отдаёт ей всё окно.
       Масштаб и сдвиг остаются как были.                          */
    case "mapfull": MAPFULL = !MAPFULL; render(); break;
    case "todayview": TODAYVIEW = el.dataset.v; render(); break;
    case "routview": ROUTVIEW = el.dataset.v; render(); break;
    case "calmode": CALMODE = el.dataset.m; render(); break;
    case "calnav":  { const d = el.dataset.d, back = d === "prev" ? -1 : 1;
                      if (d === "today") CALANCHOR = null;
                      else if (CALMODE === "month") {
                        /* Месяцы листаем МЕСЯЦАМИ. Раньше считалось ±30 дней
                           со сдвигом на 15-е — и с 31-го числа «назад» давало
                           1-е того же месяца, то есть нажатие уходило впустую. */
                        const x = new Date(anchor() + "T12:00:00");
                        CALANCHOR = isoDay(new Date(x.getFullYear(), x.getMonth() + back, 15));
                      } else {
                        CALANCHOR = addDays(anchor(), back * (CALMODE === "day" ? 1 : 7));
                      }
                      render(); } break;
    case "calday":  CALANCHOR = el.dataset.d; CALMODE = "day"; render(); break;

    case "capsave":   saveCapture(); break;
    case "capsavetake": saveCaptureTake(); break;
    case "formopen":  formOpen[el.dataset.k] = true;
                      if (draftId) drawCapture(); else refreshEdit(id); break;
    case "capcancel": cancelCapture(); break;

    case "assign":  if (it && it.spheres.indexOf(v) < 0) {
                      it.spheres.push(v); save(); openInbox(); renderChrome(); } break;
    case "dd":      ddToggle(el.dataset.k); break;
    case "ddset":   if (it) { const f = el.dataset.f, v2 = el.dataset.v || null;
                      if (f === "type") { it.type = v2;
                        if (isRoutine(it) && !it.routine) it.routine = { days:[0,1,2,3,4,5,6], history:[] };
                        if (isIdea(it) || isRoutine(it)) { it.due = null; it.time = null; }
                        /* Время и расписание повторов — свойства встречи.
                           На обычном деле время всплывало в подписях, а
                           поля для него в форме нет; расписание ломало
                           галочку — она писала день в историю повторов
                           вместо того, чтобы закрыть дело.            */
                        if (!isAppt(it)) { it.time = null; it.repeat = null; }
                      } else if (f === "mins") it.mins = v2 ? +v2 : null;
                      else it[f] = v2;
                      DD = null; DDM = null; DDADD = false;
                      save(); refreshEdit(id); } break;
    case "ddaddshow": DDADD = true; if (ddId()) refreshEdit(ddId()); break;
    case "ddaddgo":   ddAddCommit(el.dataset.f, el.dataset.id); break;
    case "duequick": if (it) { const v3 = el.dataset.v;
                      it.due = v3 === "none" ? null : v3 === "today" ? today()
                        : v3 === "tomorrow" ? addDays(today(), 1) : addDays(today(), 7);
                      if (!it.due && !isAppt(it)) it.time = null;
                      DD = null; DDM = null; save(); refreshEdit(id); } break;
    case "duepick": if (it && el.dataset.d >= today()) { it.due = el.dataset.d;
                      DD = null; DDM = null; save(); refreshEdit(id); } break;
    case "ddnav":   { const base = DDM || (it && it.due) || today();
                      const x = new Date(base + "T12:00:00");
                      DDM = isoDay(new Date(x.getFullYear(),
                        x.getMonth() + (el.dataset.d === "prev" ? -1 : 1), 15));
                      refreshEdit(el.dataset.id); } break;
    case "hereset": S.hereNow = el.dataset.v || null; DD = null; save(); render(); break;
    case "allfilterset": ALLFILTER = el.dataset.v; ALLQUERY = ""; DD = null; render(); break;
    case "allsortset":   ALLSORT = el.dataset.v; DD = null; render(); break;
    case "allperiodset": ALLPERIOD = el.dataset.v; DD = null; render(); break;
    case "etype":   if (it) { it.type = el.dataset.k;
                      if (isRoutine(it) && !it.routine) it.routine = { days:[0,1,2,3,4,5,6], history:[] };
                      /* У идеи и рутины нет срока: старый дедлайн не должен
                         молча висеть в календаре и «срок прошёл».   */
                      if (isIdea(it) || isRoutine(it)) { it.due = null; it.time = null; }
                      save(); refreshEdit(id); } break;
    case "esphere": if (it) { const j = it.spheres.indexOf(v);
                      if (j >= 0) it.spheres.splice(j, 1); else it.spheres.push(v);
                      save(); refreshEdit(id); } break;
    case "eplace":  if (it) { it.place = (v === "—" ? null : v); save(); refreshEdit(id); } break;
    case "eperson": if (it) { it.person = (v === "—" ? null : v); save(); refreshEdit(id); } break;
    case "step":    if (it) { const s = it.steps[+el.dataset.i]; s.done = !s.done;
                      save(); refreshEdit(id); } break;
    case "equad":   if (it) { it.forceImp = el.dataset.q === "imp";
                      save(); refreshEdit(id); } break;
    case "emulti":  if (it) { it.multi = !it.multi; save(); refreshEdit(id); } break;
    case "editstep": EDITSTEP = id + ":" + el.dataset.i; refreshEdit(id); break;
    case "delstep": if (it) { it.steps.splice(+el.dataset.i, 1);
                      EDITSTEP = null; save(); refreshEdit(id); } break;
    /* Переключатель, а не набор плиток: выбрано всегда ровно одно, и
       «не важно» — такой же полноправный вариант, а не пустота.      */
    /* Час и минуты меняются по отдельности, поэтому недостающая
       половина берётся из текущего значения, а без него — ровный час. */
    case "ttime":   if (it) { const f = el.dataset.f, v2 = el.dataset.v;
                      if (f === "clear") it.time = null;
                      else { const c = it.time || "09:00";
                        it.time = f === "h" ? v2 + ":" + c.slice(3, 5)
                                            : c.slice(0, 2) + ":" + v2; }
                      DD = null; save(); refreshEdit(id); } break;
    /* Одна дата или расписание — взаимоисключающий выбор у встречи. */
    case "arepeat": if (it) {
                      if (el.dataset.v === "days") {
                        if (!it.repeat) it.repeat = { every: "week", days: [], history: [] };
                        it.due = null;
                      } else it.repeat = null;
                      save(); refreshEdit(id); } break;
    /* Смена вида повтора: недостающие поля заводим со значениями по
       умолчанию, чтобы расписание сразу было заполненным.          */
    case "rmode":   if (it) { const e = el.dataset.v;
                      if (!it.repeat) it.repeat = { history: [] };
                      it.repeat.every = e;
                      if (e === "week" && !it.repeat.days) it.repeat.days = [];
                      if (e !== "week" && !it.repeat.day) it.repeat.day = 1;
                      if (e === "year" && it.repeat.month == null) it.repeat.month = 0;
                      save(); refreshEdit(id); } break;
    case "rdate":   if (it && it.repeat) { it.repeat[el.dataset.f] = +el.dataset.v;
                      DD = null; save(); refreshEdit(id); } break;
    case "rpart":   if (it) { it.partOfDay = el.dataset.v || null;
                      save(); refreshEdit(id); } break;
    case "rday":    if (it && schedDays(it)) { const d = schedDays(it), i = d.indexOf(+el.dataset.i);
                      if (i >= 0) d.splice(i, 1); else d.push(+el.dataset.i);
                      save(); refreshEdit(id); } break;
    case "placeadd": addPlace(el); break;
    case "placedel": removePlace(v); break;
    case "placeren": renamePlace(v); break;
    case "sphadd": addSphere(el); break;
    case "sphdel":   removeSphere(v); break;
    case "sphren":   renameSphere(v); break;
    case "peradd": addPerson(el); break;
    case "perdel":   removePerson(v); break;
    case "perren":   renamePerson(v); break;
    case "pin":     if (it) { if (pickedToday(it)) { dropFromToday(it); save(); render(); }
                      else tryAddToToday(id);
                      /* Нажали из правки — остаёмся в правке, из просмотра — в просмотре. */
                      if (host.innerHTML) (editBackup && editBackup.id === id ? openEdit : openItem)(id); } break;
    /* «Взяться» и «Сделать сегодня» равнозначны и устроены одинаково:
       залитая кнопка зовёт, ссылка отменяет.
       Взялись — значит начинаете сейчас, и дело само встаёт в день: по
       тем же правилам, что и «Сделать сегодня», включая лимит — в
       переполненный день оно спросит, что вытеснить, а не влезет тихо.
       «Отложить» из дня НЕ убирает: перестать работать над делом и
       выкинуть его из дня — разные решения.                        */
    case "work":    if (it) {
                      const on = !it.working;
                      const full = todayItems().chosenCount >= S.cfg.todayCap;
                      it.working = on;
                      /* «Взяться» — новое решение, и оно отменяет прежнее
                         «не сегодня». Без этого дело со сроком сегодня,
                         от которого утром отказались, оставалось
                         спрятанным: помечено работой, а нигде не видно. */
                      if (on) it.notToday = null;
                      /* «Отложить» — это «сегодня делать не буду». Дело
                         уходит из дня целиком, а не переезжает в соседнюю
                         створку: у дела в работе других выходов нет —
                         «в предложения» у него убрана как противоречивая.
                         Завтра вернётся само.                        */
                      else { it.today = null; it.notToday = today(); }
                      save();
                      if (on && !pickedToday(it) && !dueTodayTask(it) && !isAppt(it))
                        tryAddToToday(id);
                      if (host.innerHTML && !(on && full && !inDay(it))) openItem(id);
                      render(); } break;
    case "takeone": tryAddToToday(id); break;
    case "suggfold": S.suggCollapsed = !S.suggCollapsed; save(); render(); break;
    case "swap":    { const out = S.items.find(x => x.id === el.dataset.out);
                      if (out) unpickToday(out);      // вытеснено, а не отвергнуто
                      if (it) addToToday(it);
                      save(); closeModal(); render(); } break;
    case "swapskip": if (it) { addToToday(it); save(); } closeModal(); render(); break;
    case "skip":    if (it) { dropFromToday(it); save(); render(); } break;
    case "unpick":  if (it) { unpickToday(it); save(); render(); } break;
    case "esave":   saveItem(id); break;
    case "ecancel": cancelItem(id); break;
    case "opendone": openDone(id, el.dataset.when || null); break;
    case "undo":    toggleDone(id); if (host.innerHTML) closeModal(); break;
    case "undostep": if (it) { const st2 = it.steps[+el.dataset.i];
                       if (st2) { st2.done = false; delete st2.doneAt; }
                       save(); render(); } break;
    case "del":     if (it && confirm(tr("Удалить") + " «" + it.title + "»?")) {
                      S.items = S.items.filter(x => x.id !== id); save(); closeModal(); render(); } break;
  }
});

/* ══════════════════════════════════════════════════════════════════
   ПЕРЕТАСКИВАНИЕ
   Каждый вид правит свою ось: календарь — время, матрица — приоритет.
   Данные под это уже есть: due у дедлайнов, forceImp у важности.
   ══════════════════════════════════════════════════════════════════ */
let DRAGID = null, STEPDRAG = null;
const dropTarget = e => e.target && e.target.closest
  ? e.target.closest("[data-drop-due],[data-drop-quad],[data-drop-order]") : null;

document.addEventListener("dragstart", e => {
  const st = e.target && e.target.closest ? e.target.closest("[data-stepdrag]") : null;
  if (st) {                                   // тащим шаг внутри дела
    STEPDRAG = st.dataset.stepdrag;
    if (st.classList) st.classList.add("dragging");
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", STEPDRAG); } catch (_) {}
    }
    return;
  }
  const el = e.target && e.target.closest ? e.target.closest("[data-drag]") : null;
  if (!el) return;
  DRAGID = el.dataset.drag;
  if (el.classList) el.classList.add("dragging");
  if (e.dataTransfer) {
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", DRAGID); } catch (_) {}
  }
});

document.addEventListener("dragend", () => {
  if (STEPDRAG) { const id = STEPDRAG.split(":")[0]; STEPDRAG = null;
    clearDropMarks(); refreshEdit(id); return; }
  DRAGID = null; clearDropMarks(); render();
});

/* Убрать все следы перетаскивания со всех элементов сразу. */
function clearDropMarks() {
  if (!document.querySelectorAll) return;
  document.querySelectorAll(".dropok, .dropbefore, .dropafter").forEach(el => {
    el.classList.remove("dropok");
    el.classList.remove("dropbefore");
    el.classList.remove("dropafter");
  });
}

document.addEventListener("dragover", e => {
  if (STEPDRAG) {
    const t = e.target && e.target.closest ? e.target.closest("[data-stepdrop]") : null;
    if (!t) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
    clearDropMarks();
    if (t.classList) t.classList.add(dropAfter(e, t) ? "dropafter" : "dropbefore");
    return;
  }
  if (!DRAGID) return;
  const t = dropTarget(e);
  if (!t) return;
  e.preventDefault();                       // без этого браузер не даст бросить
  if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
  clearDropMarks();
  if (!t.classList) return;
  if (t.dataset.dropOrder) {
    /* Для перестановки показываем ЛИНИЮ МЕСТА, а не подсветку самой
       карточки: подсветка читается как «положить внутрь неё».        */
    t.classList.add(dropAfter(e, t) ? "dropafter" : "dropbefore");
  } else {
    t.classList.add("dropok");              // день или клетка — контейнер
  }
});

/* Верхняя половина — встать над, нижняя — под. */
function dropAfter(e, t) {
  if (!t.getBoundingClientRect) return false;
  const r = t.getBoundingClientRect();
  if (!r.height) return false;
  return (e.clientY - r.top) > r.height / 2;
}

document.addEventListener("dragleave", () => clearDropMarks());

document.addEventListener("drop", e => {
  if (STEPDRAG) {
    const t = e.target && e.target.closest ? e.target.closest("[data-stepdrop]") : null;
    const [sid, si] = STEPDRAG.split(":");
    if (t) {
      e.preventDefault();
      const [tid, ti] = t.dataset.stepdrop.split(":");
      if (sid === tid) moveStep(sid, +si, +ti, dropAfter(e, t));
    }
    STEPDRAG = null;
    clearDropMarks();
    refreshEdit(sid);
    return;
  }
  const t = dropTarget(e);
  if (!t || !DRAGID) return;
  e.preventDefault();
  const it = S.items.find(x => x.id === DRAGID);
  if (it) {
    /* Календарь правит время. В прошлое не назначаем — прошедшие дни
       и целями броска не помечены, но проверим и здесь.            */
    if (t.dataset.dropDue && t.dataset.dropDue >= today()) it.due = t.dataset.dropDue;
    if (t.dataset.dropQuad) {
      /* Матрица правит только важность — столбец. Строка (срочность)
         считается из дедлайна, поэтому бросок её не трогает.
         Бросок в тот же столбец ничего не меняет.                   */
      const want = t.dataset.dropQuad[0] === "i";
      if (isImportant(it) !== want) it.forceImp = want;   // в свой же столбец — ничего
    }
    if (t.dataset.dropOrder) {                                   // «Сегодня» правит порядок
      const dst = S.items.find(x => x.id === t.dataset.dropOrder);
      /* Рутины и дела — два разных списка. Перетаскивание из одного
         в другой ничего не значит, поэтому просто игнорируем.       */
      if (dst && isRoutine(it) === isRoutine(dst)) {
        const t0 = todayItems();
        ensureTodayOrder(t0.routines.map(x => x.id).concat(t0.mine.map(x => x.id))
          .concat(t0.routDone.map(x => x.id)).concat(t0.doneTasks.map(x => x.id)));
        reorderToday(DRAGID, t.dataset.dropOrder, dropAfter(e, t));
      }
    }
    save();
  }
  DRAGID = null;
  clearDropMarks();
  render();
});

document.addEventListener("keydown", e => {
  /* Escape тоже ничего не делает — по той же причине. */
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (typing || host.innerHTML) return;
  if (e.key === "n" || e.key === "т" || ((e.metaKey || e.ctrlKey) && e.key === "k")) {
    e.preventDefault(); openCapture();
  }
});

/* ══════════════════════════════════════════════════════════════════
   ЗАПУСК
   ══════════════════════════════════════════════════════════════════ */
const TABS = { today: "Сегодня", calendar: "Календарь", map: "Карта",
               matrix: "Матрица", all: "Список" };

function renderChrome() {
  document.getElementById("tabs").innerHTML = Object.keys(TABS).map(k =>
    `<button data-act="tab" data-t="${k}" class="${TAB === k ? "on" : ""}">${tr(TABS[k])}</button>`).join("");
  const hb = document.getElementById("hereBox");
  const cnt = p => live().filter(i => i.place === p).length;
  hb.innerHTML = `<span class="ddwrap" data-ddwrap>
    <button class="hereBtn" data-act="dd" data-k="here">${iconSVG("pin", "var(--pin)")}${
      esc(S.hereNow || tr("везде"))}<i class="caret">▾</i></button>
    ${DD === "here" ? `<div class="dd right">
      ${S.places.map(p => `<button class="ddrow ${S.hereNow === p ? "on" : ""}"
          data-act="hereset" data-v="${esc(p)}">${iconSVG("pin", "var(--pin)")}<span>${esc(p)}</span>
          <em>${cnt(p)} ${plural(cnt(p), "дело", "дела", "дел")} ${tr("здесь")}</em>${
          S.hereNow === p ? ddCheck : ""}</button>`).join("")}
      <div class="dddiv"></div>
      <button class="ddrow ${S.hereNow ? "" : "on"}" data-act="hereset" data-v="">
        <span>${tr("Везде · без учёта места")}</span>${S.hereNow ? "" : ddCheck}</button>
    </div>` : ""}</span>`;
  /* Дата живёт в шапке — она общая для всех экранов, а не свойство
     одной панели. Обновляется на каждой отрисовке: приложение часто
     остаётся открытым за полночь.                                   */
  const hd = document.getElementById("headDate");
  if (hd) hd.innerHTML = todayWidget();
  /* Надписи статичной шапки — из разметки, поэтому проставляются
     здесь: переключение языка перерисовывает всё приложение.       */
  const put = (id, f) => { const el = document.getElementById(id); if (el) f(el); };
  put("hereLabel", el => { el.textContent = tr("Я сейчас:"); });
  put("gearBtn",   el => { el.title = tr("Настройки"); });
  put("capBtn",    el => { el.textContent = "＋ " + tr("Добавить"); });
  const n = here().filter(inInbox).length;
  const ib = document.getElementById("inboxBtn");
  ib.hidden = !n; ib.textContent = tr("Разобрать") + " · " + n;
}

/* Вкладка, ось карты, режим календаря и срез списка запоминаются.
   Дата в календаре — нет: открывать вчерашнюю неделю бессмысленно.  */
function saveView() {
  try {
    localStorage.setItem(VIEWKEY, JSON.stringify({
      tab: TAB, axis: AXIS, calMode: CALMODE, allFilter: ALLFILTER, allSort: ALLSORT,
      allPeriod: ALLPERIOD,
    }));
  } catch (e) {}
}

function render() {
  normalizeItems();
  /* Разворот карты живёт только пока карта на экране. Снимаем его здесь,
     а не в обработчике вкладки: уйти с карты можно и иначе — через
     восстановление вида при загрузке, например.                     */
  if (TAB !== "map") MAPFULL = false;
  saveView();
  /* Экран перерисовывается целиком, и страница прыгала: списки меняют
     высоту, когда дело переезжает из «Предлагаю» в «Мой день».
     Запоминаем прокрутку и возвращаем — кроме случаев, когда мы сами
     ставим курсор в поле (тогда браузер должен к нему подвести).    */
  const wantFocus = ALLFOCUS;
  const y = (typeof window !== "undefined" && window.scrollY) || 0;
  /* Колонки «Сегодня» крутятся внутри себя — их прокрутку тоже
     возвращаем после перерисовки, иначе список прыгал бы вверх.     */
  const colY = view.querySelectorAll
    ? Array.from(view.querySelectorAll(".tcol")).map(c => c.scrollTop || 0) : [];
  if (view) view.className = TAB === "today" ? "fit" : "";
  renderChrome();
  ({ today: renderToday, calendar: renderCalendar, map: renderMap,
     matrix: renderMatrix, all: renderAll }[TAB])();
  if (!wantFocus && y && typeof window !== "undefined" && window.scrollTo) window.scrollTo(0, y);
  if (!wantFocus && colY.length && view.querySelectorAll)
    Array.from(view.querySelectorAll(".tcol")).forEach((c, k) => { if (colY[k]) c.scrollTop = colY[k]; });
}

document.getElementById("capBtn").dataset.act = "cap";
document.getElementById("gearBtn").dataset.act = "settings";
document.getElementById("inboxBtn").dataset.act = "inbox";
render();

/* Приложение часто остаётся открытым сутками. Раз в минуту проверяем,
   не наступил ли новый день: иначе «сегодня», рутины и дата в шапке
   остались бы вчерашними.                                           */
let LASTDAY = today();
setInterval(() => {
  if (today() === LASTDAY) return;
  LASTDAY = today();
  render();
}, 60000);
</script>
