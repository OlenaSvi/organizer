const iconSVG = (name, color) => `<svg class="ic" viewBox="0 0 16 16" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:${color}">${ICONS[name] || ""}</svg>`;

/* Токен вида: сходить/съездить и Сделать различаем по ключу, свои
   виды пользователя падают на токен их поведения (kind).            */
const kindToken = def => def.key === "errand" ? "go" : def.key === "task" ? "do"
  : ({ appt: "appt", choice: "buy", idea: "idea", routine: "routine",
       remind: "remind", plain: "do" }[def.kind] || "do");
const kindColor = it => `var(--kind-${kindToken(typeDef(it.type))})`;
/* Вид дела показывается ОДНОЙ иконкой перед названием — без текстового
   чипа: меток на строке и так много. Название вида — в подсказке при
   наведении и словами в окне дела.                                   */
const kindIcon = it => `<span class="kicon" title="${esc(typeName(it))}">${

const placeTag = p => p ? `<span class="tag place">${iconSVG("pin", "var(--pin)")}${esc(p)}</span>` : "";
/* Песочные часы — «у этого есть срок». Ставятся перед датой дедлайна;
   у встреч их нет: там не срок, а назначенный час.                  */
const SAND = `<svg class="ic sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS.sand}</svg>`;
const sandFor = it => isAppt(it) ? "" : SAND;
/* Где вы были в прошлый раз. Пережидает перезагрузку страницы, чтобы
   обновление не выбрасывало на «Сегодня»: сохраняется вместе с делами,
   но храним отдельным ключом — это про вид, а не про данные.        */
const VIEWKEY = "organizer.view";
const savedView = (() => {
  try { return JSON.parse(localStorage.getItem(VIEWKEY)) || {}; } catch (e) { return {}; }
})();
let TAB = savedView.tab || "today", AXIS = savedView.axis || "sphere";
const isOpen = v => S.open.indexOf(v) >= 0;

const colorOf = (axis, name) => {
  if (axis === "type") return `var(--kind-${kindToken(typeDef(name))})`;
  const list = axis === "place" ? S.places : axis === "person" ? S.people : S.spheres;
  return PALETTE[Math.max(0, list.indexOf(name)) % PALETTE.length];

/* ── ОДИН СЛОВАРЬ ДАТ НА ВСЁ ПРИЛОЖЕНИЕ ──────────────────────────────
   Раньше карточки говорили «через 9 дней», а матрица «31 августа ·
   через 9 дней» — одно и то же поле двумя языками. Теперь форма одна:
     сегодня · завтра · вчера          — ближайшее словами
     31 августа · через 9 дней          — дальше: дата и счёт
     19 августа · 3 дня назад           — прошедшее, без красного
   У встреч время идёт сразу после даты.                             */
function dateLabel(it) {
  if (isRoutine(it)) return dueToday(it) ? tr("сегодня") : "";
  /* У встречи по расписанию нет одной даты — «когда» отвечает само
     расписание. Формулировка всё равно одна и живёт здесь.          */
  if (repeats(it)) {
    const r = it.repeat, clock = it.time ? " · " + esc(it.time) : "";
    if (r.every === "year")    return r.day + " " + MONTHS[r.month] + " " + tr("каждый год") + clock;
    if (r.every === "month")   return tr("# каждый месяц").replace("#", dayNum(r.day)) + clock;
    if (r.every === "quarter") return tr("# раз в квартал").replace("#", dayNum(r.day)) + clock;
    return tr("по") + " " + wdOrder().filter(d => (r.days || []).indexOf(d) >= 0)
      .map(d => WD_BY_DAY[d]).join(", ") + clock;
  }
  const n = daysUntil(it.due);
  if (n === null) return "";
  const clock = it.time ? " " + esc(it.time) : "";
  if (n === 0)  return tr("сегодня") + clock;
  if (n === 1)  return tr("завтра") + clock;
  if (n === -1) return tr("вчера") + clock;
  return formatDay(it.due) + clock +
    (n > 0 ? " · " + tr("через #").replace("#", daysWord(n))
           : " · " + tr("# назад").replace("#", daysWord(-n)));
}

/* Какой это шаг из скольки. Показывается везде, где встречается
   многоэтапное дело: в списках, в матрице, в календаре, в предложениях.
   Один помощник — чтобы формулировка не разъехалась по экранам.     */
const stepNo = it => (!it.done && it.multi && (it.steps || []).length)
  ? Math.min(it.steps.filter(s => s.done).length + 1, it.steps.length) : 0;
const stepBadge = it => stepNo(it)
  ? `<span class="tag steptag">${tr("шаг")} ${stepNo(it)} ${tr("из")} ${it.steps.length}</span>` : "";
const stepMini = it => stepNo(it)
  ? `<span class="stepmini">${stepNo(it)}/${it.steps.length}</span>` : "";

function cardHTML(it, opts) {
  opts = opts || {};
  const step = nextStep(it);
  const when = dateLabel(it);
  /* В карточке взятого главная строка — следующее действие, а название
     дела уходит наверх мелкой подписью: «Сегодня» — экран делания, и
     сделать можно шаг, а не дело целиком. На остальных экранах имя
     дела остаётся главным — там его ищут, а не выполняют.           */
  const leadStep = step && !it.done;
  return `<div class="card ${it.done ? "done" : ""} ${opts.pinned ? "pinned" : ""} ${
    opts.chosen ? "chosen" : ""} ${opts.auto ? "appt" : ""}" data-id="${it.id}"${opts.sortable
      ? ` draggable="true" data-drag="${it.id}" data-drop-order="${it.id}"` : ""}>
    <div class="card-top">
      <button class="tick" data-act="toggle" data-id="${it.id}" title="${tr("Готово")}"></button>
      <div class="title" data-act="open" data-id="${it.id}">${kindIcon(it)}${
        leadStep ? esc(step.text) : esc(it.title)}${workDot(it)}</div>
      ${it.done || isRoutine(it) || isAppt(it) ? ""
        /* У встреч этих кнопок нет вовсе: их день определяется датой,
           а не выбором. Сегодняшняя в дне сама, остальные ждут своего. */
        /* Подпись говорит, куда дело уйдёт на самом деле. Взятое вами
           вернётся в «Предлагаю» — его можно взять снова. Дело со сроком
           сегодня туда не вернётся: срок уже сегодня, предлагать нечего,
           поэтому оно просто уходит из дня до завтра.                 */
        /* У дела в работе выходов ровно два: галочка и «Отложить» в его
           окне. «В предложения» была противоречива — дело уходило из
           дня, а признак работы оставался.                          */
        : it.working ? "" : `${TAB === "today" || inDay(it)
             ? (dueTodayTask(it) && !pickedToday(it)
                ? `<button class="linkbtn danger" data-act="unpick" data-id="${it.id}"
                     title="${tr("Убрать из дня. Срок остаётся — завтра дело придёт в предложения")}">${tr("не сегодня")}</button>`
                : `<button class="linkbtn danger" data-act="unpick" data-id="${it.id}"
                     title="${tr("Убрать из дня. Дело вернётся в «Предлагаю» и его можно взять снова")}">${tr("в предложения")}</button>`)
             : `<button class="linkbtn" data-act="pin" data-id="${it.id}">＋ ${tr("в сегодня")}</button>`}`}
    </div>

    ${leadStep ? `<div class="nextstep"><span class="stepno">${tr("Шаг")} ${
      it.steps.indexOf(step) + 1} ${tr("из")} ${it.steps.length}</span> ${tr("в")} «${esc(it.title)}»</div>` : ""}
    ${hasNotes(it) ? `<div class="cardnote">${esc(String(it.notes).length > 90
      ? String(it.notes).slice(0, 89) + "…" : it.notes)}</div>` : ""}
    ${isRoutine(it) ? weekDotsHTML(it) : ""}
    ${opts.why ? `<div class="why">${esc(opts.why)}</div>` : ""}
    <div class="meta">
      ${sphereTags(it)}
      ${(it.spheres || []).length > 1
        ? `<span class="tag place" title="${tr("Это одна запись, а не две")}">${tr("одно дело в")} ${it.spheres.length} ${tr("ветках")}</span>` : ""}
      ${it.place ? placeTag(it.place) : ""}
      ${personTag(it)}
      ${when ? `<span class="tag when">${sandFor(it)}${when}</span>` : ""}
    </div>
  </div>`;
}



/* ── СЕГОДНЯ ─────────────────────────────────────────────────────────
   У списка один хозяин — вы. Приложение не наполняет его, а предлагает.
   Раньше в «Сегодня» вперемешку жили ваш выбор и автоподбор: было не
   понять, чьё это решение, лимит ограничивал только автоподбор, а
   отложенное на завтра разбавлялось новыми подставленными делами.    */
function todayItems() {
  const all = live();
  /* Рутину нельзя «отложить на сегодня» — такой кнопки нет и не должно
     быть: пропуск и так ничем не наказывается. Просто не отмечаете.  */
  const allRout = all.filter(i => isRoutine(i) && scheduledToday(i));
  const routines = allRout.filter(i => !routineDoneToday(i));
  const routDone = allRout.filter(routineDoneToday);
  const rest = all.filter(i => !isRoutine(i));
  /* Встречи в «сделанном» среди дел не показываем: они остаются в своей
     панели зачёркнутыми — как отмеченная рутина в своей. Исчезнуть из
     панели и всплыть в колонке дел выглядело так, будто встреча куда-то
     делась.                                                          */
  const doneTasks = S.items.filter(i => i.done && !i.draft && !isRoutine(i)
    && !isAppt(i) && i.doneAt === today());
  const apptDone = S.items.filter(i => !i.draft && (isAppt(i) || isRemind(i))
    && i.done && i.doneAt === today());
  /* Шаги, закрытые сегодня у ещё живых дел: дело продолжается, но
     сделанное за день это тоже. У законченного дела шаги не дублируем —
     показываем само дело.                                            */
  const doneSteps = [];
  S.items.forEach(i => {
    if (i.draft || i.done || !i.multi) return;
    (i.steps || []).forEach((st, k) => {
      if (st.done && st.doneAt === today()) doneSteps.push({ it: i, st, k });
    });
  });

  /* Ваш выбор + сегодняшние встречи: они в дне по факту, а не по решению. */
  /* Встречу дня убрать нельзя — она назначена. Уйдёт сама, когда
     смените дату. Поэтому «не сегодня» на неё не действует.        */
  /* Лимит — про то, сколько вы БЕРЁТЕ. Встречи в него не входят: их не
     выбирали и убрать нельзя, иначе получалось бы «8 из 5» без выхода. */
  /* Дело в работе стоит в дне КАЖДЫЙ день, пока не закрыто или не
     отложено. «Взято сегодня» тут не годится: этот признак привязан к
     дате, и в полночь дело выпадало из дня, хотя вы его не закрывали и
     не откладывали — створка «в работе» пустела сама собой.         */
  const mine = rest.filter(i => isTodayEvent(i)
    || ((i.working || dueTodayTask(i) || pickedToday(i)) && !skippedToday(i)));
  /* В лимит считаем только встречи: напоминание не занимает времени —
     это факт дня, а не занятие.                                     */
  const apptCount = mine.filter(isTodayAppt).length;
  /* Три разные вещи в одном дне: встречи (час назначен), дела со сроком
     (день назначен) и взятое вами. Лимит — только про последнее: его
     вы выбирали, а остальное вам назначено, и «8 из 5» без выхода
     было бы упрёком, а не реализмом.                                */
  const dueCount = mine.filter(i => !isTodayEvent(i) && dueTodayTask(i) && !i.working).length;
  /* Дела в работе в лимит не входят: лимит про то, сколько вы БЕРЁТЕ
     сегодня, а взялись вы раньше. Считать их заново каждый день значило
     бы, что длинное дело съедает день просто фактом своего
     существования.                                                   */
  const workCount = mine.filter(i => !isTodayEvent(i) && i.working).length;
  const chosenCount = mine.filter(i => !isTodayEvent(i) && !dueTodayTask(i)
    && !i.working).length;
  /* Дело без сферы предлагается наравне со всеми: «Разобрать» — место,
     где сферу можно проставить, а не карантин, из-за которого дело
     не показывается в дне.                                          */
  const offerable = i => !pickedToday(i) && !skippedToday(i) && !isIdea(i)
    && !isAppt(i) && !isRemind(i)       // встречи и напоминания не предлагаем
    && !i.working                       // в работе — уже в дне
    && !dueTodayTask(i);                // со сроком сегодня — уже в дне
  const visible = rest.filter(i => offerable(i) && reachable(i));
  /* Спрятанное из-за места считаем и называем: молчаливое исчезновение
     дел выглядит как «переключатель не работает» — или хуже, как потеря. */
  const away = S.hereNow ? rest.filter(i => offerable(i) && !reachable(i)).length : 0;

  const byDate = (a, b) => sortKey(a).localeCompare(sortKey(b));

  /* ── Три повода предложить дело, и больше никаких ────────────────
     1. НЕ УСПЕЛИ — брали в прошлые дни и не закрыли. Возвращается
        сюда, а не в список: решение принимаете заново, без упрёков.
        Любое, в том числе неважное, — это уже был ваш выбор.
     2. СКОРО СРОК — важное, до срока осталось не больше «горит за».
        Сегодняшний срок сюда не попадает: такое дело уже в дне.
     3. ДАВНО ЖДЁТ — важное вообще без срока. Именно оно не делается
        годами, потому что его ничего не подпирает.

     Всё остальное молчит и придёт само в свой день. Раньше здесь была
     ещё бронь мест под «неважное со сроком» — она существовала затем,
     чтобы дело с сегодняшним сроком не исчезло из дня. Теперь оно
     попадает в день само, и бронь стала не нужна.                   */
  /* Дело в работе возвращается молча: «не успели» про него неправда —
     вы им занимались. За него говорит кружок у названия.           */
  const whyCarried = i => i.working ? "" : tr("не успели") + " "
    + (i.today === addDays(today(), -1) ? tr("вчера") : formatDay(i.today));
  const carried = visible.filter(i => i.today && i.today < today())
    .sort((a, b) => String(b.today).localeCompare(String(a.today)));
  const isNew = i => carried.indexOf(i) < 0;
  const soon = visible.filter(i => isNew(i) && isImportant(i) && urgency(i)).sort(byDate);
  const waiting = visible.filter(i => isNew(i) && isImportant(i) && !i.due)
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

  const pool = carried.map(i => ({ it: i, why: whyCarried(i) }))
    .concat(soon.map(i => ({ it: i, why: "" })))
    .concat(waiting.map(i => ({ it: i, why: tr("давно ждёт") })));

  /* По умолчанию встречи идут первыми и по времени — они привязаны к часу,
     всё остальное можно двигать вокруг них.                          */
  mine.sort((a, b) => (isTodayEvent(b) ? 1 : 0) - (isTodayEvent(a) ? 1 : 0)
    || sortKey(a).localeCompare(sortKey(b)));

  if (S.todayOrder && S.todayOrder.date === today()) {
    const ids = S.todayOrder.ids;
    const rank = id => { const k = ids.indexOf(id); return k < 0 ? 1e6 : k; };
    mine.sort((a, b) => rank(a.id) - rank(b.id));
    routines.sort((a, b) => rank(a.id) - rank(b.id));
    routDone.sort((a, b) => rank(a.id) - rank(b.id));
    doneTasks.sort((a, b) => rank(a.id) - rank(b.id));
  }
  let head = pool.slice(0, 7);
  /* Одно место всегда за «давно ждёт»: без дедлайна оно вечно в хвосте
     и иначе не показалось бы никогда — а именно оно и не делается
     годами. Это единственная бронь, которая осталась.               */
  const w = pool.find(s => s.why === tr("давно ждёт"));
  if (w && head.indexOf(w) < 0) head = head.slice(0, -1).concat([w]);
  /* Сколько ждёт за семёркой: видно, что «не сегодня» листает очередь. */
  const queued = pool.length - head.length;
  const proposals = head;

  /* Почему предложений столько, сколько есть, — объясняем ВСЕГДА, а не
     только на пустом списке: «почему тут одно дело» — тот же вопрос,
     что и «почему пусто», и ответ у приложения есть.               */
  const cand = rest.filter(i => !isIdea(i) && !isAppt(i));
  const parts = [];
  const nMine = cand.filter(i => pickedToday(i) && !skippedToday(i)).length;
  const nSkip = cand.filter(skippedToday).length;
  /* Молчащие делятся надвое, и причины разные: у одних срок ещё не
     подошёл, другим подпирать нечем. Одной фразой это не сказать. */
  const rests = cand.filter(i => !pickedToday(i) && !skippedToday(i) && !dueTodayTask(i)
    && reachable(i) && !proposals.some(s => s.it === i));
  const nLater = rests.filter(i => i.due).length;
  const nQuiet = rests.length - nLater;
  const nAway = S.hereNow ? cand.filter(i => !pickedToday(i) && !skippedToday(i)
    && !reachable(i)).length : 0;
  if (nMine) parts.push(nMine + " " + tr("уже в дне"));
  if (nSkip) parts.push(nSkip + " " + plural(nSkip, "вернётся", "вернутся", "вернутся") + " " + tr("завтра"));
  if (nLater) parts.push(nLater + " " + plural(nLater, "ждёт", "ждут", "ждут") + " " + tr("своего срока"));
  if (nQuiet) parts.push(nQuiet + " " + plural(nQuiet, "молчит", "молчат", "молчат") + " " + tr("без срока", "итог"));
  if (nAway) parts.push(nAway + " " + tr("в других местах"));
  const whyRest = parts.join(" · ");
  const whyEmpty = parts.length ? whyRest : tr("живых дел нет. Новые появятся здесь сами");
  return { routines, routDone, mine, doneTasks, doneSteps, apptDone,
           apptCount, chosenCount, dueCount, workCount, away,
           queued, whyEmpty, whyRest, proposals };
}

/* Рутина — фоновая привычка, ей хватает строки. Недельная полоса
   и разбор расписания живут в её карточке.                          */
/* Неделя рутины — ТЕКУЩАЯ календарная (с начала недели из настроек):
   по точке на каждый из 7 дней. Бледная — «не по расписанию», пустая —
   «по расписанию, не отмечено», синяя — «сделано» (в том числе сверх
   расписания). Будущие дни недели просто пустые — без укора.        */
function weekInfo(it) {
  const s0 = startOfWeek(today());
  const days = wdOrder().map((wd, k) => {
    const d = addDays(s0, k);
    return { d, wd,
      sched: !!(it.routine && it.routine.days.indexOf(wd) >= 0),
      done: !!(it.routine && it.routine.history.indexOf(d) >= 0) };
  });
  /* Сделанное вне расписания в долю не идёт — иначе выходило «2 из 1».
     Оно считается отдельно и показывается как плюс, а не как норма. */
  return { days, hit: days.filter(x => x.done && x.sched).length,
           of: days.filter(x => x.sched).length,
           extra: days.filter(x => x.done && !x.sched).length };
}

/* Четыре недели — горизонт, на котором видно направление, а не
   вчерашний промах. В знаменатель идут только прожитые дни и только
   с того дня, как рутина появилась: иначе новая привычка сразу
   показывала бы провал за месяц, которого не было.                 */
function monthInfo(it) {
  const s0 = addDays(startOfWeek(today()), -21);
  const weeks = []; let hit = 0, of = 0, extra = 0;
  for (let w = 0; w < 4; w++) {
    const row = [];
    for (let k = 0; k < 7; k++) {
      const d = addDays(s0, w * 7 + k);
      const future = d > today();
      const young = !!it.created && d < it.created;
      const sched = !!(it.routine && it.routine.days.indexOf(
        new Date(d + "T12:00:00").getDay()) >= 0);
      const done = !!(it.routine && it.routine.history.indexOf(d) >= 0);
      if (sched && !future && !young) { of++; if (done) hit++; }
      if (done && !sched) extra++;
      row.push({ d, sched, done, future, young });
    }
    weeks.push(row);
  }
  return { weeks, hit, of, extra };
}

/* Карта четырёх недель. Пропуск — пустая клетка с тонкой рамкой, а не
   красная: это отсутствие события, а не провинность.                */
function heatHTML(mo) {
  return `<div class="heatwrap">
    <div class="heathd">${wdOrder().map(d => `<span>${WD_BY_DAY[d]}</span>`).join("")}</div>
    <div class="heat">${mo.weeks.map(row => row.map(c => {
      const st = c.future || c.young ? "gone"
        : c.done ? (c.sched ? "done" : "extra")
        : c.sched ? "miss" : "off";
      const why = st === "done" ? tr("сделано")
        : st === "extra" ? tr("сделано сверх расписания")
        : st === "miss" ? tr("не отмечено (и это не страшно)")
        : c.young ? tr("рутины ещё не было") : c.future ? tr("ещё впереди") : tr("не по расписанию");
      return `<i class="hc ${st}${c.d === today() ? " now" : ""}"
        title="${esc(formatDay(c.d) + " — " + why)}"></i>`;
    }).join("")).join("")}</div></div>`;
}
const weekDotsHTML = it => `<div class="rdots"
    title="${tr("Эта неделя. Бледная точка — не по расписанию. Расписание — в карточке рутины")}">${
  weekInfo(it).days.map(x => `<i class="${x.done ? "on" : ""}${x.sched ? "" : " offday"}"
    title="${esc(formatDay(x.d) + " — " + (x.done ? (x.sched ? tr("сделано") : tr("сделано сверх расписания"))
      : x.sched ? tr("не отмечено (и это не страшно)") : tr("не по расписанию")))}"></i>`).join("")}</div>`;

function routineRowHTML(i, sortable) {
  const sc = routineScore(i);
  const wi = weekInfo(i);
  const done = i.routine && i.routine.history.indexOf(today()) >= 0;

  /* Три строки вместо одной: в узкой колонке название, чипы и счёт
     не помещались рядом и название рассыпалось по словам.          */
  const tags = sphereTags(i);
  return `<div class="rline ${done ? "done" : ""}"${sortable
      ? ` draggable="true" data-drag="${i.id}" data-drop-order="${i.id}"` : ""}>
    <button class="tick" data-act="toggle" data-id="${i.id}"></button>
    <div class="rmain">
      <div class="rtop">
        <button class="rname" data-act="open" data-id="${i.id}">${esc(i.title)}</button>
        <span class="rscore" title="${sc.fresh ? tr("Рутина заведена сегодня")
          : tr("Сделано на этой неделе")}">${sc.fresh ? tr("новая") : wi.hit + " " + tr("из") + " " + wi.of}</span>
      </div>
      ${tags || i.mins ? `<div class="rmeta">${
        i.mins ? `<span class="rmins">${minsLabel(i.mins)}</span>` : ""}${tags}</div>` : ""}
      ${weekDotsHTML(i)}
    </div>
  </div>`;
}

/* Группы по частям дня появляются, только если часть дня проставлена
   хоть у одной рутины. Пока её нет — плоский список, как было: пустой
   заголовок «В любое время» над всем списком ничего не объясняет.   */
/* Какие части дня вообще заняты — по этому решаем, показывать ли
   створки и какую открыть.                                          */
function routParts(list) {
  const out = [];
  PARTS.forEach(([k, L]) => {
    const n = list.filter(i => (i.partOfDay || "") === k).length;
    if (n) out.push([k, tr(L), n]);
  });
  const n0 = list.filter(i => !i.partOfDay).length;
  if (n0) out.push(["", tr(PART_ANY), n0]);
  return out;
}
/* Открытая створка: выбранная, иначе текущая по часам, иначе первая
   занятая. Пустую створку не открываем никогда.                     */
function routPick(parts) {
  const has = k => parts.some(p => p[0] === k);
  if (ROUTVIEW !== null && has(ROUTVIEW)) return ROUTVIEW;
  if (has(partNow())) return partNow();
  return parts.length ? parts[0][0] : "";
}
function routineListHTML(list, sortable) {
  return list.map(i => routineRowHTML(i, sortable)).join("");
}

/* Сделанное уезжает в конец своего блока: зачёркнуто, без подробностей.
   Галочка возвращает в работу, название открывает просмотр.         */
function doneLineHTML(i, when) {
  return `<div class="doneline" draggable="true" data-drag="${i.id}" data-drop-order="${i.id}">
    <button class="tick" data-act="toggle" data-id="${i.id}" title="${tr("Вернуть в работу")}"></button>
    <button class="donename" data-act="opendone" data-id="${i.id}" data-when="${when || ""}"
      title="${tr("Посмотреть")}">${esc(i.title)}</button>
  </div>`;
}

/* Закрытый шаг в «сделанном»: зачёркнут его текст, рядом — из какого
   дела. Галочка возвращает шаг в работу, а не всё дело.            */
function stepDoneLineHTML(d) {
  return `<div class="doneline">
    <button class="tick" data-act="undostep" data-id="${d.it.id}" data-i="${d.k}"
      title="${tr("Вернуть шаг в работу")}"></button>
    <button class="donename" data-act="open" data-id="${d.it.id}">${esc(d.st.text)}</button>
    <span class="ofdeal">${esc(d.it.title)} · ${tr("шаг")} ${d.k + 1} ${tr("из")} ${d.it.steps.length}</span>
  </div>`;
}

function suggestRowHTML(s) {
  const i = s.it;
  return `<div class="suggrow">
    <div class="suggmain">
      <div class="suggtitle">
        ${kindIcon(i)}
        <button class="suggname" data-act="open" data-id="${i.id}" title="${tr("Посмотреть детали")}">${
          esc(i.title)}${workDot(i)}</button>
      </div>
      <div class="suggmeta">
        ${stepBadge(i)}
        ${sphereTags(i)}
        ${inInbox(i) ? `<span class="tag place">${tr("без сферы")}</span>` : ""}
        ${i.place ? placeTag(i.place) : ""}
        ${s.why ? `<span class="suggwhy${s.quiet ? " quiet" : ""}">${esc(s.why)}</span>` : ""}
        ${dateLabel(i) ? `<span class="suggdate">${sandFor(i)}${dateLabel(i)}</span>` : ""}
      </div>
    </div>
    <button class="btn take" data-act="takeone" data-id="${i.id}">${tr("взять")}</button>
    <button class="linkbtn danger" data-act="skip" data-id="${i.id}"
      title="${tr("Не предлагать сегодня. Завтра вернётся")}">${tr("не сегодня")}</button>
  </div>`;
}

function renderToday() {
  const { routines, routDone, mine, doneTasks, doneSteps, proposals, apptDone,
          apptCount, chosenCount, dueCount, workCount, away, queued,
          whyEmpty, whyRest } = todayItems();
  const cap = S.cfg.todayCap;
  /* Две створки, не пересекаются: «дела» — то, что взято на сегодня,
     «в работе» — то, чем вы заняты давно. Створки показываем, только
     когда есть что разделять.                                       */
  const inWork = mine.filter(i => !isTodayEvent(i) && i.working);
  const plain = mine.filter(i => !isTodayEvent(i) && !i.working);
  const split = inWork.length > 0;
  const tasks = !split ? plain : (TODAYVIEW === "work" ? inWork : plain);
  /* Состоявшиеся сегодня встречи стоят там же, в конце: день не пятится
     назад, а наполняется. */
  const appts = mine.filter(isTodayEvent).concat(apptDone);
  /* «Взято больше» — только если вы сами набрали сверх лимита. Когда
     день переполнен сроками и встречами, упрекать не за что: их не
     выбирали. Тогда говорим, из чего сложился день, и называем выход. */
  const over = chosenCount > cap;
  const heavy = !over && (apptCount + dueCount)
    && (apptCount + dueCount + chosenCount) > cap;
  const anyRout = routines.length + routDone.length;

  /* Один экран без прокрутки страницы: дела — широкой левой колонкой,
     рутина и встречи — правой. Длинный список крутится внутри своей
     колонки, а сам экран стоит на месте.                            */
  /* Счётчик рассказывает весь день: сделанное — ярким, взятое и ещё не
     сделанное — полупрозрачным, сверх лимита — розовым. Сделанное не
     исчезает из счёта — день не пятится назад, а наполняется.       */
  const doneN = doneTasks.length + doneSteps.length;
  const takenN = chosenCount + dueCount + doneN;
  /* Штрихи сверх лимита ничем не выделены цветом: красный как упрёк не
     используется нигде, а «взяли больше обычного» — не провинность.
     Где проходит лимит, видно по просвету перед первым лишним штрихом. */
  const segs = Array.from({ length: Math.max(cap, takenN) }, (_, k) =>
    `<i class="${k < doneN ? "dn" : k < takenN ? "on" : ""}${k === cap ? " edge" : ""}"></i>`).join("");

  view.innerHTML = `<div class="tgrid"><div class="tcol">` +
    `<div class="todayhead"><h2>${tr("Дела")}</h2>
      ${split ? `<span class="seg tabseg">${[["all", tr("взято"), plain.length],
        ["work", tr("в работе"), inWork.length]].map(([k, L, n]) =>
        `<button data-act="todayview" data-v="${k}" class="${TODAYVIEW === k ? "on" : ""}"
          >${L} · ${n}</button>`).join("")}</span>` : ""}
      <span class="capseg">${segs}</span>
      ${takenN ? `<span class="mineno ${over ? "over" : ""}"
        title="${tr("Сделано из поставленных на сегодня. Полоски — лимит дня:")} ${cap}">${tr("сделано")} ${doneN} ${tr("из")} ${takenN}</span>` : ""}</div>` +
    `<div class="tscroll">` +
    awayNote(away) +
    (over ? `<div class="toomany">${tr("Взято больше, чем помещается в день.")}</div>` : "") +
    (heavy ? `<div class="toomany">${[
        apptCount ? apptCount + " " + plural(apptCount, "встреча", "встречи", "встреч") : "",
        dueCount ? dueCount + " " + plural(dueCount, "дело", "дела", "дел") + " " + tr("со сроком") : "",
        chosenCount ? chosenCount + " " + tr("взято") : ""].filter(Boolean).join(", ")
      } — ${tr("вместе это больше, чем помещается в день.")}
      ${tr("Встречу не отложить, а срок можно сдвинуть: откройте дело и поменяйте дату.")}</div>` : "") +
    (tasks.length
      ? tasks.map(i => cardHTML(i, { sortable: tasks.length > 1, chosen: true })).join("")
      : (proposals.length
        ? `<div class="empty" style="padding:26px 20px">${tr("Пока ничего не взято.")}<br>
            ${tr("Возьмите из предложенного — или ничего, если сегодня не тот день.")}</div>`
        : `<div class="empty" style="padding:26px 20px">${tr("На сегодня всё.")}</div>`)) +

    (doneTasks.length || doneSteps.length ? `<div class="donebox">${
      doneTasks.map(i => doneLineHTML(i, i.doneAt)).join("")
      + doneSteps.map(stepDoneLineHTML).join("")}</div>` : "") +

    (proposals.length ? `<div class="suggbox">
      <div class="suggtop">
        <button class="suggfold" data-act="suggfold" title="${S.suggCollapsed
          ? tr("Показать предложения") : tr("Свернуть — предложения подождут молча")}">
          <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${
            S.suggCollapsed ? "M6.5 4l4 4-4 4" : "M4 6.5l4 4 4-4"}"/></svg>${tr("Предлагаю")}${S.suggCollapsed
          ? ` · ${proposals.length + queued} ${plural(proposals.length + queued,
              "дело ждёт", "дела ждут", "дел ждут")}` : ""}</button>
        ${S.suggCollapsed ? "" : queued ? `<span class="qs" style="margin:0 0 0 auto"
          title="${tr("«не сегодня» показывает следующее")}">${tr("в очереди ещё")} ${queued} ${
          plural(queued, "дело", "дела", "дел")}</span>` : `<span class="spacer"></span>`}
      </div>
      ${S.suggCollapsed ? "" : proposals.map(suggestRowHTML).join("")
        + (whyRest ? `<p class="qs" style="margin:10px 2px 0">${tr("Остальное сейчас не предлагается:")} ${
          whyRest}.</p>` : "")}
    </div>` : `<p class="qs" style="margin:16px 2px 0">${tr("Предлагать нечего:")} ${whyEmpty}.</p>`) +

    `</div></div><div class="tcol side">` +

    (anyRout ? (() => {
      /* Панель короткая: показывать разом утро, день и вечер значит
         заставлять листать. Створки делят рутину по частям дня, и
         появляются, только когда занята не одна часть.              */
      const all = routines.concat(routDone);
      const parts = routParts(all);
      const pick = routPick(parts);
      const split = parts.length > 1;
      const mine2 = i => !split || (i.partOfDay || "") === pick;
      const shown = routines.filter(mine2), shownDone = routDone.filter(mine2);
      /* Створки стоят в самом заголовке, как у дел. Панель узкая, поэтому
         без счётчиков: четыре подписи с числами туда не помещаются, а
         сколько в створке — видно по самому списку.                 */
      /* Время стоит над списком своей створки, а не в шапке: там оно
         относилось ко всей панели и не говорило, к чему именно.
         В шапке остаётся название и сами створки у правого края.    */
      const mins = sumMins(shown);
      return `<div class="sidepanel routines"><h3>${tr("Рутина")}${
        split ? `<span class="seg tabseg">${parts.map(([k, L]) =>
          `<button data-act="routview" data-v="${k}" class="${pick === k ? "on" : ""}"
            >${L}</button>`).join("")}</span>` : ""}</h3>
      <div class="panelscroll"><div class="rbox">
        ${/* Название створки не повторяем: оно подсвечено в переключателе
              прямо над этой строкой. Слово «минута» целиком — строка
              одна на список, места хватает.
              Рутины без проставленного времени называем отдельно: без
              них «всего 10 минут» врало бы — в створке их больше.   */
          (() => {
            const noMins = shown.filter(i => !i.mins).length;
            if (!mins && !noMins) return "";
            const bits = [];
            if (mins) bits.push(`${tr("всего")} ${mins} ${
              plural(mins, "минута", "минуты", "минут")}`);
            if (noMins) bits.push(mins ? `+ ${noMins} ${tr("без времени")}`
              : `${noMins} ${plural(noMins, "рутина", "рутины", "рутин")
                } ${tr("без заданного времени")}`);
            return `<p class="rsum">${bits.join(" ")}</p>`;
          })()}
        ${routineListHTML(shown, anyRout > 1)}
        ${shownDone.map(i => doneLineHTML(i, today())).join("")}
      </div></div></div>`; })() : "") +

    /* «События дня», а не «Аппоинтменты»: тут же живут напоминания, и
       день рождения — не встреча.                                   */
    `<div class="sidepanel appts"><h3>${tr("События дня")}</h3>
      <div class="panelscroll"><div class="apptbox">${appts.length ? appts.map(apptRowHTML).join("")
        : `<div class="apptempty"><b>${tr("На сегодня ничего не назначено")}</b>
             ${tr("Это не «ничего» — день дышит свободнее.")}</div>`}</div></div></div>` +
    `</div></div>`;
}

/* Встреча в «Сегодня» — короткая строка: время и название. Её не выбирали
   и не двигают, поэтому ей не нужна карточка. Детали — по нажатию.  */
function apptRowHTML(i) {
  /* Колонка узкая: время и название — верхней строкой, метки — нижней.
     В одну линию они наезжали друг на друга.                        */
  const tags = sphereTags(i) + (i.place ? placeTag(i.place) : "");
  /* Разовая встреча после галочки уходит из панели сама. Повторяющаяся
     остаётся — значит, обязана выглядеть отмеченной, иначе кажется,
     что галочка не сработала.                                       */
  const done = repeatDone(i, today()) || (i.done && i.doneAt === today());
  return `<div class="aline${done ? " done" : ""}">
    <button class="tick" data-act="toggle" data-id="${i.id}" title="${tr("Состоялась")}"></button>
    <div class="amain">
      <div class="atop">
        ${isRemind(i) ? "" : `<span class="atime${i.time ? "" : " none"}">${
          i.time ? esc(i.time) : tr("без времени")}</span>`}
        <button class="rname" data-act="open" data-id="${i.id}">${
          isRemind(i) ? kindIcon(i) : ""}${esc(i.title)}</button>
      </div>
      ${tags ? `<div class="ameta">${tags}</div>` : ""}
    </div>
  </div>`;
}

/* ── ВСЁ ─────────────────────────────────────────────────────────────
   Единственный плоский срез: список всего живого, без линз. Остальные
   виды показывают жизнь через принадлежность, время или важность —
   и в каждом что-то намеренно не показано. Здесь не показано ничего.  */
/* Какая створка колонки дел открыта. Нарочно не запоминается между
   заходами: оставленная на «в работе», назавтра она показала бы пустой
   день, и было бы непонятно, куда всё делось.                       */
let TODAYVIEW = "all";
/* Какая часть дня открыта в панели рутины. null — «сама решай»: панель
   встаёт на текущую по часам. Между заходами не запоминается по той же
   причине, что и створки дел.                                       */
let ROUTVIEW = null;
let ALLFILTER = savedView.allFilter || "all", ALLQUERY = "";
let ALLSORT = savedView.allSort || "due";
let ALLPERIOD = savedView.allPeriod || "all";

/* Период отвечает на разные вопросы в разных срезах: в архиве — «что я
   сделала за неделю» (по дате выполнения), в живых списках — «что я
   записала за неделю» (по дате появления дела).                     */
const ALLPERIODS = [
  ["all",   "за всё время", 0],
  ["week",  "за неделю",    7],
  ["month", "за месяц",    30],
];
const periodDef = () => ALLPERIODS.find(x => x[0] === ALLPERIOD) || ALLPERIODS[0];
const inPeriod = date => {
  const days = periodDef()[2];
  if (!days) return true;
  return !!date && date >= addDays(today(), -days);
};
const CALICON = `<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor"
  stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3.2" width="12" height="10.8" rx="2"/><path d="M2 6.4h12M5.4 1.8v2.6M10.6 1.8v2.6"/></svg>`;

/* Порядок отвечает на разные вопросы: «что горит» (срок), «что я сама
   считаю важным» (важность), «что я недавно записала» (свежесть),
   «где тут вот это дело» (алфавит). Сфера сюда не входит — её видно
   на карте, там она и живёт.                                       */
const ALLSORTS = [
  ["due",   "по сроку",         (a, b) => sortKey(a).localeCompare(sortKey(b))],
  ["imp",   "сначала важные",   (a, b) => (isImportant(b) ? 1 : 0) - (isImportant(a) ? 1 : 0)
                                  || sortKey(a).localeCompare(sortKey(b))],
  ["fresh", "сначала новые",    (a, b) => (b.createdAt || 0) - (a.createdAt || 0)
                                  || String(b.created).localeCompare(String(a.created))
                                  || a.title.localeCompare(b.title, "ru")],
  ["alpha", "по алфавиту",      (a, b) => a.title.localeCompare(b.title, "ru")],
];
const sortDef = () => ALLSORTS.find(x => x[0] === ALLSORT) || ALLSORTS[0];
const SORTICON = `<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor"
  stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11"/><path d="M4.5 8h7"/><path d="M6.5 12h3"/></svg>`;

/* Срезы не зашиты, а строятся из справочника «Что это»: переименовали
   вид или добавили свой — фильтр повторит это сам, один в один.
   «Дела» — общий срез всего, что требует действия к сроку.          */
const allFilters = () => [
  /* Срез «дела» («всё, кроме рутины, встреч и идей») убран: плоский вид
     остался один, и он же назван «дело» — два соседних пункта означали
     ровно одно и то же. Виды больше не заводятся, так что второй
     плоский вид не появится.                                        */
  ["all", "все", () => true],
  ...S.types.map(d => ["type:" + d.key, typeLabel(d), i => i.type === d.key]),
  ["steps",   "с шагами",    i => i.multi && (i.steps || []).length > 0],
  ["done",    "сделанные",   null],   // особый: смотрит в архив, а не в живое
  ["overdue", "срок прошёл", i => i.due && daysUntil(i.due) < 0],
];

function allItems() {
  const FS = allFilters();
  /* Вид могли удалить, пока его срез был выбран — падаем на «дела». */
  const f = (FS.find(x => x[0] === ALLFILTER) || FS[0])[2] || (() => true);
  const words = norm(ALLQUERY);
  const q = ALLQUERY.trim().toLowerCase();
  return here().filter(f)
    .filter(i => inPeriod(i.created))
    .filter(i => !q || i.title.toLowerCase().indexOf(q) >= 0
      || words.every(w => norm(i.title).some(v => v.indexOf(w) === 0)))
    .sort(sortDef()[2]);
}

function allRowHTML(i) {
  return `<div class="allrow">
    ${/* Рутина отмечается и отсюда — тем же днём, что и в панели дня.
          Раньше тут стояла приглушённая заглушка без действия: кружок
          есть, нажимаешь — ничего. Либо кнопка работает, либо её нет. */
      isRoutine(i)
      ? `<button class="tick${routineDoneToday(i) ? " on" : ""}" data-act="toggle"
           data-id="${i.id}" title="${tr("Отметить сделанной сегодня")}"></button>`
      : `<button class="tick" data-act="toggle" data-id="${i.id}" title="${tr("Отметить сделанным")}"></button>`}
    ${kindIcon(i)}
    <button class="suggname" data-act="open" data-id="${i.id}">${
      esc(i.title)}${workDot(i)}</button>
    ${sphereTags(i)}
    ${inInbox(i) ? `<span class="tag place">${tr("без категории")}</span>` : ""}
    ${i.place ? placeTag(i.place) : ""}
    ${stepBadge(i)}
    <span class="suggdate">${isRoutine(i)
      ? esc(i.routine.days.length + "/7 " + tr("дней"))
      : (dateLabel(i) ? sandFor(i) + dateLabel(i) : tr("без дедлайна"))}</span>
  </div>`;
}

function drawAllList() {
  const box = document.getElementById("allList");
  if (!box) return;
  const c = document.getElementById("allCount");
  if (ALLFILTER === "done") {
    box.innerHTML = doneListHTML(ALLQUERY.trim());
    const n = doneEntries().length;
    if (c) c.textContent = n + " " + plural(n, "запись", "записи", "записей");
    return;
  }
  const list = allItems();
  box.innerHTML = list.length
    ? list.map(allRowHTML).join("")
    : `<div class="empty" style="padding:30px 20px">${tr("Ничего не нашлось.")}</div>`;
  if (c) c.textContent = list.length + " " + plural(list.length, "дело", "дела", "дел");
}

function renderAll() {
  /* Счётчик стоит над списком, а не у заголовка: после фильтрации важно
     видеть, сколько осталось, рядом с тем, что осталось.            */
  view.innerHTML = `<div class="todayhead"><h2>${tr("Список")}</h2></div>
    <p class="sub">${tr("Плоский список: по умолчанию видно всё живое — дела, рутина, идеи и встречи. Срезом можно оставить что-то одно.")}</p>
    ${awayNote(awayAll())}
    <div class="allbar">
      <input type="text" id="allInput" class="allsearch" placeholder="${tr("Поиск по названию")}"
        autocomplete="off" value="${esc(ALLQUERY)}">
      <span class="ddwrap" data-ddwrap>
        <button class="ddbtn wide" data-act="dd" data-k="allfilter"><span>${
          esc(tr((allFilters().find(x => x[0] === ALLFILTER) || allFilters()[0])[1]))}</span><i class="caret">▾</i></button>
        ${DD === "allfilter" ? `<div class="dd">${allFilters().map(([k, L]) =>
          `<button class="ddrow ${ALLFILTER === k ? "on" : ""}" data-act="allfilterset"
             data-v="${k}"><span>${esc(tr(L))}</span>${ALLFILTER === k ? ddCheck : ""}</button>`).join("")}</div>` : ""}
      </span>
      <span class="ddwrap" data-ddwrap>
        <button class="ddbtn" data-act="dd" data-k="allperiod" title="${tr("Период")}">${CALICON}<span>${
          esc(tr(periodDef()[1]))}</span><i class="caret">▾</i></button>
        ${DD === "allperiod" ? `<div class="dd right">${ALLPERIODS.map(([k, L]) =>
          `<button class="ddrow ${ALLPERIOD === k ? "on" : ""}" data-act="allperiodset"
             data-v="${k}"><span>${esc(tr(L))}</span>${ALLPERIOD === k ? ddCheck : ""}</button>`).join("")}</div>` : ""}
      </span>
      ${ALLFILTER === "done" ? "" : `<span class="ddwrap" data-ddwrap>
        <button class="ddbtn" data-act="dd" data-k="allsort" title="${tr("Порядок")}">${SORTICON}<span>${
          esc(tr(sortDef()[1]))}</span><i class="caret">▾</i></button>
        ${DD === "allsort" ? `<div class="dd right">${ALLSORTS.map(([k, L]) =>
          `<button class="ddrow ${ALLSORT === k ? "on" : ""}" data-act="allsortset"
             data-v="${k}"><span>${esc(tr(L))}</span>${ALLSORT === k ? ddCheck : ""}</button>`).join("")}</div>` : ""}
      </span>`}
    </div>
    <p class="listcount" id="allCount"></p>
    <div id="allList"></div>`;
  const inp = document.getElementById("allInput");
  if (inp && inp.addEventListener) {
    inp.addEventListener("input", () => { ALLQUERY = inp.value; drawAllList(); });
    if (ALLFOCUS) { inp.focus(); ALLFOCUS = false; }
  }
  drawAllList();
}
let ALLFOCUS = false;

/* ── СДЕЛАННОЕ ────────────────────────────────────────────────────────
   Сделанное не исчезает. Во-первых, чтобы можно было вернуть промах.
   Во-вторых, потому что «я сегодня ничего не сделала» — почти всегда
   неправда, и это единственный экран, который может это доказать.   */
const MONTHS_RU = ["января","февраля","марта","апреля","мая","июня","июля",
                   "августа","сентября","октября","ноября","декабря"];
const MONTHS_EN = ["January","February","March","April","May","June","July",
                   "August","September","October","November","December"];
/* «5 ноября» и «5 November»: число впереди в обоих языках, разница
   только в самом слове. Родительный падеж — забота русского списка. */
const MONTHS = new Proxy({}, { get: (_, i) =>
  (CURLANG === "en" ? MONTHS_EN : MONTHS_RU)[i] });
function formatDay(iso) {
  if (!iso) return tr("когда-то раньше");
  if (iso === today()) return tr("сегодня");
  if (iso === addDays(today(), -1)) return tr("вчера");
  if (iso === addDays(today(), 1)) return tr("завтра");
  const d = new Date(iso + "T12:00:00");
  return d.getDate() + " " + MONTHS[d.getMonth()];
}

function doneEntries() {
  const out = [];
  S.items.forEach(i => {
    if (i.draft) return;
    /* Рутины здесь нет намеренно: она отмечается каждый день, и за
       месяц это сотня записей, под которыми тонет всё настоящее. Её
       история и так видна в ней самой — недельные точки и карта
       четырёх недель. Архив отвечает «что я сделала», а не «сколько
       раз я почистила зубы».
       byDay — отметка живёт в истории по дням: вернуть можно только
       сегодняшнюю, потому что галочка работает с сегодняшним днём. */
    if (isRoutine(i)) return;
    if (repeats(i)) {
      i.repeat.history.forEach(d => out.push({ it: i, when: d, byDay: true }));
    } else if (i.done) {
      out.push({ it: i, when: i.doneAt || null, byDay: false });
    }
  });
  return out.sort((a, b) => String(b.when || "").localeCompare(String(a.when || "")));
}

function doneRow(e, canUndo) {
  return `<div class="card mini done">
    <div class="card-top">
      <button class="tick" ${canUndo ? `data-act="undo" data-id="${e.it.id}"` : ""}></button>
      <div class="title" data-act="opendone" data-id="${e.it.id}" data-when="${e.when || ""}"
        style="cursor:pointer" title="${tr("Посмотреть")}">${esc(e.it.title)}</div>
      ${sphereTags(e.it)}
      ${canUndo ? `<button class="undo" data-act="undo" data-id="${e.it.id}">${tr("вернуть")}</button>` : ""}
    </div></div>`;
}

/* Сделанное — один из срезов «Всё», а не отдельная вкладка: это тот же
   список, просто с другим состоянием. Но группировка по дням и счёт за
   неделю остаются — у них своя работа: доказывать, что день не пустой. */
function doneListHTML(q) {
  const words = norm(q || "");
  const all = doneEntries()
    .filter(e => inPeriod(e.when))
    .filter(e => !q
      || e.it.title.toLowerCase().indexOf(q.toLowerCase()) >= 0
      || words.every(w => norm(e.it.title).some(v => v.indexOf(w) === 0)));
  const days = [];
  all.forEach(e => { if (days.indexOf(e.when) < 0) days.push(e.when); });
  const onDay = d => all.filter(e => e.when === d);
  return `${days.length ? days.slice(0, 40).map(d => `<div class="dayhead">${formatDay(d)}</div>` +
        onDay(d).map(e => doneRow(e, d === today() || !e.byDay)).join("")).join("")
      : `<div class="empty" style="padding:30px 20px">${tr("Здесь появится всё, что вы отметите сделанным.")}</div>`}`;
}

/* ── КАЛЕНДАРЬ ───────────────────────────────────────────────────────
   Ось времени. Три приближения: день, неделя, месяц. Показывает то,
   у чего есть конкретный день — встречи и дедлайны.                 */
const MONTHS_NOM_RU = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль",
                       "Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTHS_NOM = new Proxy({}, { get: (_, i) =>
  (CURLANG === "en" ? MONTHS_EN : MONTHS_NOM_RU)[i] });
const WD_BY_DAY_RU = ["вс","пн","вт","ср","чт","пт","сб"];
const WD_BY_DAY_EN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WD_BY_DAY = new Proxy({}, { get: (_, i) =>
  (CURLANG === "en" ? WD_BY_DAY_EN : WD_BY_DAY_RU)[i] });
const WD_FULL_RU = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const WD_FULL_EN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const WD_FULL = new Proxy({}, { get: (_, i) =>
  (CURLANG === "en" ? WD_FULL_EN : WD_FULL_RU)[i] });
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);

function todayWidget() {
  const d = new Date(today() + "T12:00:00");
  return `<span class="todaydate">${WD_FULL[d.getDay()]},
    <span class="num">${d.getDate()}</span> ${MONTHS[d.getMonth()]}</span>`;
}

let CALMODE = savedView.calMode || "week", CALANCHOR = null;

const pad2 = n => (n < 10 ? "0" : "") + n;
const wdOrder = () => Array.from({ length: 7 }, (_, i) => (S.cfg.weekStart + i) % 7);
const startOfWeek = iso => addDays(iso,
  -((new Date(iso + "T12:00:00").getDay() - S.cfg.weekStart + 7) % 7));
const anchor = () => CALANCHOR || today();

function calDays() {
  if (CALMODE === "day") return { days: [anchor()], month: null };
  if (CALMODE === "week") {
    const s = startOfWeek(anchor());
    return { days: Array.from({ length: 7 }, (_, i) => addDays(s, i)), month: null };
  }
  const d = new Date(anchor() + "T12:00:00");
  const y = d.getFullYear(), m = d.getMonth();
  const first = y + "-" + pad2(m + 1) + "-01";
  const inMonth = new Date(y, m + 1, 0).getDate();
  const start = startOfWeek(first);
  const lead = Math.round((new Date(first + "T12:00:00") - new Date(start + "T12:00:00")) / 864e5);
  const cells = Math.ceil((lead + inMonth) / 7) * 7;
  return { days: Array.from({ length: cells }, (_, i) => addDays(start, i)), month: m };
}

/* На день попадают встречи и дедлайны. Рутины сюда не попадают:
   у рутины нет конкретного дня, только расписание — её место в «Сегодня». */
const calItems = iso => here().filter(i => !isRoutine(i)
    && (i.due === iso || repeatOn(i, iso)))
  .sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99"));

function calTitle() {
  if (CALMODE === "day") {
    const d = new Date(anchor() + "T12:00:00");
    return cap1(WD_FULL[d.getDay()]) + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
  }
  if (CALMODE === "month") {
    const d = new Date(anchor() + "T12:00:00");
    return MONTHS_NOM[d.getMonth()] + " " + d.getFullYear();
  }
  const s = startOfWeek(anchor()), e = addDays(s, 6);
  const ds = new Date(s + "T12:00:00"), de = new Date(e + "T12:00:00");
  return ds.getMonth() === de.getMonth()
    ? ds.getDate() + "–" + de.getDate() + " " + MONTHS[de.getMonth()]
    : ds.getDate() + " " + MONTHS[ds.getMonth()] + " – " + de.getDate() + " " + MONTHS[de.getMonth()];
}

/* Клетка календаря знает свой день — и галочка обязана знать тоже.
   У повторяющейся записи одной даты нет: та же встреча стоит в
   десятке клеток, и «отметить» без указания дня означало отметить
   сегодняшний — в прошлом четверге при этом не менялось ничего. */
function calItemHTML(i, compact, iso) {
  /* Полоска слева — «что это»: в сетке времени важнее вид дела, чем
     сфера. Цвета расшифрованы в легенде под календарём.             */
  const col = kindColor(i);
  const label = compact && i.title.length > 24 ? i.title.slice(0, 23) + "…" : i.title;
  const rep = repeats(i), was = rep && repeatDone(i, iso);
  /* Отметить будущее нельзя: «состоялась» про завтра — бессмыслица. */
  const canTick = !rep || iso <= today();
  return `<div class="calrow${was ? " done" : ""}" draggable="true" data-drag="${i.id}">
    ${canTick ? `<button class="caltick${was ? " on" : ""}" data-act="${
      rep ? "toggleon" : "toggle"}" data-id="${i.id}" data-d="${iso}"
      title="${rep ? tr("Отметить, что состоялась в этот день") : tr("Отметить сделанным")}"></button>`
      : `<span class="caltick none"></span>`}
    <button class="calitem ${isAppt(i) ? "appt" : "dl"}" data-act="open" data-id="${i.id}"
      style="border-left-color:${col}" title="${esc(i.title)}">${
        i.time ? `<span class="t">${esc(i.time)}</span>` : ""}${esc(label)}${stepMini(i)}</button>
  </div>`;
}

/* Зум на один день: всё, что на него назначено, целиком и без обрезки. */
function dayRowHTML(i, iso) {
  const rep = repeats(i), was = rep && repeatDone(i, iso);
  const canTick = !rep || iso <= today();
  return `<div class="dayrow${was ? " done" : ""}">
    ${canTick ? `<button class="tick${was ? " on" : ""}" data-act="${
      rep ? "toggleon" : "toggle"}" data-id="${i.id}" data-d="${iso}"
      title="${rep ? tr("Отметить, что состоялась в этот день") : tr("Отметить сделанным")}"></button>`
      : `<span class="tick none"></span>`}
    <span class="daytime${i.time ? "" : " none"}">${i.time ? esc(i.time) : ""}</span>
    ${kindIcon(i)}
    <button class="suggname" data-act="open" data-id="${i.id}">${
      esc(i.title)}${workDot(i)}</button>
    ${stepBadge(i)}
    ${sphereTags(i)}
    ${i.place ? placeTag(i.place) : ""}
    ${i.person && !isSelf(i.person) ? `<span class="tag place">${iconSVG("person", "currentColor")}${esc(i.person)}</span>` : ""}
  </div>${i.notes ? `<div class="daynote">${esc(String(i.notes).slice(0, 120))}</div>` : ""}`;
  /* Заметка идёт отдельной строкой под делом — с воздухом сверху и без
     разделителя: она поясняет дело, а не начинает новый раздел.     */
}

function renderCalendarDay(bar) {
  const d = anchor();
  const list = calItems(d);
  const past = d < today();
  /* Только для сегодняшнего дня: показываем ещё и то, что вы взяли делать,
     хотя срок у него другой. Календарь отвечает «что назначено», «Сегодня»
     — «что я делаю»; в дневном разрезе полезно видеть обе половины.   */
  const taken = d === today()
    ? todayItems().mine.filter(i => list.indexOf(i) < 0) : [];
  view.innerHTML = `<h2>${tr("Календарь")}</h2>
    <p class="sub">${tr("Один день целиком.")}</p>
    ${awayNote(awayAll())}
    ${bar}
    <div class="daybox">
      <div class="dayhd">
        <p class="lbl" style="margin:0">${tr("Назначено на этот день")}</p>
        ${past ? "" : `<button class="addhere" data-act="newhere" data-due="${d}"
          title="${tr("Создать дело на этот день")}">＋</button>`}
      </div>
      ${list.length ? list.map(i => dayRowHTML(i, d)).join("")
        : `<div class="empty" style="padding:24px 20px">${tr("На этот день ничего не назначено.")}</div>`}
      ${taken.length ? `<p class="lbl" style="margin:22px 0 6px">${tr("Взято на сегодня")}
          <span class="apptno">${tr("срок у них другой")}</span></p>
        ${taken.map(i => dayRowHTML(i, d)).join("")}` : ""}
    </div>`;
}

function renderCalendar() {
  /* Слева — приближение, по центру — период со стрелками, справа —
     возврат к сегодня. Стрелки стоят вплотную к заголовку: понятно,
     что листают именно его.                                         */
  const bar = `<div class="calbar">
      <div class="axis">
        ${[["day",tr("день")],["week",tr("неделя")],["month",tr("месяц")]].map(([k, L]) =>
          `<button data-act="calmode" data-m="${k}" class="${CALMODE === k ? "on" : ""}">${L}</button>`).join("")}
      </div>
      <div class="calnav">
        <button class="navarrow" data-act="calnav" data-d="prev" title="${tr("Назад")}">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
        <div class="caltitle">${calTitle()}</div>
        <button class="navarrow" data-act="calnav" data-d="next" title="${tr("Вперёд")}">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button>
      </div>
      <button class="navtoday ${anchor() === today() ? "on" : ""}"
        data-act="calnav" data-d="today">${tr("сегодня")}</button>
    </div>`;
  if (CALMODE === "day") return renderCalendarDay(bar);

  const { days, month } = calDays();
  const cap = CALMODE === "week" ? 99 : 3;
  const total = days.reduce((n, d) => n + calItems(d).length, 0);

  view.innerHTML = `<h2>${tr("Календарь")}</h2>
    <p class="sub">${tr("Встречи и дедлайны.")}</p>
    ${awayNote(awayAll())}
    <p class="draghint">${tr("Дело можно перетащить на другой день — дедлайн переедет вместе с ним.")}</p>
    ${bar}
    <div class="calhead">${wdOrder().map(d => `<div>${WD_BY_DAY[d]}</div>`).join("")}</div>
    <div class="calgrid ${CALMODE}">${days.map(d => {
      const list = calItems(d), dd = new Date(d + "T12:00:00");
      const out = month !== null && dd.getMonth() !== month;
      const past = d < today();
      return `<div class="calcell ${d === today() ? "today" : ""} ${out ? "dim" : ""} ${
        past ? "past" : ""}"${past ? "" : ` data-drop-due="${d}"`}>
        <div class="caldate">
          <span data-act="calday" data-d="${d}" style="cursor:pointer"
            title="${tr("Открыть этот день целиком")}">${dd.getDate()}${
            CALMODE === "week" ? " " + MONTHS[dd.getMonth()] : ""}</span>
          <span class="wd">${WD_BY_DAY[dd.getDay()]}</span>
          ${past ? "" : `<button class="addhere" data-act="newhere" data-due="${d}"
            title="${tr("Создать дело на этот день")}">＋</button>`}
        </div>
        ${list.slice(0, cap).map(i => calItemHTML(i, CALMODE === "month", d)).join("")}
        ${list.length > cap ? `<div class="calmore" data-act="calday" data-d="${d}"
          title="${tr("Открыть этот день целиком")}">${tr("и ещё")} ${list.length - cap}</div>` : ""}
      </div>`;
    }).join("")}</div>
    <div class="callegend">
      ${S.types.filter(t => t.kind !== "routine" && t.kind !== "idea").map(t =>
        `<span><i style="background:var(--kind-${kindToken(t)})"></i>${esc(typeLabel(t))}</span>`).join("")}
      <span style="margin-left:10px"><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>${tr("фон: со временем")}</span>
      <span><i style="background:var(--warm-soft);border:1px solid var(--warm)"></i>${tr("фон: к сроку")}</span>
    </div>
    ${total ? "" : `<div class="empty">${tr("В этом периоде ничего не назначено.")}</div>`}`;
}

/* ── МАТРИЦА ─────────────────────────────────────────────────────────
   Порядок и формулировки: строки это срочность,
   столбцы это важность.                                             */
function renderMatrix() {
  /* Рутины и идеи в матрицу не попадают: одна не про конкретный день,
     другая ещё не обязательство. Остальное — всё, включая неразобранное:
     у него тоже есть дедлайн, и его тоже надо разложить.             */
  const pool = here().filter(i => !isRoutine(i) && !isIdea(i) && !isRemind(i));
  const q = { iu: [], in: [], nu: [], nn: [] };
  pool.forEach(i => q[quadrant(i)].push(i));
  /* Внутри клетки — по дедлайну: ближайшее сверху, бессрочное внизу. */
  Object.keys(q).forEach(k => q[k].sort((a, b) => sortKey(a).localeCompare(sortKey(b))));

  const box = (k, title, sub, hero) => `
    <div class="quad ${hero ? "hero" : ""}" data-drop-quad="${k}">
      <h3>${title}<span
        class="qcount">${q[k].length}</span><button class="addhere"
        data-act="newhere" data-quad="${k}" title="${tr("Создать дело сразу в этой клетке")}">＋</button></h3>
      <p class="qs">${hero ? `<b class="heromark">${tr("Главная клетка:")}</b> ` : ""}${sub}</p>
      <ul>${q[k].length
        ? q[k].map(i => `<li draggable="true" data-drag="${i.id}">
            <button class="qtick" data-act="toggle" data-id="${i.id}" title="${tr("Отметить сделанным")}"></button>
            <span class="qname" data-act="open" data-id="${i.id}">${kindIcon(i)}${esc(i.title)}${workDot(i)}
              <span style="color:var(--dim)">· ${esc((i.spheres || []).join(" · "))}</span>${
              ""}</span>
            ${stepBadge(i)}
            ${i.due ? `<span class="qdue">${sandFor(i)}${dateLabel(i)}</span>` : ""}</li>`).join("")
        : `<li class="quadempty">${tr("Пока ничего нет")}</li>`}</ul>
    </div>`;

  view.innerHTML = `<h2>${tr("Важное и срочное")}</h2>
    <p class="sub">${tr("Строки — срочность: считается из дедлайна и меняется только вместе с ним. Столбцы — важность: это всегда ваше решение. По умолчанию дело важное — вы его записали, значит оно зачем-то нужно.")}</p>
    ${awayNote(awayAll())}
    <p class="draghint">${tr("Перетащите дело в соседний столбец, чтобы сменить важность. Строку перетаскиванием не изменить — для этого нужен другой дедлайн.")}</p>
    <div class="matrix">
      <div></div>
      <div class="mhead">${tr("важное")}</div>
      <div class="mhead">${tr("неважное")}</div>

      <div class="mside">${tr("срочное")}</div>
      ${box("iu", tr("Срочное важное"), tr("Делать сейчас. Больше ничего в этой клетке решать не надо"))}
      ${box("nu", tr("Срочное неважное"), tr("Дата подошла у того, что вы сами назвали неважным. Кандидаты отдать или отпустить"))}

      <div class="mside">${tr("несрочное")}</div>
      ${box("in", tr("Несрочное важное"), tr("Здесь лежит вся ваша жизнь — и именно это вечно проигрывает срочной ерунде. Поэтому одно дело отсюда каждый день стоит в «Предлагаю»"), true)}
      ${box("nn", tr("Несрочное неважное"), tr("Пусть лежит. Ничего страшного не происходит"))}
    </div>`;
}


/* ── КАРТА ───────────────────────────────────────────────────────────
   Одни и те же задачи, три разных центра. Ничего не копируется —
   карта просто перерисовывается. Поэтому «правильные категории»
   больше не нужно угадать с первого раза.                           */
const AXES = { sphere: "по сферам", place: "по местам", person: "по людям",
               type: "по «что это»" };
const NOPLACE = "без места";

const axisValues = a => a === "place" ? S.places.concat([NOPLACE])
  : a === "person" ? S.people
  : a === "type" ? S.types.map(t => t.key) : S.spheres;
/* Ветка вида хранится ключом, а показывается именем — имена в «Что это»
   переименовываются, и подписи на карте следуют за ними сами.        */
const axisLabel = v => AXIS === "type"
  ? typeLabel(S.types.find(t => t.key === v) || { name: v, key: v }) : tr(v);
const inAxis = (it, v) => AXIS === "place" ? (it.place || NOPLACE) === v
  : AXIS === "person" ? (it.person || S.people[0]) === v   // без пометки — значит моё
  : AXIS === "type" ? typeDef(it.type).key === v   // с запасом: битый вид падает на первый
  : (it.spheres || []).indexOf(v) >= 0;      // на оси сфер дело бывает в нескольких
/* Дело без сферы на осях мест и людей видно как любое другое: место и
   человек у него есть. Прячет его только ось сфер — прятать больше нечего. */
const itemsIn = v => here().filter(i => inAxis(i, v));

/* Ширина подписи. В браузере меряем настоящим шрифтом, в проверках
   холста нет — там оцениваем по числу знаков. Раскладка карты держится
   на этих числах, поэтому важно, чтобы способ был один и тот же.    */
const MEASURE = (() => {
  try {
    const c = document.createElement("canvas");
    const g = c && c.getContext && c.getContext("2d");
    return g && g.measureText ? g : null;
  } catch (e) { return null; }
})();
function textW(t, size, weight) {
  const s = String(t == null ? "" : t);
  if (!MEASURE) return s.length * size * 0.56;
  MEASURE.font = weight + " " + size + "px Manrope, sans-serif";
  return MEASURE.measureText(s).width;
}

/* Разметка карты. Числа собраны в одном месте: раскладка считается
   дважды — при замере и при отрисовке, — и разъехаться им нельзя. */
const M_PILL_H = 34, M_PADX = 17, M_LEAF_H = 30, M_BR_MIN = 52;
const M_COL = 236, M_TRUNK = 152, M_COMB = 34, M_TXT = 22;
const mwire = (d, dot) => `<path d="${d}" style="fill:none;stroke:var(--wire);`
  + `stroke-width:${dot ? 1.8 : 1.6};stroke-linecap:round`
  + `${dot ? ";stroke-dasharray:1.6 5" : ""}"/>`;

/* Масштаб и сдвиг. Карта рисуется вокруг точки (0,0), поэтому
   scale() увеличивает ровно от центра — как и ожидаешь.            */
let ZOOM = 1, PAN = { x: 0, y: 0 };
/* Развёрнута ли карта во весь экран. Нарочно не запоминается между
   заходами: вернувшись через день, находишь карту на весь экран и не
   понимаешь, что случилось.                                        */
let MAPFULL = false;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function renderMap() {
  /* Пустые ветки тоже видны — чтобы было куда положить первое дело.
     Прячется только пустое «без места»: это не ветка, а остаток.    */
  const vals = axisValues(AXIS).filter(v => v !== NOPLACE || itemsIn(v).length);

  /* Дерево влево-вправо, а не круг. Круг упирался в себя: десять дел в
     ветке раздвигали соседей по окружности, и карта расползалась вширь.
     У дерева много дел — это просто длиннее столбец.
     Стороны набираем по очереди, кладя следующую ветку туда, где пока
     ниже: иначе один бок свисает намного дальше другого.            */
  const rows = vals.map(v => {
    const items = itemsIn(v);
    const label = axisLabel(v) + " (" + items.length + ")";
    const open = isOpen(v);
    return { v, items, label, open,
      pw: textW(label, 13.5, 700) + M_PADX * 2,
      h: open ? Math.max(M_BR_MIN, items.length * M_LEAF_H + 16) : M_BR_MIN };
  });
  const bySide = { r: [], l: [] }, hsum = { r: 0, l: 0 };
  rows.forEach(b => { const k = hsum.r <= hsum.l ? "r" : "l";
    bySide[k].push(b); hsum[k] += b.h; });
  ["r", "l"].forEach(k => { let y = -hsum[k] / 2;
    bySide[k].forEach(b => { b.dir = k === "r" ? 1 : -1; b.cy = y + b.h / 2; y += b.h; }); });

  /* Считаем реальные границы всего нарисованного, включая подписи.
     Раньше поле было фиксированным, и длинные названия уезжали за край. */
  const bb = { x0: 0, y0: 0, x1: 0, y1: 0 };
  const grow = (x0, y0, x1, y1) => {
    bb.x0 = Math.min(bb.x0, x0); bb.y0 = Math.min(bb.y0, y0);
    bb.x1 = Math.max(bb.x1, x1); bb.y1 = Math.max(bb.y1, y1);
  };

  const rootLabel = tr(AXES[AXIS]);
  const rSide = Math.max(textW(rootLabel, 17, 800) + 46, 104), rHalf = rSide / 2;
  grow(-rHalf, -rHalf, rHalf, rHalf);

  /* Связи собираем отдельно и выводим ПЕРВЫМИ: иначе линия, дорисованная
     поверх, просвечивала бы сквозь плашку.                          */
  let links = "", svg = "";

  /* От центра к веткам — та же гребёнка, что от ветки к делам: ствол до
     общей стойки, стойка, отвод. Одна конструкция на обоих уровнях. */
  [1, -1].forEach(dir => {
    const on = rows.filter(b => b.dir === dir);
    if (!on.length) return;
    const sx = dir * M_TRUNK, ys = on.map(b => b.cy);
    links += mwire(`M${dir * rHalf} 0 H${sx}`);
    if (on.length > 1)
      links += mwire(`M${sx} ${Math.min.apply(null, ys)} V${Math.max.apply(null, ys)}`);
    on.forEach(b => { links += mwire(`M${sx} ${b.cy} H${dir * M_COL}`); });
  });

  rows.forEach(b => {
    const dir = b.dir, col = colorOf(AXIS, b.v);
    const inner = dir * M_COL, outer = inner + dir * b.pw;
    const px = dir > 0 ? inner : outer;
    /* Ветка — плашка с заливкой и белой подписью, число дел в скобках.
       Цвет кладём в style: var() в SVG-атрибутах не работает.        */
    svg += `<g class="branch" data-act="branch" data-val="${esc(b.v)}">
      <rect x="${px}" y="${b.cy - M_PILL_H / 2}" width="${b.pw}" height="${M_PILL_H}" rx="${
        M_PILL_H / 2}" style="fill:${col}"></rect>
      <text x="${px + b.pw / 2}" y="${b.cy + 4.5}" font-size="13.5" font-weight="700"
        text-anchor="middle" style="fill:#fff" pointer-events="none">${esc(b.label)}</text>
    </g>`;
    grow(px - 4, b.cy - M_PILL_H / 2 - 4, px + b.pw + 4, b.cy + M_PILL_H / 2 + 4);

    if (!b.open) return;

    const spine = outer + dir * M_COMB;
    const y0 = b.cy - b.items.length * M_LEAF_H / 2 + M_LEAF_H / 2;
    const y1 = y0 + (b.items.length - 1) * M_LEAF_H;
    links += mwire(`M${outer} ${b.cy} H${spine}`, true);
    if (b.items.length > 1) links += mwire(`M${spine} ${y0} V${y1}`, true);

    b.items.forEach((it, k) => {
      const ly = y0 + k * M_LEAF_H, tx = spine + dir * M_TXT;
      const w = textW(it.title, 13, 500);
      links += mwire(`M${spine} ${ly} H${tx - dir * 4}`, true);
      /* Прозрачный прямоугольник — только чтобы было куда нажать и за
         что взяться: сам лист это просто текст, без рамки.          */
      svg += `<g class="leaf">
        <rect x="${dir > 0 ? tx - 6 : tx - w - 6}" y="${ly - 13}" width="${w + 12}" height="26"
          rx="7" style="fill:transparent" data-act="open" data-id="${it.id}"></rect>
        <text x="${tx}" y="${ly + 4.5}" font-size="13" font-weight="500"
          text-anchor="${dir > 0 ? "start" : "end"}" style="fill:var(--ink)"
          data-act="open" data-id="${it.id}">${esc(it.title)}</text>
      </g>`;
      grow(Math.min(tx, tx + dir * (w + 14)), ly - 15,
           Math.max(tx, tx + dir * (w + 14)), ly + 15);
    });
  });

  /* Корень — такая же плашка, что и ветки, только квадратная и того же
     радиуса углов. Цвет вне восьмёрки сфер: любой сферный превратил бы
     его в девятую сферу.                                            */
  svg = links + svg
    + `<rect x="${-rHalf}" y="${-rHalf}" width="${rSide}" height="${rSide}"
        rx="${M_PILL_H / 2}" style="fill:var(--maproot)"></rect>
      <text x="0" y="6" font-size="17" font-weight="800" text-anchor="middle"
        style="fill:#fff" pointer-events="none">${esc(rootLabel)}</text>`;

  /* Симметричное поле вокруг центра — чтобы увеличение шло от середины */
  const halfW = Math.max(Math.abs(bb.x0), Math.abs(bb.x1)) + 26;
  const halfH = Math.max(Math.abs(bb.y0), Math.abs(bb.y1)) + 26;

  const openVals = vals.filter(isOpen);
  view.innerHTML = `<h2>${tr("Карта")}</h2>
    <p class="sub">${tr("Здесь ничего не теряется. Раскрытые ветки такими и остаются — можно раскрыть все сразу и увидеть картину целиком.")}</p>
    ${awayNote(awayAll())}
    <div class="mapstage${MAPFULL ? " full" : ""}">
      <div class="maprow">
        <div class="axis">${Object.keys(AXES).map(a =>
          `<button data-act="axis" data-a="${a}" class="${AXIS === a ? "on" : ""}">${tr(AXES[a])}</button>`).join("")}</div>
        <div class="maptools">
          <button data-act="openall" data-v="all" class="wide">${tr("раскрыть все")}</button>
          <button data-act="openall" data-v="none" class="wide">${tr("свернуть все")}</button>
          <button data-act="zoom" data-d="out" title="${tr("Отдалить")}">−</button>
          <button data-act="zoom" data-d="in" title="${tr("Приблизить")}">+</button>
          <button data-act="zoom" data-d="fit" class="wide" title="${tr("Показать всё")}">${tr("уместить")}</button>
          <button data-act="mapfull" class="wide" title="${MAPFULL
            ? tr("Вернуть карту в страницу") : tr("Отдать карте всё окно")}">${
            MAPFULL ? tr("свернуть") : tr("во весь экран")}</button>
        </div>
      </div>
      <svg id="map" viewBox="${-halfW} ${-halfH} ${halfW * 2} ${halfH * 2}"
           preserveAspectRatio="xMidYMid meet"><g id="mapG">${svg}</g></svg>
    </div>
    ${openVals.map(v => {
      const list = itemsIn(v);
      const attr = AXIS === "place" ? `data-place="${esc(v)}"`
                 : AXIS === "person" ? `data-person="${esc(v)}"`
                 : AXIS === "type" ? `data-type="${esc(v)}"` : `data-sphere="${esc(v)}"`;
      return `<div class="branchhead">
          <h2><span style="display:inline-block;width:11px;height:11px;border-radius:50%;
            background:${colorOf(AXIS, v)};margin-right:9px"></span>${tr("Ветка")} «${esc(axisLabel(v))}»</h2>
          <button class="addhere" data-act="newhere" ${v === NOPLACE ? "" : attr}
            title="${tr("Создать дело в этой ветке")}">＋</button>
        </div>
        <p class="sub">${list.length} ${plural(list.length, "дело", "дела", "дел")}</p>
        ${list.map(mapRowHTML).join("") || `<div class="empty">${tr("Пока ничего нет")}</div>`}`;
    }).join("")}`;

  wireMap(halfW * 2, halfH * 2);
}

const applyMapTransform = () => {
  const g = document.getElementById("mapG");
  if (g) g.setAttribute("transform", `translate(${PAN.x} ${PAN.y}) scale(${ZOOM})`);
};

let mapUnwire = null;

/* Перенос дела на другую ветку. Карта правит принадлежность так же,
   как календарь правит время, а матрица — приоритет.                */
/* Под картой — по строке на дело, как в «Списке»: карта про структуру,
   подробности — по нажатию, в окне просмотра.                       */
function mapRowHTML(i) {
  const takeable = !isRoutine(i) && !isAppt(i) && !isIdea(i);
  return `<div class="allrow">
    ${isRoutine(i) ? `<span class="tick" style="opacity:.35"></span>`
      : `<button class="tick" data-act="toggle" data-id="${i.id}" title="${tr("Отметить сделанным")}"></button>`}
    ${kindIcon(i)}
    <button class="suggname" data-act="open" data-id="${i.id}">${esc(i.title)}</button>
    ${stepBadge(i)}
    ${(i.spheres || []).length > 1 ? `<span class="tag place"
        title="${tr("Одна запись, видна в каждой своей ветке")}">${tr("в")} ${i.spheres.length} ${tr("ветках")}</span>` : ""}
    ${dateLabel(i) ? `<span class="suggdate">${sandFor(i)}${dateLabel(i)}</span>` : ""}
    ${takeable ? (pickedToday(i) ? `<span class="tag">${tr("в дне")}</span>`
      : `<button class="linkbtn" data-act="pin" data-id="${i.id}">＋ ${tr("в сегодня")}</button>`) : ""}
  </div>`;
}


function wireMap(vbWidth, vbHeight) {
  const el = document.getElementById("map");
  if (!el || !el.addEventListener) return;
  applyMapTransform();
  if (mapUnwire) mapUnwire();          // карта перерисовывается — старые слушатели убираем

  el.addEventListener("wheel", e => {
    e.preventDefault();
    ZOOM = clamp(ZOOM * (e.deltaY < 0 ? 1.12 : 1 / 1.12), 0.35, 4);
    applyMapTransform();
  }, { passive: false });

  /* Тащим карту слушателями на окне.
     НЕ через setPointerCapture: захват указателя переносит цель
     последующего клика на саму карту, и нажатия по веткам перестают
     доходить до обработчика.                                        */
  /* На карте таскают только саму карту. Перенос дел с ветки на ветку
     убран: он читался как основное действие, а нужен был редко — метку
     проще сменить в самом деле. Дело на карте теперь только
     открывается, и никаких целей для броска считать не надо.       */
  let drag = null, moved = 0;
  const onDown = e => {
    drag = { x: e.clientX, y: e.clientY, px: PAN.x, py: PAN.y };
    moved = 0; el.classList.add("grabbing");
  };
  const onMove = e => {
    if (!drag) return;
    const ratio = vbWidth / (el.clientWidth || vbWidth);   // пиксели → единицы карты
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    PAN.x = drag.px + dx * ratio; PAN.y = drag.py + dy * ratio;
    applyMapTransform();
  };
  const onUp = () => {
    if (drag) { drag = null; el.classList.remove("grabbing"); }
  };
  /* если карту тащили — отпускание не считается нажатием на ветку */
  const onClick = e => { if (moved > 5) { e.stopPropagation(); e.preventDefault(); moved = 0; } };

  el.addEventListener("pointerdown", onDown);
  el.addEventListener("click", onClick, true);
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
  mapUnwire = () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
  };
}

/* ── СПРАВОЧНИКИ: сферы, места, люди, виды дел ───────────────────────
   Всё, что раньше было зашито в код, теперь правится руками.
   Общее правило: удаление метки НЕ удаляет дела — они только теряют
   эту метку. Переименование переносит её на все дела разом.         */
/* Поле ищем внутри той же строки, где нажали кнопку, и только потом
   по id — так добавление не зависит от того, что ещё есть на странице. */
function fieldOf(el, id) {
  let inp = null;
  if (el && el.closest) { const box = el.closest(".addrow"); if (box && box.querySelector) inp = box.querySelector("input"); }
  if (!inp && el && el.tagName === "INPUT") inp = el;
  if (!inp) inp = document.getElementById(id);
  return inp;
}
/* Пустое поле больше не молчит: подсвечиваем и ставим курсор. */
function nudge(inp) {
  if (!inp) return;
  if (inp.classList) inp.classList.add("needfill");
  inp.placeholder = tr("Сначала впишите название");
  if (inp.focus) inp.focus();
}
const dup = (list, t, self) => list.some(x => x !== self && String(x).toLowerCase() === t.toLowerCase());

function listSectionHTML(c) {
  return `<h2 style="margin-top:36px">${c.title}</h2>
    <p class="sub">${c.hint}</p>
    <div class="branchlist">
      ${c.rows.map(r => `<div class="brow ${r.dim ? "paused" : ""}">
        ${r.color ? `<div class="dot" style="background:${r.color}"></div>` : ""}
        <div class="nm">${esc(r.label)}<span style="color:var(--dim);font-weight:400"> · ${r.count}</span></div>
        ${r.note || ""}
        ${r.extra || ""}
        <button class="linkbtn" data-act="${c.act}ren" data-v="${esc(r.id)}">${tr("переименовать")}</button>
        <button class="linkbtn danger" data-act="${c.act}del" data-v="${esc(r.id)}">${tr("убрать")}</button>
      </div>`).join("")}
      <div class="brow addrow">
        <input type="text" id="${c.input}" placeholder="${c.ph}">
        <button class="btn primary" data-act="${c.act}add">${tr("Добавить")}</button>
      </div>
    </div>`;
}

/* ── сферы ─────────────────────────────────────────────────────── */
function addSphere(el) {
  const inp = fieldOf(el, "dirNew");
  const t = (inp && inp.value ? inp.value : "").trim();
  if (!t) return nudge(inp);
  if (dup(S.spheres, t)) return alert(tr("Такая сфера уже есть."));
  S.spheres.push(t); inp.value = ""; save(); render(); if (host.innerHTML) openSettings();
}
function renameSphere(old) {
  const inp = document.getElementById("dirName");
  const t = (inp && inp.value ? inp.value : "").trim();
  if (!t || t === old) return;
  if (dup(S.spheres, t, old)) return alert(tr("Такая сфера уже есть."));
  S.items.forEach(i => { i.spheres = (i.spheres || []).map(x => x === old ? t : x); });
  S.spheres = S.spheres.map(x => x === old ? t : x);
  S.open = S.open.map(x => x === old ? t : x);
  save(); render(); if (host.innerHTML) openSettings();
}
function removeSphere(name) {
  const used = S.items.filter(i => (i.spheres || []).indexOf(name) >= 0).length;
  const alone = S.items.filter(i => !i.done && (i.spheres || []).length === 1
    && i.spheres[0] === name).length;
  if (!confirm(tr("Убрать сферу") + " «" + name + "»?" + (used
    ? "\n\n" + used + " " + tr("дел останутся на месте, но потеряют эту метку.")
      + (alone ? "\n" + tr("Из них") + " " + alone + " " + tr("попадут в «Разобрать» — других сфер у них нет.") : "")
    : ""))) return;
  S.items.forEach(i => { i.spheres = (i.spheres || []).filter(x => x !== name); });
  S.spheres = S.spheres.filter(x => x !== name);
  S.open = S.open.filter(x => x !== name);
  save(); render(); if (host.innerHTML) openSettings();
}

/* ── места ─────────────────────────────────────────────────────── */

  if (dup(S.places, t)) return alert(tr("Такое место уже есть."));

}

const KINDNOTE = { choice: "со списком вариантов", routine: "по дням недели",

/* ── СПРАВОЧНИКИ ─────────────────────────────────────────────────────
   Живут в настройках: это то, что настраивают один раз и забывают.  */
/* ── Справочники: второй уровень настроек ────────────────────────────
   Один список за раз, строкой на запись; переименование раскрывается
   прямо в строке. Раньше всё лежало вповалку одной страницей, строки
   не помещались по ширине и окно ездило вбок.                       */
const DIRS = {
  sphere: { title: "Сферы", act: "sph", one: "сферу", colored: true,
    note: "«Убрать сферу» не удаляет дела — они попадают в «Разобрать».",
    list: () => S.spheres,
    count: sp => live().filter(i => (i.spheres || []).indexOf(sp) >= 0).length },
  place: { title: "Места", act: "place", one: "место",
    note: "Дела не пропадут — просто останутся без привязки к месту.",
    list: () => S.places,
    count: p => live().filter(i => i.place === p).length },
  person: { title: "Люди", act: "per", one: "человека",
    note: "Кого касается дело. Дела при убирании остаются на месте.",
    list: () => S.people,
    count: p => live().filter(i => i.person === p).length },
};
let DIRPAGE = null, DIREDIT = null;
/* Справочник правится как форма: снимок при входе, «Сохранить изменения»
   закрепляет, крестик возвращает к снимку. Правки видны сразу — но не
   считаются принятыми, пока не нажата кнопка.                       */
let dirBackup = null, dirSaved = false;
/* Виды дел в снимок не входят: их больше нельзя править. */
const DIRFIELDS = ["spheres", "places", "people", "items", "open", "hereNow"];
function dirSnapshot() {
  const snap = {};
  DIRFIELDS.forEach(k => { snap[k] = JSON.parse(JSON.stringify(S[k])); });
  return snap;
}
/* Есть ли несохранённые правки: сравниваем текущее состояние со
   снимком, сделанным при входе. Кнопка сохранения живёт по этому. */
function dirDirty() {
  if (!dirBackup) return false;
  return DIRFIELDS.some(k => JSON.stringify(S[k]) !== JSON.stringify(dirBackup[k]));
}
function dirRestore() {
  if (!dirBackup) return;
  DIRFIELDS.forEach(k => { S[k] = JSON.parse(JSON.stringify(dirBackup[k])); });
  save();
}

const CHEV = `<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor"

}

function dirPageHTML() {

    <div class="diraddrow">
